      setTimeout(() => { if (S.gameTab === 'maze' && G.phase === 'play') drawMaze(); }, 60);
      setTimeout(() => { if (S.gameTab === 'maze' && G.phase === 'play') drawMaze(); }, 220);
    },
    gameSurah(v) {
      stopGameTimer();
      G.surah = +v;
      G.phase = 'idle';
      paintGame();
    },
    startGame,
    gamePick,
    gameNext,
    mazeForfeitTurn() {
      if (G.playMode !== 'versus' || !G.mz || G.mz.turnLost || G.mz.state === 'win') return;
      handleMazeFailure('fail', `Pemain ${G.vsTurn + 1} menyerah!`);
    },
    mazeNew() {
      if (isVersusMatchComplete()) {
        return finishVersusMatch();
      }
      if (G.playMode === 'versus') {
        const nextTurn = (G.vsTurn + 1) % 2;
        if (G.vsRounds[nextTurn] < G.maxRounds) G.vsTurn = nextTurn;
      }
      roundMaze();
    },
    mazeReset() {
      if (!G.mz || G.playMode === 'versus') return;
      Object.assign(G.mz, { pts: [], visitedCells: [], wordProgress: 0, drawing: false, state: 'idle' });
      mazeStatus();
      drawMaze();
    },
    dismissPwa() { S.pwa = null; render(); },
    async install() {
      if (S.pwa) {
        S.pwa.prompt();
        S.pwa = null;
        render();
      }
    }
  };

  async function soft(update) {
    const calc = document.querySelector('.main > .cal-card');
    document.querySelectorAll('.main > :not(.hd):not(.strip)' + (calc ? ':not(.cal-card), .main > .cal-card > *' : '')).forEach(e => e.classList.add('page-exit'));
    await new Promise(r => setTimeout(r, 120));
    update();
    render('soft');
  }

  for (const k in A) {
    window[k] = async (...a) => {
      try { return await A[k](...a); }
      catch (e) {
        const m = e && e.message ? e.message : String(e);
        msg(/permission denied/i.test(m) ? m + ' (jalankan SQL GRANT di Supabase)' : m);
      }
    };
  }

  async function fetchJ() {
    const c = S.prefs.city_id;
    if (!c) return;
    try {
      const set = new Set(days());
      let all = [];
      for (const m of [...new Set(days().map(d => d.slice(0, 7)))]) {
        const [y, mo] = m.split('-');
        const r = await (await fetch(`https://api.myquran.com/v2/sholat/jadwal/${c}/${y}/${mo}`)).json();
        all = all.concat((r.data && r.data.jadwal) || []);
      }
      const filtered = all.filter(r => set.has(r.date));
      if (filtered.length) {
        S.imsak = filtered;
        return;
      }
    } catch (e) {}

    if (IS_PREVIEW) {
      S.imsak = days().map(d => ({
        date: d,
        imsak: '04:30',
        subuh: '04:40',
        terbit: '05:55',
        dzuhur: '12:00',
        ashar: '15:15',
        maghrib: '18:05',
        isya: '19:15'
      }));
    } else {
      S.imsak = [];
      msg('Gagal memuat jadwal');
    }
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && G.fullscreen) {
      G.fullscreen = false;
      syncFullscreenBodyClass();
      paintGame();
    } else if (S.page === 'game' && S.gameTab === 'maze' && G.phase === 'play') {
      requestAnimationFrame(() => drawMaze());
    }
  });

  window.addEventListener('resize', () => {
    if (S.page === 'game' && S.gameTab === 'maze' && G.phase === 'play') drawMaze();
  });

  // ===== PWA =====
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    S.pwa = e;
    render();
  });

  // ===== Inisialisasi =====
  (async () => {
    try {
      if (!IS_PREVIEW) {
        sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: {
            fetch: (u, o = {}) => {
              const h = new Headers(o.headers);
              if (TOKEN) h.set('x-client-info', 'supabase-js/2 rjtok=' + TOKEN);
              return fetch(u, { ...o, headers: h });
            }
          }
        });
        const { data } = await sb.auth.getSession();
        if (data.session) {
          S.admin = true;
          S.user = { username: data.session.user.email, full_name: 'Admin' };
        } else {
          try { TOKEN = localStorage.getItem('rj_t'); } catch (e) {}
          if (TOKEN) {
            const { data: u, error } = await sb.rpc('me');
            if (error || !u) {
              TOKEN = null;
              try { localStorage.removeItem('rj_t'); } catch (e) {}
            } else S.user = u;
          }
        }
        if (S.admin) S.page = 'admin';
      }
      await boot();
    } catch (e) {
      render();
      msg('Gagal terhubung: ' + (e.message || e));
    }
  })();
})();
</script>
</body>
</html>
