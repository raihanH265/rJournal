<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>reLoad - Ramadhan Jurnal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#4F3FC9">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0}
    button,input,select,textarea{font-family:inherit}
    :root{
      --p:#4F3FC9;
      --pl:rgba(79,63,201,.12);
      --h:#17143A;
      --b:#4A4768;
      --m:#7D7A9A;
      --bd:rgba(255,255,255,.65);
      --bd-s:rgba(79,63,201,.14);
      --bg:#F4F2FA;
      --g:rgba(255,255,255,.58);
      --card-g:rgba(255,255,255,.68);
      --input-g:rgba(255,255,255,.78);
      --s:rgba(255,255,255,.45);
      --pink:#EC4899;
      --pink-l:rgba(236,72,153,.14);
      --gold:#E5A124;
      --ok:#1D9A64;
      --er:#E5484D;
      --sh:0 12px 36px rgba(42,32,115,.08),inset 0 1px 0 rgba(255,255,255,.8);
      --card-sh:0 6px 24px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85);
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme=light]){
        --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
        --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
        --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
        --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
        --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
      }
    }
    :root[data-theme=dark]{
      --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
      --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
      --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
      --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
      --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
    }
    html,body{height:100%;background:var(--bg)}
    #app{position:fixed;inset:0;z-index:999999;overflow:auto;background:var(--bg);color:var(--b);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
    .orb{position:fixed;border-radius:50%;filter:blur(85px);pointer-events:none;z-index:0}
    .o1{width:380px;height:380px;left:-110px;top:52%;background:linear-gradient(135deg,#F9A8D4,#EC4899);opacity:.48}
    .o2{width:420px;height:420px;right:-120px;top:4%;background:linear-gradient(135deg,#BFAFF8,#8E78F2);opacity:.58}
    .o3{width:280px;height:280px;left:38%;top:18%;background:#FBCFE8;opacity:.38}
    .shell{position:relative;z-index:1;display:flex;margin:26px auto;max-width:1240px;min-height:calc(100% - 52px);border-radius:32px;background:var(--g);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--bd);box-shadow:var(--sh)}
    .side{width:256px;flex:none;position:sticky;top:0;align-self:flex-start;padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bd-s);min-height:100%}
    .brand{display:flex;gap:12px;align-items:center;padding:0 8px 20px;color:var(--h);border-bottom:1px solid var(--bd-s);margin-bottom:8px}
    .brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
    .brand small{display:block;color:var(--m);font-size:12px}
    .lg{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,63,201,.3)}
    .nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--b);cursor:pointer;white-space:nowrap;transition:all .2s ease;border:1px solid transparent}
    .nv svg{width:19px;height:19px;stroke-width:2.1;flex:none}
    .nv.on{background:var(--pl);color:var(--p);border-color:rgba(79,63,201,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
    .nv:hover:not(.on){background:var(--s);color:var(--h)}
    .main{flex:1;min-width:0;padding:28px 34px 44px}
    .hd{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .hd h1{font-size:22px;color:var(--h);font-weight:800;letter-spacing:-.02em}
    .hd p{color:var(--m);font-size:13px;margin-top:2px}
    .adm-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .adm-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:12px 0}
    .adm-st{background:var(--input-g);border:1px solid var(--bd);border-radius:18px;padding:14px;display:grid;gap:2px}
    .adm-st span{color:var(--p)}.adm-st b{font-size:26px;color:var(--h);font-weight:800}.adm-st small{color:var(--m);font-size:12px}
    .adm-bars{display:flex;align-items:flex-end;gap:4px;height:72px;margin-top:10px}.adm-bars i{flex:1;background:var(--p);opacity:.75;border-radius:4px 4px 0 0;min-height:3px}
    .as-row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
    .as-row img{width:56px;height:56px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);background:var(--input-g)}
    .as-row label{flex:1;min-width:120px;font-weight:600;color:var(--h)}
    .lg img{width:100%;height:100%;object-fit:contain;border-radius:inherit}.lg-img{height:30px;margin-right:10px;border-radius:7px}
    .gm-thumb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    @media (min-width:801px){.lg-img{display:none}}
    .hd .r{display:flex;gap:10px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card-g);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--h);box-shadow:var(--card-sh)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,var(--p),#6453E0);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 18px;font:600 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(79,63,201,.28);transition:all .2s ease}
    .btn:hover{transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(79,63,201,.36)}
    .btn:active{transform:translateY(0)}
    .btn.s{background:var(--card-g);backdrop-filter:blur(12px);color:var(--p);border:1px solid var(--bd);box-shadow:var(--card-sh)}
    .btn.s:hover{background:var(--pl);border-color:rgba(79,63,201,.25)}
    .btn.w{width:100%;padding:14px;border-radius:16px;margin-top:16px;font-size:14.5px}
    .card{background:var(--card-g);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);border:1px solid var(--bd);border-radius:22px;padding:18px 20px;box-shadow:var(--card-sh);margin-bottom:16px}
    .card>b{color:var(--h);display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;font-weight:700;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .st small{color:var(--m);font-weight:500}
    .st b{font-size:32px;color:var(--p);font-weight:800;margin-top:4px}
    .ok{color:var(--ok)!important}
    .hero{text-align:center;padding:12px 0 8px}
    .orbh{width:116px;height:116px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(217,208,250,.85) 55%,rgba(145,126,242,.9));border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 40px rgba(79,63,201,.28),inset 0 -6px 16px rgba(79,63,201,.2);display:grid;place-items:center;color:var(--p)}
    .hero-img{display:block;margin:0 auto 18px;max-width:200px;max-height:140px;width:auto;height:auto;object-fit:contain}
    .hero h2{font-size:36px;line-height:1.18;font-weight:800;color:var(--h);letter-spacing:-.025em}
    .hero h2 em{font-style:normal;color:var(--p)}
    .hero p{max-width:520px;margin:12px auto;color:var(--b);font-size:14.5px}
    .pill{max-width:680px;margin:20px auto 24px;background:var(--card-g);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:14px 16px 14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;color:var(--h);font-weight:500;transition:all .2s ease}
    .pill:hover{transform:translateY(-2px);border-color:rgba(79,63,201,.3)}
    .sendb{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(79,63,201,.3)}
    .fc{display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .2s ease;margin-bottom:0}
    .fc:hover{transform:translateY(-2px);background:var(--input-g);border-color:rgba(79,63,201,.25)}
    .fc .ico{width:46px;height:46px;flex:none;border-radius:16px;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.15);display:grid;place-items:center}
    .fc b{margin:0 0 2px;font-size:14.5px;display:block}
    .fc small{color:var(--b);font-size:12.5px;line-height:1.4;display:block}
    .fc>span{margin-left:auto;color:var(--m);display:grid;place-items:center}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
    .row>input,.row>select{flex:1;min-width:120px}
    input,select,textarea{font:inherit;color:var(--h);background:var(--input-g);backdrop-filter:blur(10px);border:1px solid var(--bd-s);border-radius:14px;padding:11px 14px;outline:0;width:100%;transition:all .2s}
    input:focus,textarea:focus,select:focus{border-color:var(--p);background:var(--bg);box-shadow:0 0 0 3px var(--pl)}
    textarea{min-height:84px;resize:vertical}
    input[type=checkbox],input[type=radio]{width:auto}

    /* Sembunyikan Scrollbar untuk tampilan bersih */
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none;width:0;height:0}
    .drag-scroll{cursor:grab;user-select:none}
    .drag-scroll.dragging{cursor:grabbing}

    /* Day Strip Pill-in-Groove */
    .strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px;background:var(--s);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:99px;margin-bottom:16px;box-shadow:inset 0 2px 7px rgba(42,32,115,.08),0 2px 10px rgba(42,32,115,.03)}
    .dc{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:99px;padding:8px 16px;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--b);cursor:pointer;transition:all .2s ease;white-space:nowrap}
    .dc small{display:inline;font:500 11px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--m);opacity:.85}
    .dc:hover:not(.on){color:var(--h);background:rgba(255,255,255,.35)}
    .dc.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 14px rgba(79,63,201,.34),inset 0 1px 0 rgba(255,255,255,.35)}
    .dc.on small{color:rgba(255,255,255,.88)}
    :root[data-theme=dark] .strip{box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06)}
    :root[data-theme=dark] .dc:hover:not(.on){background:rgba(255,255,255,.06)}

    .it{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--bd-s);cursor:pointer;color:var(--h);font-weight:500;transition:background .15s}
    .it:last-of-type{border-bottom:none}
    .it:hover{background:var(--s);border-radius:12px}
    .it input{accent-color:var(--p);width:19px;height:19px;cursor:pointer}
    .it span{flex:1;display:flex;align-items:center;gap:8px}
    .x{border:0;background:none;color:var(--m);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center;transition:.15s}
    .x:hover{color:var(--er);background:rgba(229,72,77,.1)}
    .bar{flex:1;min-width:80px;height:10px;border-radius:9px;background:var(--pl);overflow:hidden;border:1px solid var(--bd-s)}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:9px;transition:.4s ease}
    .ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--p) 0%,var(--pink) calc(var(--v)*1%),var(--pl) 0);display:grid;place-items:center;flex:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
    .ring b{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;margin:0;font-size:20px;color:var(--h)}
    .wl{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 1.6s forwards}
    @keyframes dr{to{stroke-dashoffset:0}}

    /* Kalender UI */
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .cal-pills{display:inline-flex;align-items:center;gap:4px;padding:5px;border-radius:99px;background:var(--s);border:1px solid var(--bd);box-shadow:inset 0 2px 6px rgba(42,32,115,.07),0 2px 8px rgba(42,32,115,.03);overflow-x:auto;max-width:100%}
    .cal-mp{border:0;background:transparent;color:var(--b);font:700 12.5px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .18s ease;white-space:nowrap}
    .cal-mp:hover:not(.on){color:var(--h);background:rgba(255,255,255,.38)}
    .cal-mp.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 12px rgba(79,63,201,.32),inset 0 1px 0 rgba(255,255,255,.35)}
    .cal-ef{display:inline-flex;align-items:center;padding:6px 13px;border-radius:99px;background:var(--pink-l);color:var(--pink);font-size:11.5px;font-weight:700;border:1px solid rgba(236,72,153,.2);box-shadow:0 2px 8px rgba(236,72,153,.08)}
    .cal-title{font-size:19px;font-weight:800;color:var(--h);letter-spacing:-.02em;margin-bottom:12px}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:left}
    .cal>i{font-style:normal;font-weight:700;color:var(--m);font-size:12px;padding-bottom:4px;text-align:center}
    .cd{position:relative;border-radius:14px;padding:10px 10px 9px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--bd);background:var(--input-g);box-shadow:0 4px 12px rgba(42,32,115,.04),inset 0 1px 0 rgba(255,255,255,.9);transition:.18s}
    .cd.out{background:var(--s);box-shadow:inset 0 2px 6px rgba(42,32,115,.06),0 1px 0 rgba(255,255,255,.65);opacity:.82}
    .cd b{display:block;color:var(--h);font-size:14px;font-weight:800;line-height:1.1}
    .cd small{color:var(--m);font-size:10.5px;font-weight:500;display:block;line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cd .cdot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--p)}
    .cd.rm{background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(123,108,246,.12));border-color:rgba(123,108,246,.24);box-shadow:0 5px 14px rgba(79,63,201,.07),inset 0 1px 0 rgba(255,255,255,.95)}
    .cd.rm small{color:var(--p);font-weight:600}
    .cd.td{border:1.5px solid var(--p);box-shadow:0 4px 14px rgba(79,63,201,.16),inset 0 0 0 1px rgba(123,108,246,.2)}
    .cd.eid{background:linear-gradient(135deg,#F9C862,#E5A124);border-color:rgba(255,255,255,.5);box-shadow:0 6px 16px rgba(229,161,36,.28),inset 0 1px 0 rgba(255,255,255,.6)}
    .cd.eid *{color:#332200!important}
    :root[data-theme=dark] .cd{box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.07)}
    :root[data-theme=dark] .cd.out{box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
    :root[data-theme=dark] .cd.rm{background:linear-gradient(145deg,rgba(45,40,86,.75),rgba(123,108,246,.22))}
    .cal-leg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--b);font-weight:500}
    .cal-leg span{display:inline-flex;align-items:center;gap:6px}
    .cal-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .cal-info-card{padding:14px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85)}
    .cal-info-card>b{font-size:13px!important;margin-bottom:8px!important}
    .cal-info-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--h);flex-wrap:wrap}
    .cal-tag{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.18)}
    .cal-tag.syw{background:rgba(229,161,36,.16);color:#B47808;border-color:rgba(229,161,36,.3)}
    :root[data-theme=dark] .cal-tag.syw{color:#F6C358}
    .cal-info-date{color:var(--m);font-size:11.5px;min-width:155px}
    .cal-info-note{color:var(--m);font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd-s)}

    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:separate;border-spacing:0;text-align:center;white-space:nowrap}
    th,td{padding:10px 8px;border-bottom:1px solid var(--bd-s)}
    th{color:var(--m);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
    td.hl-accent{color:var(--p);font-weight:700}
    tr.hl td,.kt-table tr.active-target td{background:linear-gradient(135deg,var(--input-g),var(--pl));color:var(--p);font-weight:700;border-top:1.5px solid var(--p);border-bottom:1.5px solid var(--p);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
    tr.hl td:first-child,.kt-table tr.active-target td:first-child{border-left:1.5px solid var(--p);border-radius:14px 0 0 14px}
    tr.hl td:last-child,.kt-table tr.active-target td:last-child{border-right:1.5px solid var(--p);border-radius:0 14px 14px 0}

    /* Wave Graphic Glassmorphism */
    .wave-glass{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 12px;background:linear-gradient(145deg,var(--input-g),var(--pl));border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(42,32,115,.08);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
    .wave-glass::before,.wave-glass::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(52px);opacity:.42;pointer-events:none}
    .wave-glass::before{background:var(--p);left:-40px;bottom:-55px}
    .wave-glass::after{background:var(--pink);right:-35px;top:-45px}
    .wave-glass-hd{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--h);opacity:.85}

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  // migrasi sekali: salin kunci lama rj_* ke rl_* agar token, tanda baca, dan pengaturan tidak hilang
  try { Object.keys(localStorage).filter(k => k.startsWith('rj_')).forEach(k => { const n = 'rl_' + k.slice(3); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); localStorage.removeItem(k); }); } catch (e) {}

  // KONFIGURASI APLIKASI
  const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
  const SUPABASE_URL = "https://qaogqkltcgjaycazmlym.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xBZJe9R_-R4SdqlpycO4Qw_nA6V3lYc";

  const $ = s => document.querySelector(s);
  const ic = (name, size = 18, cls = '') => `<i data-lucide="${name}" style="width:${size}px;height:${size}px" class="${cls}"></i>`;
  const iso = d => {
    const x = new Date(d);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  };
  const addD = (s, n) => {
    const d = new Date(s + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return iso(d);
  };
  const diff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const today = () => iso(new Date());
  const same = (a, b) => String(a) === String(b);

  const DEF = {
    id: 1,
    hijri_year: 1448,
    ramadan_start: '2027-02-08',
    ramadan_end: '2027-03-09',
    eid_date: '2027-03-10',
    source_note: 'Ikuti ketetapan Pemerintah (Sidang Isbat Kemenag)'
  };

  let S = {
    page: 'home',
    user: null,
    admin: false,
    set: { ...DEF },
    prefs: {},
    day: null,
    cal: null,
    modal: null,
    resetUser: null,
    items: [],
    checks: [],
    til: [],
    haf: [],
    jr: [],
    users: [],
    imsak: null,
    cities: [],
    allCities: null,
    hafSurah: '',
    doaCat: 'Semua',
    doaQ: '',
    vids: [],
    tpls: [],
    anns: [],
    doas: [],
    years: [],
    kajianCat: 'Semua',
    activeVid: null,
    gameTab: 'words',
    hafSurah2: '',
    pwa: null
  };

  let sb = null, TOKEN = null, uid = 0, beatT = null, cdT = null;
  const nid = () => 'p' + (++uid);

  // ===== Lapisan data (Preview = memori lokal, Produksi = Supabase) =====
  const mem = { announcements: [], doa_custom: [], ramadan_years: [], templates: [], kajian_videos: [], app_settings: [], users: [], items: [], checks: [], tilawah_log: [], hafalan_log: [], journal: [], prefs: [] };

  if (IS_PREVIEW) {
    mem.app_settings.push({ ...DEF });
    mem.users.push({ id: 'u1', username: 'demo', full_name: 'Pengguna Demo', last_seen: new Date().toISOString(), created_at: new Date().toISOString() });
  }

  const T = {
    async sel(t, f = {}, c = '*') {
      if (IS_PREVIEW) return mem[t].filter(r => Object.keys(f).every(k => same(r[k], f[k]))).map(r => ({ ...r }));
      const query = () => {
        let q = sb.from(t).select(c);
        for (const k in f) q = q.eq(k, f[k]);
        return q;
      };
      const run = async q => {
        const { data, error } = await q;
        if (error) throw error;
        return data || [];
      };
      const first = await run(query());
      if (first.length < 1000) return first;
      // Supabase membatasi 1000 baris per permintaan: ambil ulang bertahap dengan urutan tetap
      const all = [];
      for (let from = 0; ; from += 1000) {
        const page = await run(query().order('id').range(from, from + 999));
        all.push(...page);
        if (page.length < 1000) return all;
      }
    },
    async ins(t, r) {
      if (IS_PREVIEW) {
        const x = { id: nid(), ...r };
        mem[t].push(x);
        return { ...x };
      }
      const { data, error } = await sb.from(t).insert(r).select().single();
      if (error) throw error;
      return data;
    },
    async upd(t, id, patch) {
      if (IS_PREVIEW) {
        const r = mem[t].find(x => same(x.id, id));
        if (r) Object.assign(r, patch);
        return;
      }
      const { error } = await sb.from(t).update(patch).eq('id', id);
      if (error) throw error;
    },
    async del(t, id) {
      if (IS_PREVIEW) {
        mem[t] = mem[t].filter(r => !same(r.id, id));
        return;
      }
      const { error } = await sb.from(t).delete().eq('id', id);
      if (error) throw error;
    },
    async up(t, r, key) {
      if (IS_PREVIEW) {
        const i = mem[t].findIndex(x => key.split(',').every(k => same(x[k], r[k])));
        if (i < 0) mem[t].push({ id: nid(), ...r });
        else Object.assign(mem[t][i], r);
        return;
      }
      const { error } = await sb.from(t).upsert(r, { onConflict: key });
      if (error) throw error;
    }
  };

  // ===== Helper tampilan =====
  const days = () => {
    const n = diff(S.set.ramadan_start, S.set.ramadan_end) + 1;
    return Array.from({ length: Math.max(n, 1) }, (_, i) => addD(S.set.ramadan_start, i));
  };
  const curDay = () => {
    if (!S.day) {
      const d = days(), t = today();
      S.day = d.includes(t) ? t : d[0];
    }
    return S.day;
  };
  const hdInfo = d => {
    const s = S.set, i = diff(s.ramadan_start, d);
    if (i >= 0 && d <= s.ramadan_end) return { day: i + 1, month: 'Ramadhan' };
    if (i < 0 && i >= -29) return { day: 30 + i, month: 'Sya\'ban' };
    const e = diff(s.eid_date, d);
    if (e >= 0 && e <= 29) return { day: e + 1, month: 'Syawal' };
    return { day: '', month: '' };
  };
  const annSort = L => L.filter(x => x.active !== false).sort((x, y) => String(y.created_at || y.id).localeCompare(String(x.created_at || x.id), undefined, { numeric: true }));
  const pickYear = L => {
    const t = today();
    const a = [...L].sort((x, y) => x.ramadan_start.localeCompare(y.ramadan_start));
    return a.find(y => t <= y.eid_date) || a[a.length - 1] || null;
  };
  const its = k => S.items.filter(i => i.kind === k && S.user && same(i.user_id, S.user.id));
  const isDone = (id, d) => S.checks.find(c => same(c.item_id, id) && c.day === d);
  const getUzurDays = () => Array.isArray(S.prefs.uzur_days) ? S.prefs.uzur_days : [];
  const isUzur = d => getUzurDays().includes(d);
  const pct = (k, d) => {
    if (k === 'ibadah' && isUzur(d)) return 100;
    const a = its(k);
    return a.length ? Math.round(a.filter(i => isDone(i.id, d)).length / a.length * 100) : 0;
  };

  // ===== Streak, lencana & ringkasan mingguan =====
  const dayOk = d => pct('ibadah', d) >= 70;
  const avgPct = ds => { const a = ds.filter(d => !isUzur(d)); return a.length ? Math.round(a.reduce((s, d) => s + pct('ibadah', d), 0) / a.length) : null; };
  // Hari uzur dilewati (tidak menambah, tidak memutus). Hari ini yang belum 70% belum memutus sampai hari berganti.
  function streakInfo() {
    const D = days(), t = today(), P = D.filter(d => d <= t), last = P.length - 1;
    let best = 0, run = 0, cur = 0, i = last;
    P.forEach(d => { if (isUzur(d)) return; if (dayOk(d)) best = Math.max(best, ++run); else run = 0; });
    if (i >= 0 && P[i] === t && !isUzur(t) && !dayOk(t)) i--;
    for (; i >= 0 && (isUzur(P[i]) || dayOk(P[i])); i--) if (!isUzur(P[i])) cur++;
    const week = last >= 0 ? avgPct(P.slice(Math.max(0, last - 6))) : null;
    const prev = last >= 7 ? avgPct(P.slice(Math.max(0, last - 13), last - 6)) : null;
    return { cur, best, week, prev, now: P[last] === t && !isUzur(t) ? pct('ibadah', t) : null };
  }
  function insightCard() {
    const { cur, best, week, prev, now } = streakInfo();
    const pages = S.til.reduce((a, r) => a + (+r.pages || 0), 0);
    const zi = S.haf.filter(r => r.type === 'ziyadah').reduce((a, r) => a + Math.max(0, r.ayat_to - r.ayat_from + 1), 0);
    const B = [
      ['flame', 'Konsisten 7 hari', best >= 7],
      ['star', 'Hari sempurna 100%', its('ibadah').length > 0 && days().some(d => !isUzur(d) && pct('ibadah', d) === 100)],
      ['book-open-check', 'Khatam 1x', pages >= 604],
      ['brain', 'Ziyadah 100 ayat', zi >= 100],
      ['pen-line', 'Jurnal 7 hari', S.jr.length >= 7]
    ];
    const delta = week != null && prev != null ? ` (${week - prev >= 0 ? '+' : ''}${week - prev}% dari minggu lalu)` : '';
    return `
      <div class="card">
        <b>${ic('flame', 17)} Streak & Lencana</b>
        <p style="margin-bottom:10px"><b style="color:var(--p);font-size:20px">${cur}</b> hari beruntun (ibadah ≥70%) · terbaik ${best} hari${now != null ? `<br>Hari ini <b>${now}%</b>${now >= 70 ? ' · streak aman ✓' : ' · capai 70% agar streak bertambah'}` : ''}${week != null ? `<br>Minggu ini rata-rata <b>${week}%</b>${delta}` : ''}</p>
        <p class="note" style="text-align:left;margin:0 0 10px">Sehari dihitung bila ceklis ibadah ≥70%. Hari uzur dilewati: tidak menambah dan tidak memutus.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${B.map(([i, n, ok]) => `<span class="chip" style="font-size:12px;${ok ? '' : 'opacity:.4'}">${ic(i, 14)} ${n}</span>`).join('')}
        </div>
      </div>`;
  }

  // ===== Pengingat imsak / berbuka / isya =====
  let remindT = [], remindDay = null;
  const remindOn = () => { try { return localStorage.getItem('rl_remind') === '1' && 'Notification' in window && Notification.permission === 'granted'; } catch (e) { return false; } };
  function notify(title, body) {
    const opt = { body, icon: 'icon-192.png', tag: title };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt));
      else new Notification(title, opt);
    } catch (e) {}
  }
  function scheduleReminders() {
    remindT.forEach(clearTimeout);
    remindT = [];
    remindDay = today();
    if (!remindOn() || !S.imsak) return;
    const now = Date.now();
    const at = (date, hm) => { const [h, m] = (hm || '').split(':').map(Number); return new Date(date + 'T00:00:00').setHours(h, m, 0, 0); };
    [remindDay, addD(remindDay, 1)].forEach(date => {
      const r = S.imsak.find(x => x.date === date);
      if (!r) return;
      [[at(date, r.imsak) - 10 * 6e4, 'Sebentar lagi imsak', `Imsak pukul ${r.imsak}. Segera akhiri sahur.`],
       [at(date, r.maghrib), 'Waktunya berbuka', `Adzan Maghrib ${r.maghrib}. Selamat berbuka puasa.`],
       [at(date, r.isya), 'Waktu Isya', 'Siap tarawih? Jangan lupa ceklis ibadah hari ini.']
      ].forEach(([t, ti, b]) => { if (t > now) remindT.push(setTimeout(() => notify(ti, b), t - now)); });
    });
  }

  const overall = k => {
    const D = days();
    return Math.round(D.reduce((s, d) => s + pct(k, d), 0) / D.length);
  };
  const strip = () => `<div class="strip drag-scroll" data-lenis-prevent>${days().map((d, i) => `<button class="dc ${d === S.day ? 'on' : ''}" onclick="setDay('${d}')">Hari ${i + 1} <small>${d.slice(8)}/${d.slice(5, 7)}</small></button>`).join('')}</div>`;
  const msg = t => {
    const e = $('#toast');
    if (!e) return;
    e.textContent = t;
    e.style.display = 'block';
    clearTimeout(msg.t);
    msg.t = setTimeout(() => { e.style.display = 'none'; }, 2800);
  };

  const cityLink = c => `<a class="lk blk" data-id="${esc(c.id)}" data-name="${esc(c.lokasi)}" onclick="pickCity(this.dataset.id,this.dataset.name)">${ic('navigation', 14)} ${esc(c.lokasi)}</a>`;

  function wave(k) {
    const D = days(), W = 600, H = 132, P = D.map((d, i) => [i * W / Math.max(D.length - 1, 1), H - pct(k, d) * (H - 16) / 100 + 10]);
    let p = 'M' + P[0];
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], b = P[i], mx = (a[0] + b[0]) / 2;
      p += `C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`;
    }
    const baseY = H + 12;
    const grid = [25, 50, 75, 100].map(v => {
      const y = H - v * (H - 16) / 100 + 10;
      return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd-s)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    }).join('');
    return `
      <div class="wave-glass">
        <div class="wave-glass-hd">
          <span>Grafik Konsistensi Ibadah</span>
          <span style="color:var(--p)">${overall(k)}%</span>
        </div>
        <svg viewBox="0 0 ${W} ${baseY + 4}" width="100%" preserveAspectRatio="none">
          <defs>
            <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7B6CF6" stop-opacity=".32"/>
              <stop offset="65%" stop-color="#EC4899" stop-opacity=".10"/>
              <stop offset="100%" stop-color="#4F3FC9" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4F3FC9"/>
              <stop offset="55%" stop-color="#7B6CF6"/>
              <stop offset="100%" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
          ${grid}
          <line x1="0" x2="${W}" y1="${baseY}" y2="${baseY}" stroke="var(--bd-s)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
          <path d="${p}L${W},${baseY}L0,${baseY}Z" fill="url(#wg)"/>
          <path d="${p}" fill="none" stroke="url(#ws)" stroke-width="9" stroke-linecap="round" opacity=".32" style="filter:blur(6px)"/>
          <path class="wl" d="${p}" fill="none" stroke="url(#ws)" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </div>`;
  }

  function CL(k) {
    const d = curDay(), a = its(k), p = pct(k, d), uz = k === 'ibadah' && isUzur(d), tl = S.tpls.filter(t => t.kind === k);
    return `
      ${strip()}
      ${k === 'ibadah' ? `
        <div class="uzur-bar">
          <div style="display:flex;align-items:center;gap:9px">
            ${ic('heart-handshake', 18)}

  V.tilawah = () => {

    const slotLogs = S.til.filter(r => r.mode && r.mode.startsWith('slot_'));
    const totalTargetPagesRead = slotLogs.reduce((sum, r) => sum + (+r.pages || 0), 0);
    const totalGoalPages = 604 * t;
    const kp = Math.min(100, Math.round(totalTargetPagesRead / totalGoalPages * 100));
    const man = S.til.filter(r => r.mode === 'manual').sort((a, b) => b.day.localeCompare(a.day));
    return `

          ${[1, 2, 3, 4].map(n => `
            <tr class="${n === t ? 'active-target' : ''}">
              <td><b>${n}x Khatam</b></td>

          <select style="max-width:155px" onchange="savePref({target_khatam:+this.value})">
            ${[1, 2, 3, 4].map(n => `<option value="${n}" ${n === t ? 'selected' : ''}>${n}x Khatam</option>`).join('')}

        <div class="slot-grid">

              <label class="slot-box ${checked ? 'done' : ''}">

  async function iconPng(f, n) {
    const img = new Image();
    img.src = URL.createObjectURL(f);

    const w = img.naturalWidth || n, h = img.naturalHeight || n, k = Math.max(n / w, n / h), c = document.createElement('canvas');

  }
  // Thumbnail: potong dari tengah ke 1200x500 (rasio 2,4:1) lalu kompres (webp, cadangan jpg)
  async function thumbImg(f) {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    const W = 1200, H = 500, w = img.naturalWidth, h = img.naturalHeight, k = Math.max(W / w, H / h), c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    c.getContext('2d').drawImage(img, (W - w * k) / 2, (H - h * k) / 2, w * k, h * k);
    let u = c.toDataURL('image/webp', .85), ext = 'webp';
    if (!u.startsWith('data:image/webp')) { u = c.toDataURL('image/jpeg', .85); ext = 'jpg'; }
    return { b64: u.split(',')[1], ext };

  // Ikon beranda: muat dalam 512x512 tanpa dipotong, transparansi dipertahankan (webp, cadangan png)
  async function fitImg(f, max) {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * k);
    c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let u = c.toDataURL('image/webp', .9), ext = 'webp';

  // Tunggu sampai situs benar-benar menyajikan berkas baru (deploy Pages 1-3 menit). Tanpa ini alamat ?v= baru diminta
  // sebelum deploy selesai, mendapat berkas lama/404, dan tersangkut di cache browser/service worker.
  async function waitDeploy(path, b64) {
    if (!/^https:/.test(location.protocol) || !crypto.subtle) return true;
    const dig = async buf => [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(x => x.toString(16).padStart(2, '0')).join('');
    const want = await dig(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    for (let i = 0; i < 30; i++) {
      try {
        const r = await fetch(path + '?probe=' + Date.now(), { cache: 'no-store' });
        if (r.ok && await dig(await r.arrayBuffer()) === want) return true;
      } catch (e) {}
      await new Promise(ok => setTimeout(ok, 8000));
    }
    return false;
  }
  async function purgeCache(paths) {
    try {
      for (const k of await caches.keys()) {
        const c = await caches.open(k);
        for (const r of await c.keys()) if (paths.some(p => new URL(r.url).pathname.endsWith('/' + p))) await c.delete(r);
      }
    } catch (e) {}
  }
  async function ghPut(path, content, note) {
    const g = ghCfg();
    if (!g.repo || !g.token) throw new Error('isi koneksi GitHub dulu');
    const u = `https://api.github.com/repos/${g.repo}/contents/${path}`, h = { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' };
    // GET sering diberi cache oleh browser/GitHub (sha basi -> "does not match"): no-store + cap waktu, ulangi sekali bila bentrok
    for (let n = 0; ; n++) {
      const cur = await fetch(u + '?ref=' + encodeURIComponent(g.branch) + '&_=' + Date.now(), { headers: h, cache: 'no-store' });
      var w = await fetch(u, { method: 'PUT', headers: h, body: JSON.stringify({ message: note, content, branch: g.branch, sha: cur.ok ? (await cur.json()).sha : undefined }) });
      if (w.ok || n || ![409, 422].includes(w.status)) break;
    }
    if (!w.ok) throw new Error((await w.json().catch(() => ({}))).message || 'HTTP ' + w.status);
  }

  const plain = s => s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '').replace(/\u0671/g, '\u0627');

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function stopGameTimer() {

  async function getJSON(url) {

  const NET_HINT = 'Jika internet Anda normal, permintaan ke situs lain kemungkinan diblokir oleh pratinjau/sandbox atau ekstensi pemblokir iklan. Buka lewat hosting https:// atau pakai versi offline (bundle-quran.mjs).';
  const QD = () => window.QURAN_DATA || null; // data Al-Qur'an tertanam (versi offline)
  async function surahText(n) {

    throw err;
  }

  const OPT = {
    playMode: [['solo', 'Solo'], ['versus', 'Versus 2 Pemain'], ['online', 'Versus Online']],

  const isVs = () => G.playMode !== 'solo';

  const decoyOn = () => !!G.hard[S.gameTab];

  // seq = berurutan dari "mulai ayat" saat solo · max = panjang soal versus · choice = pilihan ganda satu kesempatan
  const GAMES = {
    words: { name: 'Susun Kata Ayat', desc: 'Susun kata-kata ayat berikutnya sesuai urutan.', hint: 'Normal: ada kata pengecoh dari ayat lain.', bg: '#251E5A,#4F3FC9 58%,#EC4899', unit: 'kata', seq: true, max: 20, load: () => ayahPool(wordItems), deal: roundWords, html: wordsHTML, answer: () => G.target.join(' ') },
    maze: { name: 'Labirin Ayat', desc: 'Telusuri petak yang bersebelahan, kata demi kata, hingga ★ akhir ayat.', hint: 'Normal: ada satu ★ pengecoh.', bg: '#132A4A,#4F3FC9 55%,#1D9A64', unit: 'kata', given: 1, load: () => ayahPool(mazeItems), deal: roundMaze, html: mazeHTML, answer: () => G.target.join(' ') },
    fill: { name: 'Lengkapi Ayat', desc: 'Pilih kata yang hilang dari ayat.', hint: 'Mudah 3 pilihan · Normal 4 pilihan yang berakhiran mirip.', bg: '#3B1F5E,#8B3F9E 55%,#EC4899', unit: 'kata', icon: 'text-cursor-input', seq: true, max: 20, choice: true, load: () => ayahPool(fillItems), deal: roundFill, html: fillHTML, answer: () => G.ay[G.idx] },
    surah: { name: 'Tebak Surah', desc: 'Kenali asal surah dari satu ayat.', hint: 'Mudah 3 pilihan · Normal 4 pilihan.', bg: '#132A4A,#1F6F8B 55%,#4F3FC9', unit: 'kata', icon: 'search', max: 20, choice: true, load: surahPool, deal: roundSurah, html: surahHTML, answer: () => `QS. ${SURAH_LIST[G.item.s - 1][1]} ayat ${G.item.a}` },
    order: { name: 'Urutkan Ayat', desc: 'Susun ayat-ayat yang diacak sesuai urutannya.', hint: 'Mudah 4 ayat · Normal 5 ayat.', bg: '#0F3D3E,#1D9A64 55%,#4F3FC9', unit: 'kata', icon: 'list-ordered', seq: true, max: 60, load: () => ayahPool(orderItems), deal: roundOrder, html: orderHTML, answer: () => G.target.map((t, k) => `${t} ﴿${arNum(G.idx + k + 1)}﴾`).join(' ') },

  const arNum = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const sized = (t, i) => ({ i, n: wordsOf(t).length });
  const startAt = () => (isVs() ? 0 : Math.max(0, Math.min(G.start, G.ay.length - 1) - 1));
  async function ayahPool(items) {
    G.ay = await surahText(G.surah);

  }
  const wordItems = ay => ay.slice(1).map(sized).slice(startAt()); // n = panjang ayat jawaban (i + 1)
  const mazeItems = ay => ay.map(sized).filter(x => x.n >= 3 && x.n <= 12);
  const fillItems = ay => ay.map(sized).slice(startAt()).filter(x => x.n >= 3 && x.n <= 30);
  function orderItems(ay) {
    const k = Math.min(decoyOn() ? 5 : 4, ay.length), out = [];

    return out;
  }
  // Tebak Surah: 8 surah acak dalam cakupan, maksimal 6 ayat tiap surah agar surah panjang tidak mendominasi
  async function surahPool() {
    const nos = shuffle(SURAH_LIST.map(s => s[0]).filter(n => n >= G.scope)).slice(0, 8);
    const texts = await Promise.all(nos.map(surahText));
    const owners = new Map();
    texts.forEach((ay, k) => ay.forEach(t => owners.set(plain(t), (owners.get(plain(t)) || new Set()).add(nos[k]))));
    const items = texts.flatMap((ay, k) => shuffle(ay.map((t, a) => ({ s: nos[k], a: a + 1, t, n: wordsOf(t).length }))
      // ayat yang sama di dua surah (atau basmalah) tidak punya satu jawaban
      .filter(x => x.n >= 3 && !(x.s === 1 && x.a === 1) && owners.get(plain(x.t)).size === 1)).slice(0, 6));

    return shuffle(items).map((x, k) => ({ ...x, i: k * 2 })); // selang dua: urutan indeks tidak berarti di sini
  }
  async function wordPairs(n) {
    const key = 'w' + n;
    if (G.cache[key]) return G.cache[key];
    const out = [], seen = new Set();
    let page = 1;
    while (page) {
      const j = await getJSON(`https://api.quran.com/api/v4/verses/by_chapter/${n}?words=true&word_fields=text_uthmani&language=id&per_page=50&page=${page}`);

        const tr = w.translation, ar = (w.text_uthmani || '').trim();
        if (w.char_type_name !== 'word' || !ar || !tr || !tr.text) return;
        const a = plain(ar), m = tr.text.trim().toLowerCase();
        if (seen.has(a) || seen.has(m)) return; // kata atau arti kembar membuat pasangan ambigu

        out.push({ ar, id: tr.text.trim(), lang: tr.language_name });
      }));

    }

  }
  async function matchPool() {
    const k = decoyOn() ? 6 : 4, pairs = shuffle([...await wordPairs(G.surah)]), out = [];

  }

  // soal versus: acak (bukan berurutan), dipasangkan menurut jumlah kata agar bobot tiap ronde sama bagi kedua pemain
  function versusQueue(items, rounds) {
    const free = shuffle([...items]), picked = [], used = new Set();
    const near = (a, b) => Math.abs(a.i - b.i) < 2; // ayat bersebelahan bisa membocorkan jawaban
    const clear = x => ![...used].some(u => near(x, u));
    // longgarkan selisih panjang dulu, baru larangan bersebelahan (hanya untuk surah pendek)
    for (const [gap, strict] of [[0, true], [1, true], [3, true], [Infinity, true], [0, false], [1, false], [Infinity, false]]) {
      for (const a of free) {
        if (picked.length >= rounds) break;
        if (used.has(a) || (strict && !clear(a))) continue;
        const b = free.find(b => b !== a && !used.has(b) && Math.abs(a.n - b.n) <= gap && (!strict || (!near(a, b) && clear(b))));
        if (!b) continue;
        picked.push([a, b]);
        used.add(a).add(b);
      }
    }
    return shuffle(picked).flatMap(p => {
      const w = Math.round((p[0].n + p[1].n) / 2), size = Math.max(p[0].n, p[1].n);
      return shuffle([...p]).map(x => ({ i: x.i, w, size }));
    });
  }
  function buildQueue(pool) {
    const { seq, max } = game();
    if (!isVs()) {
      const list = seq ? pool : shuffle([...pool]);
      return list.slice(0, G.rounds || list.length).map(x => ({ i: x.i, w: x.n, size: x.n }));
    }
    const rounds = G.rounds || 5, short = max ? pool.filter(x => x.n <= max) : pool;
    return versusQueue(short.length >= rounds * 2 ? short : pool, rounds);
  }
  // maksimum per soal = 1,5 x dasar; dasar mengikuti bobot ronde, jadi sama untuk kedua pemain
  const basePoints = (w, decoy) => w * 10 * (decoy ? 1.2 : 1);
  function turnPoints(w, got, total, miss, timeFrac, decoy) {
    if (!got) return 0;
    return Math.round(basePoints(w, decoy) * (got / (got + miss)) * (got / total + (got === total ? .5 * timeFrac : 0)));
  }

  const guest = () => isOnline() && G.me === 1;
  const winnerOf = () => {
    const [a, b] = G.vsScores, [ma, mb] = G.vsMiss;

    return a !== b ? (a > b ? 1 : 2) : ma !== mb ? (ma < mb ? 1 : 2) : 0;
  };
  function setPName(p, v) {

    try { localStorage.setItem('rl_pn', JSON.stringify(G.pn)); } catch (e) {}
  }

  // ===== Versus online: Supabase Realtime (broadcast, tanpa tabel). Host = Pemain 1, yang bergabung = Pemain 2 =====
  const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(5)), b => CODE_CH[b % 32]).join('');
  const netSend = m => { if (G.net) G.net.send({ type: 'broadcast', event: 'm', payload: m }); };
  function netClose() {

  function createRoom() {

  function joinRoom() {

  function onNet(m) {

      G.vsMiss[other] += miss;

    } else if (m.t === 'over' && G.phase === 'wait') {
      G.phase = 'over';
      paintGame();
      celebrate();
    } else if (m.t === 'bye' && G.phase !== 'over') {
      const who = pname(other);

      gameFail(`${who} keluar dari room.`);

  async function onStart(m) {

    if (!GAMES[m.game] || !Array.isArray(m.queue) || !Array.isArray(m.pool)) return gameFail('Data permainan dari host tidak valid.');
    S.gameTab = m.game;

    } catch (e) {

  const onlineActionsHTML = () => sb ? `

        <button class="btn s" onclick="gameBack()">${ic('x', 15)} Batal</button>

  const waitHTML = () => `

  // ===== Bagikan hasil: kartu PNG 1080×1920 (ukuran story Instagram) =====
  async function resultCanvas(me = 0) {
    const W = 1080, H = 1920, F = "'Plus Jakarta Sans', system-ui, sans-serif";
    try { await document.fonts.load(`800 40px ${F}`); } catch (e) {}
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const x = c.getContext('2d');
    const stops = game().bg.split(',').map(t => t.trim().split(/\s+/));
    const grad = x.createLinearGradient(0, 0, W, H);
    stops.forEach(([col, pos], i) => grad.addColorStop(pos ? parseInt(pos, 10) / 100 : i / (stops.length - 1), col));
    x.fillStyle = grad;
    x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.07)';
    [[900, 300, 420], [140, 1500, 520], [980, 1750, 300]].forEach(([cx, cy, r]) => { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); });
    const T = (t, px, py, size, wt = 800, col = '#fff', maxW = 0) => {
      if (maxW) for (; size > 24; size -= 2) { x.font = `${wt} ${size}px ${F}`; if (x.measureText(t).width <= maxW) break; }
      x.font = `${wt} ${size}px ${F}`;
      x.fillStyle = col;
      x.textAlign = 'center';
      x.fillText(t, px, py);
    };
    const box = (px, py, w, h, a = .14, edge = .35) => {
      x.beginPath();
      x.roundRect(px, py, w, h, 48);
      x.fillStyle = `rgba(255,255,255,${a})`;
      x.fill();
      x.strokeStyle = `rgba(255,255,255,${edge})`;
      x.lineWidth = 3;
      x.stroke();
    };
    const vs = isVs(), n = roundTotal(), soft = 'rgba(255,255,255,.8)';
    const label = S.gameTab === 'surah' ? (OPT.scope.find(o => o[0] === G.scope) || [0, ''])[1] : 'QS. ' + SURAH_LIST[G.surah - 1][1];
    T('reLoad', W / 2, 250, 64);
    T(`Ramadhan ${(S.set && S.set.hijri_year) || ''} H`.replace('  ', ' '), W / 2, 305, 32, 600, soft);
    T(game().name, W / 2, 440, 84, 800, '#fff', 900);
    T(`${label} · ${isOnline() ? 'Versus Online' : vs ? 'Versus' : 'Solo'} · ${n} ronde · ${decoyOn() ? 'Normal' : 'Mudah'}`, W / 2, 500, 32, 600, soft, 940);
    box(70, 560, 940, 690);
    if (!vs) {
      T('SKOR', W / 2, 670, 40, 700, soft);
      T(String(G.score), W / 2, 920, 260);
      T('poin', W / 2, 995, 44, 600, soft);
      T(`${G.history.filter(h => h.full).length} dari ${G.history.length} soal terjawab utuh`, W / 2, 1130, 42, 700, '#fff', 860);
    } else {
      const win = winnerOf(), opp = pname(1 - me);
      T(win ? `Saya ${win - 1 === me ? 'menang' : 'kalah'} dari ${opp}` : `Saya seri dengan ${opp}`, W / 2, 665, 84, 800, '#fff', 860);
      [me, 1 - me].forEach((p, k) => {
        const px = 100 + k * 450, cx = px + 215;
        box(px, 740, 430, 470, win === p + 1 ? .3 : .12, win === p + 1 ? .9 : .3);
        x.beginPath();
        x.arc(cx, 825, 56, 0, 7);
        x.fillStyle = 'rgba(255,255,255,.25)';
        x.fill();
        T(([...pname(p)][0] || '?').toUpperCase(), cx, 847, 60);
        T(pname(p), cx, 950, 46, 800, '#fff', 380);
        T(String(G.vsScores[p]), cx, 1090, 120, 800, '#fff', 370);
        T(`salah ${G.vsMiss[p]}`, cx, 1160, 32, 600, soft);
      });
    }
    // poin per ronde
    box(70, 1300, 940, 340);
    T('Poin per ronde', W / 2, 1365, 34, 700, soft);
    const pts = G.history.map(h => h.gained), top = Math.max(1, ...pts), gw = 820 / n, per = vs ? 2 : 1, bw = Math.min(44, gw * .8 / per);
    for (let r = 1; r <= n; r++) {
      for (let p = 0; p < per; p++) {
        const h = G.history.find(v => v.r === r && v.p === p);
        const bh = h ? Math.max(8, h.gained / top * 150) : 8, bx = 130 + (r - 1) * gw + gw / 2 - bw * per / 2 + p * bw;
        x.beginPath();
        x.roundRect(bx + 2, 1580 - bh, bw - 4, bh, 8);
        x.fillStyle = p ? 'rgba(255,255,255,.5)' : '#fff';
        x.fill();
      }
      if (n <= 10) T(String(r), 130 + (r - 1) * gw + gw / 2, 1620, 24, 600, soft);
    }
    T('Main juga di reLoad', W / 2, 1760, 40, 700);
    T(new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), W / 2, 1808, 28, 600, soft);
    return c;
  }
  function shareText(me) {
    const url = /^https?:/.test(location.href) ? ' ' + location.href.split(/[?#]/)[0].replace(/index\.html$/, '') : '';
    if (!isVs()) return `Skor saya ${G.score} di ${game().name}. Main juga di reLoad:${url}`;
    const win = winnerOf(), opp = pname(1 - me), sc = `${G.vsScores[me]}–${G.vsScores[1 - me]}`;
    if (!win) return `Saya seri dengan ${opp} di ${game().name} (${sc}). Main juga di reLoad:${url}`;
    return win - 1 === me ? `Saya menang dari ${opp} di ${game().name} (${sc}). Coba kalahkan saya di reLoad:${url}` : `Saya kalah dari ${opp} di ${game().name} (${sc}). Mau balas dendam? Main di reLoad:${url}`;
  }
  const shareBtns = () => (isVs() && !isOnline() ? [0, 1] : [isOnline() ? G.me : 0]).map(p => `<button class="btn" onclick="shareGame(${p})">${ic('share-2', 15)} ${isVs() && !isOnline() ? 'Bagikan: ' + esc(pname(p)) : 'Bagikan'}</button>`).join('');
  async function shareGame(me = 0) {
    if (G.phase !== 'over') return;
    let blob;
    try {
      const c = await resultCanvas(me);
      blob = await new Promise(r => c.toBlob(r, 'image/png'));
    } catch (e) {
      return msg('Gagal membuat gambar hasil');
    }
    if (!blob) return msg('Gagal membuat gambar hasil');
    const file = new File([blob], `reLoad-${S.gameTab}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: shareText(me) });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    try { await navigator.clipboard.writeText(shareText(me)); msg('Gambar diunduh, caption disalin'); } catch (e) { msg('Gambar hasil diunduh'); }
  }

  function paintGame() {
    const fs = $('#gm-fs');
    fs.classList.toggle('on', G.fullscreen);
    fs.innerHTML = G.fullscreen ? gameHTML() : '';
    fs.querySelectorAll('.mz-t span').forEach(s => {

  function gameFail(text) {

  const resetRun = () => Object.assign(G, { qi: 0, score: 0, streak: 0, vsScores: [0, 0], vsMiss: [0, 0], history: [], peerLast: null });
  async function startGame() {
    if (guest() || (isOnline() && !G.peer)) return;
    const st = $('#gst');
    if (st) G.start = Math.max(1, +st.value || 1);
    G.phase = 'loading';
    stopGameTimer();
    paintGame();
    let pool;
    try {
      pool = await game().load();
    } catch (e) {
      return gameFail(`Gagal memuat data ayat (${e && e.message ? e.message : e}). ${NET_HINT}`);
    }
    if (G.phase !== 'loading') return; // pemain keluar saat memuat
    G.pool = new Map(pool.map(x => [x.i, x]));
    G.queue = buildQueue(pool);
    if (!G.queue.length) return gameFail('Soal tidak cukup untuk pengaturan ini. Pilih surah lain atau ubah ayat awal.');
    resetRun();
    const asked = isVs() ? G.rounds || 5 : G.rounds;
    if (asked && roundTotal() < asked) msg(`Soal hanya cukup untuk ${roundTotal()} ronde`);
    if (isOnline()) netSend({ t: 'start', game: S.gameTab, surah: G.surah, scope: G.scope, rounds: G.rounds, timeLimit: G.timeLimit, hard: decoyOn(), queue: G.queue, pool: [...G.pool.values()], names: G.names, pn: G.pn });
    newTurn();
  }
  function newTurn() {
    // urutan versus P1,P2 · P2,P1 · … agar giliran pertama adil
    G.vsTurn = isVs() ? ((G.qi + 1) >> 1) % 2 : 0;
    G.timeLeft = G.timeLimit;
    G.done = false;
    G.peerLast = null;
    if (!isVs()) return beginTurn();
    if (isOnline()) {
      if (G.vsTurn === G.me) return beginTurn();
      stopGameTimer();
      G.phase = 'wait';
      return paintGame();
    }
    G.phase = 'ready';
    paintGame();
  }
  function beginTurn() {
    G.idx = G.queue[G.qi].i;
    G.item = G.pool.get(G.idx);
    Object.assign(G, { got: [], miss: 0, done: false, gained: 0, shake: -1, sel: -1, picked: -1, phase: 'play' });
    game().deal();
    startRoundTimer();
    paintGame();
  }
  const gameReady = () => { if (G.phase === 'ready') beginTurn(); };
  function finishTurn() {
    if (G.done || G.phase !== 'play') return;
    G.done = true;
    G.shake = -1;
    stopGameTimer();
    const given = game().given || 0; // kata pertama labirin diberikan, tidak dihitung
    const full = G.got.length === G.target.length;
    G.gained = turnPoints(G.queue[G.qi].w, G.got.length - given, G.target.length - given, G.miss, G.timeLimit ? G.timeLeft / G.timeLimit : 0, decoyOn());
    G.streak = full && !G.miss ? G.streak + 1 : 0;
    if (isVs()) {
      G.vsScores[G.vsTurn] += G.gained;
      G.vsMiss[G.vsTurn] += G.miss;
    } else G.score += G.gained;
    G.history.push({ p: G.vsTurn, r: roundNo(), gained: G.gained, full });
    if (isOnline()) netSend({ t: 'done', qi: G.qi, p: G.vsTurn, gained: G.gained, miss: G.miss, full });
    paintGame();
    if (full) celebrate();
  }
  function gameNext() {
    if (G.phase !== 'play') return;
    if (!G.done) return finishTurn(); // "Lewati": tampilkan jawaban dulu
    if (G.qi + 1 >= G.queue.length) {
      G.phase = 'over';
      if (isOnline()) netSend({ t: 'over' });
      paintGame();
      return celebrate();
    }
    G.qi++;
    if (isOnline()) netSend({ t: 'next', qi: G.qi });
    newTurn();
  }

  // --- Susun Kata ---
  function roundWords() {
    G.target = wordsOf(G.ay[G.idx + 1]);
    const tiles = G.target.map(w => ({ w, used: false }));
    if (decoyOn()) {
      const targetSet = new Set(G.target.map(bare));
      const others = shuffle([...new Set(G.ay.filter((_, i) => i !== G.idx + 1).flatMap(wordsOf).filter(w => !targetSet.has(bare(w))))]);
      // jumlah pengecoh mengikuti bobot ronde, sama untuk kedua pemain
      const n = Math.max(2, Math.min(4, Math.ceil(G.queue[G.qi].w * 0.4)));
      others.slice(0, n).forEach(w => tiles.push({ w, used: false }));
    }
    G.tiles = shuffle(tiles);
  }
  function wordsHTML() {
    return `
      <div class="gm-prev">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Ayat ${G.idx + 1}</small>

        </div>
        <div class="gm-ar">${esc(G.ay[G.idx])}</div>
      </div>
      <small>Sambungkan ayat ${G.idx + 2}: tekan kata-kata sesuai urutan${decoyOn() ? ' (abaikan kata pengecoh dari ayat lain)' : ''}</small>
      <div class="gm-slots">${G.got.length ? G.got.map(w => `<span class="gm-w ok">${esc(w)}</span>`).join('') : '<span class="note">…</span>'}</div>
      ${G.done ? '' : `<div class="gm-tiles">${G.tiles.map((t, i) => `<button class="gm-tile ${t.used ? 'used' : ''} ${G.shake === i ? 'shake' : ''}" onclick="gamePick(${i})">${esc(t.w)}</button>`).join('')}</div>`}
      ${turnFootHTML()}`;
  }
  function wrongPick(i) {
    G.miss++;
    G.shake = i;
    vibe(80);
    paintGame();
  }
  function gamePick(i) {
    const t = G.tiles[i];
    if (!t || t.used || G.done || G.phase !== 'play') return;
    if (game().choice) { // satu kesempatan, agar menebak semua opsi tidak menguntungkan
      G.picked = i;
      if (t.ok) G.got = [...G.target];
      else {
        G.miss++;
        vibe(80);
      }
      return finishTurn();
    }
    const want = G.target[G.got.length];
    if (bare(t.w) !== bare(want)) return wrongPick(i);
    t.used = true;
    G.got.push(want);
    G.shake = -1;
    if (G.got.length === G.target.length) finishTurn();
    else paintGame();
  }

  // --- Pilihan ganda: Lengkapi Ayat & Tebak Surah ---
  const options = (correct, others) => shuffle([{ w: correct, ok: true }, ...others.map(w => ({ w, ok: false }))]);
  const choicesHTML = latin => `
    <div class="gm-choices">${G.tiles.map((t, i) => `<button class="gm-tile ${latin ? 'gm-latin' : ''} ${G.done && t.ok ? 'right' : ''} ${G.picked === i && !t.ok ? 'wrong shake' : ''}" ${G.done ? 'disabled' : ''} onclick="gamePick(${i})">${esc(t.w)}</button>`).join('')}</div>`;
  function roundFill() {
    const words = wordsOf(G.ay[G.idx]);
    const blank = Math.floor(Math.random() * words.length), answer = bare(words[blank]);
    const seen = new Set([plain(answer)]);
    let pool = shuffle(G.ay.flatMap(wordsOf).map(bare)).filter(w => !seen.has(plain(w)) && seen.add(plain(w)));
    // Normal: utamakan kata yang huruf akhirnya sama dengan jawaban
    if (decoyOn()) pool.sort((a, b) => (plain(b).slice(-1) === plain(answer).slice(-1)) - (plain(a).slice(-1) === plain(answer).slice(-1)));
    G.blank = blank;
    G.target = [answer];
    G.tiles = options(answer, pool.slice(0, decoyOn() ? 3 : 2));
  }
  function fillHTML() {
    return `
      <div class="gm-prev">
        <small>Ayat ${G.idx + 1} · pilih kata yang hilang</small>
        <div class="gm-ar">${wordsOf(G.ay[G.idx]).map((w, k) => (k !== G.blank ? esc(w) : G.done ? `<mark>${esc(w)}</mark>` : '<span class="gm-blank" aria-label="kata hilang"></span>')).join(' ')}</div>
      </div>
      ${choicesHTML()}
      ${turnFootHTML()}`;
  }
  function roundSurah() {
    const name = n => SURAH_LIST[n - 1][1];
    G.target = [name(G.item.s)];
    G.tiles = options(G.target[0], shuffle(G.names.filter(n => n !== G.item.s)).slice(0, decoyOn() ? 3 : 2).map(name));
  }
  function surahHTML() {
    return `
      <div class="gm-prev"><small>Ayat ini berasal dari surah apa?</small><div class="gm-ar">${esc(G.item.t)}</div></div>
      ${choicesHTML(true)}
      ${turnFootHTML()}`;
  }

  // --- Urutkan Ayat (memakai gamePick yang sama dengan Susun Kata) ---
  function roundOrder() {
    G.target = G.ay.slice(G.item.i, G.item.i + G.item.k);
    const tiles = G.target.map(w => ({ w, used: false }));
    do shuffle(tiles); while (tiles.length > 1 && tiles.every((t, k) => t.w === G.target[k]));
    G.tiles = tiles;
  }
  function orderHTML() {
    return `
      <p class="note" style="margin:10px 0 6px">${esc(SURAH_LIST[G.surah - 1][1])}: tekan ayat sesuai urutannya.</p>
      <ol class="gm-order">${G.target.map((_, k) => `<li class="${G.got[k] ? 'ok' : ''}"><b>${k + 1}</b><span class="gm-ar">${G.got[k] ? esc(G.got[k]) : '…'}</span></li>`).join('')}</ol>
      ${G.done ? '' : `<div class="gm-choices">${G.tiles.map((t, i) => (t.used ? '' : `<button class="gm-tile gm-line ${G.shake === i ? 'shake' : ''}" onclick="gamePick(${i})">${esc(t.w)}</button>`)).join('')}</div>`}
      ${turnFootHTML()}`;
  }

  // --- Cocokkan Kata & Arti ---
  function roundMatch() {
    G.target = G.item.pairs;
    const idx = () => shuffle(G.target.map((_, k) => k));
    G.tiles = { ar: idx(), id: idx() };
  }
  function matchHTML() {
    const col = side => `<div>${G.tiles[side].map(p => {
      const done = G.got.includes(p);
      const cls = [side === 'id' ? 'gm-latin' : '', done ? 'right' : '', side === 'ar' && G.sel === p ? 'sel' : '', side === 'id' && G.shake === p ? 'wrong shake' : ''].join(' ');
      return `<button class="gm-tile ${cls}" ${done || G.done ? 'disabled' : ''} aria-pressed="${side === 'ar' && G.sel === p}" onclick="matchPick('${side}',${p})">${esc(G.target[p][side])}</button>`;
    }).join('')}</div>`;
    const lang = G.target[0].lang;
    return `
      <p class="note" style="margin:10px 0 6px">Tekan kata Arab, lalu artinya. Arti per kata: Quran.com${lang && lang !== 'indonesian' ? ` (bahasa ${esc(lang)}, terjemahan Indonesia tidak tersedia)` : ''}.</p>
      <div class="gm-match">${col('ar')}${col('id')}</div>
      ${turnFootHTML()}`;
  }
  function matchPick(side, p) {
    if (G.done || G.phase !== 'play' || G.got.includes(p) && side === 'ar') return;
    G.shake = -1;
    if (side === 'ar') G.sel = p;
    else if (G.sel < 0) return msg('Pilih kata Arab dulu');
    else if (p !== G.sel) {
      G.miss++;
      G.shake = p;
      vibe(80);
    } else {
      G.got.push(p);
      G.sel = -1;
      if (G.got.length === G.target.length) return finishTurn();
    }
    paintGame();
  }

  // --- Labirin petak ---
  const adjacent = (a, b, cols) => Math.abs(a % cols - b % cols) + Math.abs(Math.floor(a / cols) - Math.floor(b / cols)) === 1;
  // jalur acak yang tidak menyentuh dirinya sendiri, sehingga langkah berikutnya tidak pernah ambigu
  function tilePath(cols, rows, len) {
    const all = Array.from({ length: cols * rows }, (_, i) => i);
    const nb = c => all.filter(d => adjacent(c, d, cols));
    const grow = p => {
      if (p.length === len) return p;
      const last = p[p.length - 1];
      for (const c of shuffle(nb(last))) {
        if (p.includes(c) || nb(c).some(d => d !== last && p.includes(d))) continue;
        const r = grow([...p, c]);
        if (r) return r;
      }
      return null;
    };
    for (const s of shuffle([...all])) {
      const r = grow([s]);
      if (r) return r;
    }
    return null;
  }
  function roundMaze() {
    const words = wordsOf(G.ay[G.idx]);
    const cols = G.queue[G.qi].size <= 8 ? 4 : 5, rows = 5;
    const path = tilePath(cols, rows, words.length);
    const taken = new Set(words.map(plain));
    const others = G.ay.map(wordsOf).filter((_, i) => i !== G.idx);
    const pool = shuffle([...new Set(others.flat())].filter(w => !taken.has(plain(w))));
    let n = 0;
    const cells = Array.from({ length: cols * rows }, (_, c) => (path.includes(c) ? words[path.indexOf(c)] : pool[n++ % pool.length] || '۞'));
    let fake = -1;
    if (decoyOn()) {
      // ★ pengecoh diletakkan di sebelah jalur, sedekat mungkin dengan ujungnya
      for (let k = path.length - 2; k >= 0 && fake < 0; k--) {
        const c = shuffle(cells.map((_, c) => c)).find(c => !path.includes(c) && adjacent(c, path[k], cols));
        if (c !== undefined) fake = c;
      }
      const ends = shuffle(others.map(w => w[w.length - 1]).filter(w => !taken.has(plain(w))));
      if (fake >= 0 && ends.length) cells[fake] = ends[0];
    }
    G.target = words;
    G.got = [words[0]];
    G.mz = { cols, rows, path, cells, fake };
  }
  function mazeHTML() {
    const { cols, rows, path, cells, fake } = G.mz, k = G.got.length, last = path[k - 1];
    return `
      <p class="note" style="margin:0 0 6px">Ayat ke-${G.idx + 1}: dari petak ▶, tekan petak yang <b>bersebelahan</b> sesuai urutan kata sampai ★.${fake >= 0 ? ' <b>Awas, ada satu ★ pengecoh.</b>' : ''}</p>
      <div class="gm-slots">${G.got.map(w => `<span class="gm-w ok">${esc(w)}</span>`).join('')}</div>
      <div class="mz-board" style="--c:${cols};--r:${rows}">${cells.map((w, c) => {
        const step = path.indexOf(c), on = step >= 0 && step < k;
        const cls = [on ? 'on' : '', c === last && !G.done ? 'now' : '', !G.done && !on && adjacent(c, last, cols) ? 'near' : '',
          G.done && step >= k ? 'ans' : '', G.shake === c ? 'bad shake' : ''].join(' ');
        const star = c === path[path.length - 1] || (c === fake && !G.done);
        return `<button type="button" class="mz-t ${cls}" onclick="mazePick(${c})">${step === 0 ? '<i>▶</i>' : ''}${star ? '<i>★</i>' : ''}<span style="--len:${Math.max(5, plain(w).length)}">${esc(w)}</span></button>`;
      }).join('')}</div>
      ${turnFootHTML()}`;
  }
  function mazePick(c) {
    if (G.done || G.phase !== 'play') return;
    const { cols, path, fake } = G.mz, k = G.got.length;
    if (path.slice(0, k).includes(c)) return;
    if (!adjacent(c, path[k - 1], cols)) return msg('Pilih petak yang bersebelahan dengan petak terakhir');
    if (c !== path[k]) {
      if (c === fake) msg('★ pengecoh: itu akhir ayat lain');
      return wrongPick(c);
    }
    G.got.push(G.target[k]);
    G.shake = -1;
    if (G.got.length === G.target.length) finishTurn();
    else paintGame();
  }

  function gameThumbSVG(kind) {
    if (GAMES[kind].icon) return `<span class="gm-ico">${ic(GAMES[kind].icon, 44)}</span>`;
    if (kind === 'words') {
      return `

          <rect x="14" y="16" width="62" height="30" rx="10" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.5)"/>
          <text x="45" y="36" fill="#fff" font-family="Scheherazade New, serif" font-size="18" text-anchor="middle">ٱلْحَمْدُ</text>
          <rect x="88" y="16" width="54" height="30" rx="10" fill="#fff"/>
          <text x="115" y="36" fill="#4F3FC9" font-family="Scheherazade New, serif" font-size="18" font-weight="700" text-anchor="middle">لِلَّهِ</text>
          <rect x="154" y="16" width="72" height="30" rx="10" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.5)"/>

          <text x="120" y="74" fill="rgba(255,255,255,0.9)" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Susun Urutan Kata Ayat</text>

        ${Array.from({ length: 12 }, (_, i) => `<rect x="${54 + (i % 4) * 34}" y="${3 + Math.floor(i / 4) * 32}" width="30" height="28" rx="8" fill="${on.includes(i) ? '#fff' : 'rgba(255,255,255,0.2)'}" stroke="rgba(255,255,255,0.5)"/>`).join('')}
        <text x="69" y="22" fill="#4F3FC9" font-size="12" text-anchor="middle">▶</text>
        <text x="171" y="88" fill="#E5A124" font-size="16" text-anchor="middle">★</text>
      </svg>`;
  }

  V.game = () => `
    <div class="card">
      <b>${ic('gamepad-2', 17)} Pilih Permainan Al-Qur'an</b>
      <div class="gm-thumbs">
        ${Object.entries(GAMES).map(([k, g]) => `
        <div class="gm-thumb" data-k="${k}" role="button" tabindex="0" onclick="openGame('${k}')" onkeydown="if(event.key==='Enter')openGame('${k}')">
          <div class="gm-thumb-art" style="background:linear-gradient(135deg,${g.bg})">
            <span class="gm-thumb-badge">Main</span>
            ${(AS().thumbs || {})[k] ? `<img class="gm-thumb-img" src="${esc(AS().thumbs[k])}" alt="" onerror="this.remove()">` : gameThumbSVG(k)}
          </div>
          <div class="gm-thumb-body">
            <b>${g.name}</b>
            <small>${g.desc}</small>
          </div>
        </div>`).join('')}
      </div>
      <p class="note" style="margin-top:12px">Pengaturan permainan muncul di dalam game setelah Anda memilihnya.</p>
    </div>`;

  // ===== Mushaf Madinah (15 baris, 604 halaman). Sumber data: Quran.com API v4 =====
  const MF = { page: 1, cache: new Map(), names: null, busy: 0 };
  const arDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const BISMILLAH = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';

  async function mfNames() {
    if (MF.names) return MF.names;
    if (QD() && QD().nm) return (MF.names = QD().nm);
    try {
      const j = await (await fetch('https://api.quran.com/api/v4/chapters?language=id')).json();
      MF.names = Object.fromEntries(j.chapters.map(c => [c.id, c.name_arabic]));
    } catch (e) { MF.names = {}; }
    return MF.names;
  }

  async function mfPage(n) {
    if (MF.cache.has(n)) return MF.cache.get(n);
    const emb = QD() && QD().pg[n];
    if (emb) { // format ringkas: [0,surah] | [1] bismillah | [2,tengah,[kata...]]
      const page = { n, juz: emb.j, lines: emb.l.map(l => l[0] === 0 ? { kind: 'surah', sn: l[1] } : l[0] === 1 ? { kind: 'bsm' } : { kind: 'text', center: !!l[1], w: l[2].map(t => (t[0] === '﴿' ? { t, e: true } : { t })) }) };
      MF.cache.set(n, page);
      return page;
    }
    let j;
    try { j = await getJSON(`https://api.quran.com/api/v4/verses/by_page/${n}?words=true&word_fields=text_uthmani,line_number&per_page=50`); }
    catch (e) { j = await getJSON(`https://api.quran.com/api/v4/verses/by_page/${n}?words=true&word_fields=text_uthmani&per_page=50`); } // cadangan bila parameter ditolak
    if (j.verses && j.verses[0] && j.verses[0].words && j.verses[0].words[0] && j.verses[0].words[0].line_number == null) throw new Error('data baris tidak tersedia');
    if (!j.verses || !j.verses.length) throw new Error('kosong');
    const rows = new Map();
    j.verses.forEach(v => {
      const sn = +v.verse_key.split(':')[0], last = v.verse_number === SURAH_LIST[sn - 1][2];
      v.words.forEach(w => {
        if (!rows.has(w.line_number)) rows.set(w.line_number, { w: [], start: 0, end: false });
        const row = rows.get(w.line_number);
        if (w.char_type_name === 'end') {
          row.w.push({ t: '﴿' + arDigits(v.verse_number) + '﴾', e: true });
          if (last) row.end = true;
        } else if (w.text_uthmani) row.w.push({ t: w.text_uthmani });
        if (v.verse_number === 1 && w.position === 1) row.start = sn;
      });
    });
    const lines = [];
    [...rows.keys()].sort((a, b) => a - b).forEach(k => {
      const row = rows.get(k);
      if (row.start) {
        lines.push({ kind: 'surah', sn: row.start });
        if (row.start !== 1 && row.start !== 9) lines.push({ kind: 'bsm' });
      }
      lines.push({ kind: 'text', w: row.w, center: row.end });
    });
    const page = { n, juz: j.verses[0].juz_number, lines };
    MF.cache.set(n, page);
    return page;
  }

  // halaman awal tiap surah (mushaf Madinah 604 halaman); dipakai bila halaman tidak memuat judul surah
  const SURAH_PAGE = [1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,577,578,580,582,583,585,586,587,587,589,590,591,591,592,593,594,595,595,596,596,597,597,598,598,599,599,600,600,601,601,601,602,602,602,603,603,603,604,604,604];
  const JUZ_PAGE = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
  const upTo = (list, n) => list.filter(x => x <= n).length;
  const markKey = () => 'rl_mark_' + (S.user ? S.user.id || S.user.username : 'tamu');
  // tanda terakhir dibaca disimpan di akun (prefs.last_read) agar tilawah bisa dilanjutkan di perangkat lain; localStorage hanya cadangan
  const localMark = () => { try { return JSON.parse(localStorage.getItem(markKey())); } catch (e) { return null; } };
  const onAcct = () => !!S.user && !S.admin && !!S.prefs && 'last_read' in S.prefs;
  const getMark = () => onAcct() ? S.prefs.last_read : localMark();
  async function syncMark() {
    if (IS_PREVIEW || !S.user || S.admin || !onAcct()) return;
    try {
      const r = await Promise.race([T.sel('prefs', { user_id: S.user.id }), new Promise((_, no) => setTimeout(no, 1500))]);
      if (r[0] && 'last_read' in r[0]) S.prefs.last_read = r[0].last_read;
    } catch (e) {}
  }
  const isMark = (m, s, a) => !!m && m.s === s && m.a === a;

  const markText = () => {
    const m = getMark();
    return m && SURAH_LIST[m.s - 1] ? `Terakhir dibaca: QS. ${SURAH_LIST[m.s - 1][1]} ayat ${m.a} · Hal ${m.p}` : 'Belum ada tanda terakhir dibaca';
  };

  function mfPaintMark() {
    const m = getMark(), btn = $('#mf-mark');
    mfEl.querySelectorAll('.mf-e').forEach(el => el.classList.toggle('on', isMark(m, +el.dataset.s, +el.dataset.a)));
    if (!btn) return;
    btn.hidden = !(m && SURAH_LIST[m.s - 1]);
    if (!btn.hidden) $('#mf-mark-t').textContent = markText();
    document.querySelectorAll('.mark-info').forEach(el => { el.textContent = markText(); });
  }
  function mushafMark(s, a, p) {
    const off = isMark(getMark(), s, a), m = off ? null : { s, a, p };
    try {
      if (m) localStorage.setItem(markKey(), JSON.stringify(m));
      else localStorage.removeItem(markKey());
    } catch (e) {}
    if (S.user && !S.admin) persistPref({ last_read: m }).catch(() => msg('Tanda belum tersinkron ke akun, coba lagi.'));
    else if (!localMark() && m) return msg('Penyimpanan browser tidak tersedia, tanda tidak tersimpan.');
    mfPaintMark();
    msg(off ? 'Tanda terakhir dibaca dihapus' : `Terakhir dibaca: ${SURAH_LIST[s - 1][1]} ayat ${a}`);
  }
  // catat ke tilawah manual: pakai tanda ayat bila ada di halaman yang tampil, selain itu nomor halaman
  async function mushafLog() {
    if (!S.user || S.admin) return msg('Masuk sebagai peserta untuk mencatat tilawah.');
    const shown = [...mfEl.querySelectorAll('.mf-no')].map(e => +e.textContent).sort((a, b) => a - b);
    if (!shown.length) return msg('Tunggu halaman selesai dimuat.');
    const m = getMark(), mk = m && shown.includes(m.p) && SURAH_LIST[m.s - 1] ? m : null;
    const end = mk ? mk.p : shown[shown.length - 1];
    const names = [...new Set([...mfEl.querySelectorAll('.mf-e')].map(e => SURAH_LIST[e.dataset.s - 1][1]))];
    const surah = mk ? `QS. ${SURAH_LIST[mk.s - 1][1]} ayat ${mk.a}` : `QS. ${names.join(', ') || SURAH_LIST[MF.surah - 1][1]}`;
    const from = MF.from <= end && end - MF.from < 60 ? MF.from : shown[0];
    const input = prompt(`Catat tilawah: ${surah} (sampai hal ${end}).\nBerapa halaman yang dibaca?`, Math.max(1, end - from + 1));
    if (input === null) return;
    const pages = Math.round(+input);
    if (!(pages >= 1 && pages <= 604)) return msg('Jumlah halaman harus 1–604');
    const day = curDay(), note = mk ? `Hal ${mk.p}` : `Hal ${shown.join('–')} (tanpa tanda ayat)`;
    if (S.til.some(r => r.mode === 'manual' && r.day === day && r.surah === surah && r.note === note)) return msg('Catatan ini sudah ada hari ini');
    await T.ins('tilawah_log', { user_id: S.user.id, day, mode: 'manual', surah, pages, note });
    MF.from = end + 1;
    await loadData();
    if (S.page === 'tilawah') render();
    msg(`Tercatat: ${surah} · ${pages} halaman`);
  }
  const mushafGoMark = () => { const m = getMark(); if (m) { MF.surah = m.s; MF.from = m.p; mfShow(m.p); } };

  function mfRender(p, names) {
    const head = p.lines.find(l => l.kind === 'surah');
    let sn = head ? head.sn - 1 : SURAH_PAGE.filter(x => x <= p.n).length;
    const short = p.n <= 2; // dua halaman pembuka: baris sedikit, diletakkan di tengah
    const rows = short ? `grid-template-rows:repeat(${p.lines.length},calc(100% / 15));align-content:center` : `grid-template-rows:repeat(${Math.max(15, p.lines.length)},minmax(0,1fr))`;
    const word = w => {
      if (!w.e) return esc(w.t);
      const a = +w.t.replace(/[^٠-٩]/g, '').replace(/./g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      return `<button type="button" class="mf-e" data-s="${sn}" data-a="${a}" title="Tandai terakhir dibaca" aria-label="Tandai ayat ${a} terakhir dibaca" onclick="mushafMark(${sn},${a},${p.n})">${esc(w.t)}</button>`;
    };

  function mfFit() {
    const run = () => mfEl.querySelectorAll('.mf-page').forEach(pg => {
      const lines = [...pg.querySelectorAll('.mf-line')];

      pg.style.setProperty('--k', 1);
      const room = lines[0].clientWidth;
      const w = lines.map(l => l.firstElementChild.offsetWidth).sort((a, b) => a - b);
      const k = Math.min(1.2, room / w[w.length >> 1], room / (w[w.length - 1] * .88));
      pg.style.setProperty('--k', k.toFixed(3));
      lines.forEach(l => {
        const t = l.firstElementChild, x = l.clientWidth / t.offsetWidth;
        t.style.transform = `scaleX(${Math.min(x, l.classList.contains('c') ? 1 : 1.35)})`;

  function initSmoothScrollAndAnimations() {
    try {
      const appEl = $('#app');

      if (window.Lenis) {
        if (lenisInstance) {
          if (lenisRafId) cancelAnimationFrame(lenisRafId);
          lenisInstance.destroy();
          lenisInstance = null;
        }
        const shellEl = appEl.querySelector('.shell');
        if (shellEl) {
