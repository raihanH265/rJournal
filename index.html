<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>rJournal - Ramadhan Jurnal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#4F3FC9">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0}
    button,input,select,textarea{font-family:inherit}
    :root{
      --p:#4F3FC9;
      --pl:rgba(79,63,201,.12);
      --h:#17143A;
      --b:#4A4768;
      --m:#7D7A9A;
      --bd:rgba(255,255,255,.65);
      --bd-s:rgba(79,63,201,.14);
      --bg:#F4F2FA;
      --g:rgba(255,255,255,.58);
      --card-g:rgba(255,255,255,.68);
      --input-g:rgba(255,255,255,.78);
      --s:rgba(255,255,255,.45);
      --pink:#EC4899;
      --pink-l:rgba(236,72,153,.14);
      --gold:#E5A124;
      --ok:#1D9A64;
      --er:#E5484D;
      --sh:0 12px 36px rgba(42,32,115,.08),inset 0 1px 0 rgba(255,255,255,.8);
      --card-sh:0 6px 24px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85);
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme=light]){
        --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
        --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
        --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
        --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
        --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
      }
    }
    :root[data-theme=dark]{
      --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
      --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
      --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
      --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
      --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
    }
    html,body{height:100%;background:var(--bg)}
    #app{position:fixed;inset:0;z-index:999999;overflow:auto;background:var(--bg);color:var(--b);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
    .orb{position:fixed;border-radius:50%;filter:blur(85px);pointer-events:none;z-index:0}
    .o1{width:380px;height:380px;left:-110px;top:52%;background:linear-gradient(135deg,#F9A8D4,#EC4899);opacity:.48}
    .o2{width:420px;height:420px;right:-120px;top:4%;background:linear-gradient(135deg,#BFAFF8,#8E78F2);opacity:.58}
    .o3{width:280px;height:280px;left:38%;top:18%;background:#FBCFE8;opacity:.38}
    .shell{position:relative;z-index:1;display:flex;margin:26px auto;max-width:1240px;min-height:calc(100% - 52px);border-radius:32px;background:var(--g);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--bd);box-shadow:var(--sh)}
    .side{width:256px;flex:none;position:sticky;top:0;align-self:flex-start;padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bd-s);min-height:100%}
    .brand{display:flex;gap:12px;align-items:center;padding:0 8px 20px;color:var(--h);border-bottom:1px solid var(--bd-s);margin-bottom:8px}
    .brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
    .brand small{display:block;color:var(--m);font-size:12px}
    .lg{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,63,201,.3)}
    .nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--b);cursor:pointer;white-space:nowrap;transition:all .2s ease;border:1px solid transparent}
    .nv svg{width:19px;height:19px;stroke-width:2.1;flex:none}
    .nv.on{background:var(--pl);color:var(--p);border-color:rgba(79,63,201,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
    .nv:hover:not(.on){background:var(--s);color:var(--h)}
    .main{flex:1;min-width:0;padding:28px 34px 44px}
    .hd{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .hd h1{font-size:22px;color:var(--h);font-weight:800;letter-spacing:-.02em}
    .hd p{color:var(--m);font-size:13px;margin-top:2px}
    .hd .r{display:flex;gap:10px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card-g);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--h);box-shadow:var(--card-sh)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,var(--p),#6453E0);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 18px;font:600 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(79,63,201,.28);transition:all .2s ease}
    .btn:hover{transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(79,63,201,.36)}
    .btn:active{transform:translateY(0)}
    .btn.s{background:var(--card-g);backdrop-filter:blur(12px);color:var(--p);border:1px solid var(--bd);box-shadow:var(--card-sh)}
    .btn.s:hover{background:var(--pl);border-color:rgba(79,63,201,.25)}
    .btn.w{width:100%;padding:14px;border-radius:16px;margin-top:16px;font-size:14.5px}
    .card{background:var(--card-g);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);border:1px solid var(--bd);border-radius:22px;padding:18px 20px;box-shadow:var(--card-sh);margin-bottom:16px}
    .card>b{color:var(--h);display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;font-weight:700;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .st small{color:var(--m);font-weight:500}
    .st b{font-size:32px;color:var(--p);font-weight:800;margin-top:4px}
    .ok{color:var(--ok)!important}
    .hero{text-align:center;padding:12px 0 8px}
    .orbh{width:116px;height:116px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(217,208,250,.85) 55%,rgba(145,126,242,.9));border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 40px rgba(79,63,201,.28),inset 0 -6px 16px rgba(79,63,201,.2);display:grid;place-items:center;color:var(--p)}
    .hero h2{font-size:36px;line-height:1.18;font-weight:800;color:var(--h);letter-spacing:-.025em}
    .hero h2 em{font-style:normal;color:var(--p)}
    .hero p{max-width:520px;margin:12px auto;color:var(--b);font-size:14.5px}
    .pill{max-width:680px;margin:20px auto 24px;background:var(--card-g);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:14px 16px 14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;color:var(--h);font-weight:500;transition:all .2s ease}
    .pill:hover{transform:translateY(-2px);border-color:rgba(79,63,201,.3)}
    .sendb{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(79,63,201,.3)}
    .fc{display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .2s ease;margin-bottom:0}
    .fc:hover{transform:translateY(-2px);background:var(--input-g);border-color:rgba(79,63,201,.25)}
    .fc .ico{width:46px;height:46px;flex:none;border-radius:16px;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.15);display:grid;place-items:center}
    .fc b{margin:0 0 2px;font-size:14.5px;display:block}
    .fc small{color:var(--b);font-size:12.5px;line-height:1.4;display:block}
    .fc>span{margin-left:auto;color:var(--m);display:grid;place-items:center}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
    .row>input,.row>select{flex:1;min-width:120px}
    input,select,textarea{font:inherit;color:var(--h);background:var(--input-g);backdrop-filter:blur(10px);border:1px solid var(--bd-s);border-radius:14px;padding:11px 14px;outline:0;width:100%;transition:all .2s}
    input:focus,textarea:focus,select:focus{border-color:var(--p);background:var(--bg);box-shadow:0 0 0 3px var(--pl)}
    textarea{min-height:84px;resize:vertical}
    input[type=checkbox],input[type=radio]{width:auto}

    /* Sembunyikan Scrollbar untuk tampilan bersih */
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none;width:0;height:0}
    .drag-scroll{cursor:grab;user-select:none}
    .drag-scroll.dragging{cursor:grabbing}

    /* Day Strip Pill-in-Groove */
    .strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px;background:var(--s);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:99px;margin-bottom:16px;box-shadow:inset 0 2px 7px rgba(42,32,115,.08),0 2px 10px rgba(42,32,115,.03)}
    .dc{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:99px;padding:8px 16px;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--b);cursor:pointer;transition:all .2s ease;white-space:nowrap}
    .dc small{display:inline;font:500 11px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--m);opacity:.85}
    .dc:hover:not(.on){color:var(--h);background:rgba(255,255,255,.35)}
    .dc.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 14px rgba(79,63,201,.34),inset 0 1px 0 rgba(255,255,255,.35)}
    .dc.on small{color:rgba(255,255,255,.88)}
    :root[data-theme=dark] .strip{box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06)}
    :root[data-theme=dark] .dc:hover:not(.on){background:rgba(255,255,255,.06)}

    .it{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--bd-s);cursor:pointer;color:var(--h);font-weight:500;transition:background .15s}
    .it:last-of-type{border-bottom:none}
    .it:hover{background:var(--s);border-radius:12px}
    .it input{accent-color:var(--p);width:19px;height:19px;cursor:pointer}
    .it span{flex:1;display:flex;align-items:center;gap:8px}
    .x{border:0;background:none;color:var(--m);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center;transition:.15s}
    .x:hover{color:var(--er);background:rgba(229,72,77,.1)}
    .bar{flex:1;min-width:80px;height:10px;border-radius:9px;background:var(--pl);overflow:hidden;border:1px solid var(--bd-s)}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:9px;transition:.4s ease}
    .ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--p) 0%,var(--pink) calc(var(--v)*1%),var(--pl) 0);display:grid;place-items:center;flex:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
    .ring b{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;margin:0;font-size:20px;color:var(--h)}
    .wl{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 1.6s forwards}
    @keyframes dr{to{stroke-dashoffset:0}}

    /* Kalender UI */
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .cal-pills{display:inline-flex;align-items:center;gap:4px;padding:5px;border-radius:99px;background:var(--s);border:1px solid var(--bd);box-shadow:inset 0 2px 6px rgba(42,32,115,.07),0 2px 8px rgba(42,32,115,.03);overflow-x:auto;max-width:100%}
    .cal-mp{border:0;background:transparent;color:var(--b);font:700 12.5px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .18s ease;white-space:nowrap}
    .cal-mp:hover:not(.on){color:var(--h);background:rgba(255,255,255,.38)}
    .cal-mp.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 12px rgba(79,63,201,.32),inset 0 1px 0 rgba(255,255,255,.35)}
    .cal-ef{display:inline-flex;align-items:center;padding:6px 13px;border-radius:99px;background:var(--pink-l);color:var(--pink);font-size:11.5px;font-weight:700;border:1px solid rgba(236,72,153,.2);box-shadow:0 2px 8px rgba(236,72,153,.08)}
    .cal-title{font-size:19px;font-weight:800;color:var(--h);letter-spacing:-.02em;margin-bottom:12px}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:left}
    .cal>i{font-style:normal;font-weight:700;color:var(--m);font-size:12px;padding-bottom:4px;text-align:center}
    .cd{position:relative;border-radius:14px;padding:10px 10px 9px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--bd);background:var(--input-g);box-shadow:0 4px 12px rgba(42,32,115,.04),inset 0 1px 0 rgba(255,255,255,.9);transition:.18s}
    .cd.out{background:var(--s);box-shadow:inset 0 2px 6px rgba(42,32,115,.06),0 1px 0 rgba(255,255,255,.65);opacity:.82}
    .cd b{display:block;color:var(--h);font-size:14px;font-weight:800;line-height:1.1}
    .cd small{color:var(--m);font-size:10.5px;font-weight:500;display:block;line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cd .cdot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--p)}
    .cd.rm{background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(123,108,246,.12));border-color:rgba(123,108,246,.24);box-shadow:0 5px 14px rgba(79,63,201,.07),inset 0 1px 0 rgba(255,255,255,.95)}
    .cd.rm small{color:var(--p);font-weight:600}
    .cd.td{border:1.5px solid var(--p);box-shadow:0 4px 14px rgba(79,63,201,.16),inset 0 0 0 1px rgba(123,108,246,.2)}
    .cd.eid{background:linear-gradient(135deg,#F9C862,#E5A124);border-color:rgba(255,255,255,.5);box-shadow:0 6px 16px rgba(229,161,36,.28),inset 0 1px 0 rgba(255,255,255,.6)}
    .cd.eid *{color:#332200!important}
    :root[data-theme=dark] .cd{box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.07)}
    :root[data-theme=dark] .cd.out{box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
    :root[data-theme=dark] .cd.rm{background:linear-gradient(145deg,rgba(45,40,86,.75),rgba(123,108,246,.22))}
    .cal-leg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--b);font-weight:500}
    .cal-leg span{display:inline-flex;align-items:center;gap:6px}
    .cal-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .cal-info-card{padding:14px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85)}
    .cal-info-card>b{font-size:13px!important;margin-bottom:8px!important}
    .cal-info-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--h);flex-wrap:wrap}
    .cal-tag{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.18)}
    .cal-tag.syw{background:rgba(229,161,36,.16);color:#B47808;border-color:rgba(229,161,36,.3)}
    :root[data-theme=dark] .cal-tag.syw{color:#F6C358}
    .cal-info-date{color:var(--m);font-size:11.5px;min-width:155px}
    .cal-info-note{color:var(--m);font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd-s)}

    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:separate;border-spacing:0;text-align:center;white-space:nowrap}
    th,td{padding:10px 8px;border-bottom:1px solid var(--bd-s)}
    th{color:var(--m);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
    td.hl-accent{color:var(--p);font-weight:700}
    tr.hl td,.kt-table tr.active-target td{background:linear-gradient(135deg,var(--input-g),var(--pl));color:var(--p);font-weight:700;border-top:1.5px solid var(--p);border-bottom:1.5px solid var(--p);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
    tr.hl td:first-child,.kt-table tr.active-target td:first-child{border-left:1.5px solid var(--p);border-radius:14px 0 0 14px}
    tr.hl td:last-child,.kt-table tr.active-target td:last-child{border-right:1.5px solid var(--p);border-radius:0 14px 14px 0}

    /* Wave Graphic Glassmorphism */
    .wave-glass{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 12px;background:linear-gradient(145deg,var(--input-g),var(--pl));border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(42,32,115,.08);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
    .wave-glass::before,.wave-glass::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(52px);opacity:.42;pointer-events:none}
    .wave-glass::before{background:var(--p);left:-40px;bottom:-55px}
    .wave-glass::after{background:var(--pink);right:-35px;top:-45px}
    .wave-glass-hd{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--h);opacity:.85}
    .wave-glass svg{position:relative;z-index:1;display:block}

    .moods{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
    .mo{padding:10px 14px;border-radius:15px;border:1.5px solid var(--bd);background:var(--input-g);color:var(--b);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;transition:all .18s}
    .mo:hover{border-color:var(--p);color:var(--h)}
    .mo:has(input:checked){background:var(--pl);border-color:var(--p);color:var(--p);box-shadow:0 4px 12px rgba(79,63,201,.15)}
    .mo input{display:none}
    .em{color:var(--m);text-align:center;padding:16px;font-size:13.5px}
    .note{color:var(--m);font-size:12px;text-align:center}
    .lk{color:var(--p);font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px}
    .lk:hover{text-decoration:underline}
    .blk{display:flex;padding:8px 10px;border-radius:10px;background:var(--s);margin-top:6px}
    .c{display:flex;justify-content:center;text-align:center;margin-top:14px}
    .mb{position:fixed;inset:0;background:rgba(15,12,38,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;z-index:10;padding:16px;overflow:auto}

  const G = {
    cache: {},
    surah: 1,
    start: 1,
    phase: 'idle',
    err: '',
    ay: [],
    idx: 0,
    target: [],
    tiles: [],
    got: [],
    miss: 0,
    done: false,
    shake: -1,
    score: 0,
    streak: 0,
    mz: null,
    ayat: 0,
    fontOk: false,
    // Pengaturan baru:
    fullscreen: false,
    playMode: 'solo', // 'solo' | 'versus'
    timeLimit: 60, // 0 = tanpa batas, atau detik (30, 60, 90, 120)
    timeLeft: 0,
    timerId: null,
    wordDecoy: false, // pengecoh kata dari ayat lain pada Susun Kata
    mazeDecoy: false, // 1 tujuan (akhir ayat) pengecoh dari ayat lain pada Labirin
    vsScores: [0, 0],
    vsTurn: 0, // 0 = Pemain 1, 1 = Pemain 2
    vsRounds: [0, 0]
  };
  const plain = s => s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '').replace(/\u0671/g, '\u0627');
  const wordsOf = t => t.split(/\s+/).filter(Boolean);
  const vibe = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function celebrate() {
    const host = document.querySelector('#gm-fs.on .gm-arena-inner');
    if (!host) return;
    const wrap = document.createElement('div');
    wrap.className = 'cf-wrap';
    const cols = ['#7B6CF6', '#EC4899', '#E5A124', '#1D9A64', '#4F3FC9'];
    for (let i = 0; i < 30; i++) {
      const sp = document.createElement('span');
      sp.className = 'cf';
      sp.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .4}s`;
      wrap.appendChild(sp);
    }
    host.appendChild(wrap);
    setTimeout(() => wrap.remove(), 2200);
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function stopGameTimer() {
    if (G.timerId) {
      clearInterval(G.timerId);
      G.timerId = null;
    }
  }

  function startRoundTimer() {
    stopGameTimer();
    if (!G.timeLimit || G.timeLimit <= 0) {
      G.timeLeft = 0;
      return;
    }
    G.timeLeft = G.timeLimit;
    G.timerId = setInterval(() => {
      if (S.page !== 'game' || G.phase !== 'play') {
        stopGameTimer();
        return;
      }
      if ((S.gameTab === 'words' && G.done) || (S.gameTab === 'maze' && G.mz && G.mz.state === 'win')) {
        stopGameTimer();
        return;
      }
      G.timeLeft--;
      const el = $('#gm-timer-val');
      const pill = $('#gm-timer-pill');
      if (el) el.textContent = formatGameTime(G.timeLeft);
      const bar = $('#gm-timer-bar');
      if (bar) bar.style.width = Math.max(0, G.timeLeft / G.timeLimit * 100) + '%';
      if (pill && G.timeLeft <= 10) pill.classList.add('low');
      if (G.timeLeft <= 0) {
        stopGameTimer();
        handleRoundTimeout();
      }
    }, 1000);
  }

  function formatGameTime(sec) {
    if (!G.timeLimit || G.timeLimit <= 0) return '∞';
    const m = Math.floor(Math.max(0, sec) / 60);
    const s = Math.max(0, sec) % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function handleRoundTimeout() {
    if (S.gameTab === 'words') {
      G.done = true;
      G.streak = 0;
      if (G.playMode === 'versus') G.vsRounds[G.vsTurn]++;
      msg(`Waktu habis!${G.playMode === 'versus' ? ` Giliran Pemain ${G.vsTurn + 1} selesai.` : ''}`);
      paintGame();
    } else if (S.gameTab === 'maze' && G.mz) {
      G.mz.drawing = false;
      G.mz.state = 'timeout';
      if (G.playMode === 'versus') G.vsRounds[G.vsTurn]++;
      msg('Waktu habis untuk ronde labirin ini!');
      paintGame();
    }
  }

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  const NET_HINT = 'Jika internet Anda normal, permintaan ke situs lain kemungkinan diblokir oleh pratinjau/sandbox atau ekstensi pemblokir iklan. Buka lewat hosting https:// atau pakai versi offline (bundle-quran.mjs).';
  const QD = () => window.QURAN_DATA || null; // data Al-Qur'an tertanam (versi offline)
  async function surahText(n) {
    if (G.cache[n]) return G.cache[n];
    if (QD() && QD().ay[n]) return (G.cache[n] = QD().ay[n]);
    const sources = [
      async () => (await getJSON(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`)).data.ayahs.map(a => a.text.trim()),
      async () => (await getJSON(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${n}`)).verses.map(v => v.text_uthmani.trim())
    ];
    let err;
    for (const load of sources) {
      try {
        const ay = await load();
        if (!ay.length) throw new Error('data kosong');
        if (n !== 1 && plain(ay[0]).startsWith('بسم الله الرحمن الرحيم')) ay[0] = wordsOf(ay[0]).slice(4).join(' ');
        return (G.cache[n] = ay);
      } catch (e) { err = e; }
    }
    throw err;
  }

  function gameSetupHTML() {
    const words = S.gameTab === 'words', decoyOn = words ? G.wordDecoy : G.mazeDecoy;
    return `
      <div class="gm-arena-inner">
        <div class="gm-topbar">
          <b style="color:var(--h);font-size:16px;display:flex;align-items:center;gap:8px">${ic(words ? 'puzzle' : 'route', 18)} ${words ? 'Susun Kata Ayat' : 'Labirin Ayat'}</b>
          <button class="btn s" style="padding:6px 12px;font-size:12px" onclick="closeGame()">${ic('x', 14)} Keluar</button>
        </div>
        <p class="em" style="text-align:left;padding:2px 0 14px">${words
          ? 'Atur permainan, lalu tekan <b>Mulai</b>. Susun kata-kata ayat berikutnya sesuai urutan.'
          : 'Atur permainan, lalu tekan <b>Mulai</b>. Gambar garis dari awal ke akhir ayat tanpa menyentuh dinding.'}</p>
        <div class="gm-cfg">
          <div>
            <label>Mode Pemain</label>
            <select onchange="setGamePlayMode(this.value)">
              <option value="solo" ${G.playMode === 'solo' ? 'selected' : ''}>Solo (1 Pemain)</option>
              <option value="versus" ${G.playMode === 'versus' ? 'selected' : ''}>Versus (2 Pemain · 1 Perangkat)</option>
            </select>
          </div>
          <div>
            <label>Batas Waktu per Ronde</label>
            <select onchange="setGameTimeLimit(this.value)">
              ${[[0, 'Tanpa Batas Waktu'], [30, '30 Detik'], [60, '60 Detik'], [90, '90 Detik'], [120, '120 Detik']].map(([v, l]) => `<option value="${v}" ${G.timeLimit === v ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Tingkat Kesulitan</label>
            <select onchange="${words ? 'setWordDecoy' : 'setMazeDecoy'}(this.value)">
              <option value="0" ${!decoyOn ? 'selected' : ''}>Mudah</option>
              <option value="1" ${decoyOn ? 'selected' : ''}>Normal</option>
            </select>
          </div>
        </div>
        <div class="row">
          <select onchange="gameSurah(this.value)">${SURAH_LIST.map(([no, nm, ay]) => `<option value="${no}" ${G.surah === no ? 'selected' : ''}>${no}. ${esc(nm)} (${ay} ayat)</option>`).join('')}</select>
          ${words ? `<input id="gst" type="number" min="1" value="${G.start}" oninput="setGameStart(this.value)" placeholder="Mulai dari ayat" style="max-width:150px">` : ''}
        </div>
        <button class="btn w" onclick="startGame()">${ic('play', 16)} Mulai</button>
      </div>`;
  }

  function gameTopBarHTML() {
    const timerHTML = G.timeLimit > 0
      ? `<span id="gm-timer-pill" class="gm-timer-pill ${G.timeLeft <= 10 ? 'low' : ''}">${ic('timer', 15)} <span id="gm-timer-val">${formatGameTime(G.timeLeft)}</span></span>`
      : `<span class="gm-timer-pill">${ic('infinity', 15)} Tanpa Batas</span>`;

    const modeBadge = G.playMode === 'versus'
      ? `<span class="chip" style="font-size:12px;padding:4px 10px">${ic('users', 14)} Versus 1 Perangkat</span>`
      : `<span class="chip" style="font-size:12px;padding:4px 10px">${ic('user', 14)} Solo</span>`;

    const scoreChips = (G.playMode === 'solo' ? `<span class="chip gm-chip">${ic('star', 14)} ${G.score}</span>${G.streak ? `<span class="chip gm-chip" style="color:var(--pink)">${ic('flame', 14)} ${G.streak}</span>` : ''}` : '')
      + (S.gameTab === 'words' && G.ay.length ? `<span class="chip gm-chip">${ic('book-open', 14)} Ayat ${G.idx + 2}/${G.ay.length}</span>` : '');
    const timerBar = G.timeLimit > 0 ? `<div class="gm-bar"><i id="gm-timer-bar" style="width:${Math.max(0, G.timeLeft / G.timeLimit * 100)}%"></i></div>` : '';
    return `
      <div class="gm-topbar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${modeBadge}
          ${timerHTML}
          ${scoreChips}
        </div>
        <button class="btn s" style="padding:6px 12px;font-size:12px" onclick="closeGame()">${ic('x', 14)} Keluar</button>
      </div>
      ${timerBar}
      ${G.playMode === 'versus' ? `
        <div class="vs-board">
          <div class="vs-card ${G.vsTurn === 0 ? 'turn' : ''}">
            <div>
              <b style="color:var(--h);font-size:13.5px;display:block">Pemain 1</b>
              <small style="color:var(--m)">Skor: <b style="color:var(--p)">${G.vsScores[0]}</b> · Ronde ${G.vsRounds[0]}</small>
            </div>
            ${G.vsTurn === 0 ? '<span class="vs-tag">Giliran</span>' : ''}
          </div>
          <div class="vs-card p2 ${G.vsTurn === 1 ? 'turn' : ''}">
            <div>
              <b style="color:var(--h);font-size:13.5px;display:block">Pemain 2</b>
              <small style="color:var(--m)">Skor: <b style="color:var(--pink)">${G.vsScores[1]}</b> · Ronde ${G.vsRounds[1]}</small>
            </div>
            ${G.vsTurn === 1 ? '<span class="vs-tag">Giliran</span>' : ''}
          </div>
        </div>` : ''}`;
  }

  function gameHTML() {
    if (G.phase === 'loading') return '<div class="gm-arena-inner"><p class="em">Memuat teks ayat…</p></div>';
    if (G.phase === 'error') {
      return `
        <div class="gm-arena-inner">
          <p class="em">${esc(G.err)}</p>
          <div class="row" style="justify-content:center">
            <button class="btn" onclick="startGame()">${ic('rotate-ccw', 15)} Coba Lagi</button>
            <button class="btn s" onclick="gameBack()">${ic('settings', 15)} Ubah Pengaturan</button>
            <button class="btn s" onclick="closeGame()">${ic('x', 15)} Keluar</button>
          </div>
        </div>`;
    }
    if (G.phase !== 'play') return gameSetupHTML();
    return `
      <div class="gm-arena-inner">
        ${gameTopBarHTML()}
        ${S.gameTab === 'words' ? wordsHTML() : mazeHTML()}
      </div>`;
  }

  function paintGame() {
    const fs = $('#gm-fs');
    fs.classList.toggle('on', G.fullscreen);
    fs.innerHTML = G.fullscreen ? gameHTML() : '';
    if (window.lucide) lucide.createIcons();
    mountGame();
  }
  function mountGame() { if (S.gameTab === 'maze' && G.phase === 'play') drawMaze(); }

  async function startGame() {
    const st = $('#gst');
    G.start = Math.max(1, st ? +st.value || 1 : 1);
    G.phase = 'loading';
    stopGameTimer();
    paintGame();
    try {
      G.ay = await surahText(G.surah);
    } catch (e) {
      G.phase = 'error';
      G.err = `Gagal memuat teks ayat (${e && e.message ? e.message : e}). ${NET_HINT}`;
      return paintGame();
    }
    G.score = 0;
    G.streak = 0;
    G.vsScores = [0, 0];
    G.vsTurn = 0;
    G.vsRounds = [0, 0];
    if (S.gameTab === 'words') {
      if (G.ay.length < 2) {
        G.phase = 'error';
        G.err = 'Surah ini hanya memiliki 1 ayat. Pilih surah lain.';
        return paintGame();
      }
      G.idx = Math.min(G.start, G.ay.length - 1) - 1;
      roundWords();
    } else {
      roundMaze();
    }
  }

  // --- Susun Kata ---
  function roundWords() {
    G.target = wordsOf(G.ay[G.idx + 1]);
    G.got = [];
    G.miss = 0;
    G.done = false;
    G.shake = -1;

    const baseTiles = G.target.map(w => ({ w, used: false, decoy: false }));
    if (G.wordDecoy) {
      const targetSet = new Set(G.target);
      const otherWords = G.ay
        .filter((_, idx) => idx !== G.idx + 1)
        .flatMap(wordsOf)
        .filter(w => !targetSet.has(w));
      const uniqueOthers = shuffle([...new Set(otherWords)]);
      const decoyCount = Math.min(uniqueOthers.length, Math.max(2, Math.min(4, Math.ceil(G.target.length * 0.4))));
      uniqueOthers.slice(0, decoyCount).forEach(w => {
        baseTiles.push({ w, used: false, decoy: true });
      });
    }

    G.tiles = shuffle(baseTiles);
    G.phase = 'play';
    startRoundTimer();
    paintGame();
  }
  function wordsHTML() {
    const last = G.idx + 2 >= G.ay.length;
    const timedOut = G.timeLimit > 0 && G.timeLeft <= 0 && G.got.length < G.target.length;
    return `
      <div class="gm-prev">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <small>Ayat ${G.idx + 1}</small>
          <span class="chip" style="font-size:11px;padding:3px 9px;color:${G.wordDecoy ? 'var(--pink)' : 'var(--p)'}">${ic('sparkles', 12)} Mode ${G.wordDecoy ? 'Normal' : 'Mudah'}</span>
        </div>
        <div class="gm-ar">${esc(G.ay[G.idx])}</div>
      </div>
      <small>Sambungkan ayat ${G.idx + 2}: tekan kata-kata sesuai urutan${G.wordDecoy ? ' (abaikan kata pengecoh dari ayat lain)' : ''}</small>
      <div class="gm-slots">${G.got.length ? G.got.map(w => `<span class="gm-w ok">${esc(w)}</span>`).join('') : '<span class="note">…</span>'}</div>
      ${G.done ? `
        <div class="ann" style="margin:12px auto">
          ${ic(timedOut ? 'clock-alert' : 'trophy', 18)}
          <span>${timedOut
            ? `Waktu habis! Jawaban: <b style="font-family:'Scheherazade New',serif;font-size:20px">${esc(G.target.join(' '))}</b>`
            : (G.playMode === 'versus'
              ? `Pemain ${G.vsTurn + 1} benar! Skor P1: ${G.vsScores[0]} · P2: ${G.vsScores[1]}`
              : `Benar! Skor ${G.score} · beruntun ${G.streak}`)}</span>
        </div>
        <button class="btn" onclick="gameNext()">${last ? 'Selesai' : (G.playMode === 'versus' ? `Lanjut ke Giliran Pemain ${((G.vsTurn + 1) % 2) + 1}` : 'Ayat berikutnya')} ${ic('arrow-right', 16)}</button>` : `
        <div class="gm-tiles">${G.tiles.map((t, i) => `<button class="gm-tile ${t.used ? 'used' : ''} ${G.shake === i ? 'shake' : ''}" onclick="gamePick(${i})">${esc(t.w)}</button>`).join('')}</div>
        <div class="row" style="margin-top:12px"><small style="color:var(--m)">${G.playMode === 'versus' ? `Giliran Pemain ${G.vsTurn + 1}` : `Skor ${G.score}`} · salah ${G.miss}</small><button class="btn s" style="margin-left:auto" onclick="gameNext()">Lewati</button></div>`}`;
  }
  function gamePick(i) {
    const t = G.tiles[i];
    if (!t || t.used || G.done) return;
    if (t.w === G.target[G.got.length]) {
      t.used = true;
      G.got.push(t.w);
      G.shake = -1;
      if (G.got.length === G.target.length) {
        G.done = true;
        stopGameTimer();
        const gained = Math.max(10, G.target.length * 10 - G.miss * 5 + (G.wordDecoy ? 15 : 0));
        if (G.playMode === 'versus') {
          G.vsScores[G.vsTurn] += gained;
          G.vsRounds[G.vsTurn]++;
        } else {
          if (!G.miss) G.streak++;
          G.score += gained;
        }
      }
    } else {
      G.miss++;
      G.streak = 0;
      G.shake = i;
      vibe(80);
    }
    paintGame();
    if (G.done) celebrate();
  }
  function gameNext() {
    stopGameTimer();
    if (!G.done) {
      G.streak = 0;
      if (G.playMode === 'versus') G.vsRounds[G.vsTurn]++;
    }
    if (G.idx + 2 >= G.ay.length) {
      G.phase = 'idle';
      if (G.playMode === 'versus') {
        const w = G.vsScores[0] === G.vsScores[1] ? 'Seri!' : (G.vsScores[0] > G.vsScores[1] ? 'Pemain 1 Menang!' : 'Pemain 2 Menang!');
        msg(`Surah selesai! ${w} (P1: ${G.vsScores[0]} - P2: ${G.vsScores[1]})`);
      } else {
        msg(`Surah selesai! Skor ${G.score}`);
      }
      return paintGame();
    }
    if (G.playMode === 'versus') G.vsTurn = (G.vsTurn + 1) % 2;
    G.idx++;
    roundWords();
  }

  // --- Labirin ---
  function makeMaze(N) {
    const M = Array.from({ length: N * N }, () => ({ w: [true, true, true, true] })); // atas, kanan, bawah, kiri
    const D = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
    const seen = new Set([0]), st = [0];
    while (st.length) {
      const c = st[st.length - 1], x = c % N, y = Math.floor(c / N);
      const nb = D.filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < N && ny < N && !seen.has(ny * N + nx); });
      if (!nb.length) { st.pop(); continue; }
      const [dx, dy, a, b] = nb[Math.floor(Math.random() * nb.length)], n = (y + dy) * N + x + dx;
      M[c].w[a] = false;
      M[n].w[b] = false;
      seen.add(n);
      st.push(n);
    }
    return M;
  }
  function solveMaze(M, N) {
    const prev = new Map([[0, -1]]), q = [0], D = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    while (q.length) {
      const c = q.shift();
      if (c === N * N - 1) break;
      D.forEach(([dx, dy], k) => {
        const x = (c % N) + dx, y = Math.floor(c / N) + dy, n = y * N + x;
        if (x >= 0 && y >= 0 && x < N && y < N && !M[c].w[k] && !prev.has(n)) { prev.set(n, c); q.push(n); }
      });
    }
    const p = [];
    for (let c = N * N - 1; c !== -1; c = prev.get(c)) p.unshift(c);
    return p;
  }
  function roundMaze() {
    const pool = G.ay.map(wordsOf).filter(w => w.length >= 3 && w.length <= 9);
    if (!pool.length) {
      G.phase = 'error';
      G.err = 'Surah ini tidak memiliki ayat pendek (3–9 kata). Pilih surah lain.';
      return paintGame();
    }
    const words = pool[Math.floor(Math.random() * pool.length)], N = words.length <= 6 ? 6 : 7;
    let M, path;
    for (let t = 0; t < 80; t++) { M = makeMaze(N); path = solveMaze(M, N); if (path.length >= words.length + 2) break; }
    const L = path.length, lab = {};
    words.forEach((w, k) => { lab[path[words.length > 1 ? Math.round(k * (L - 1) / (words.length - 1)) : 0]] = w; });
    const onPath = new Set(path), pick = G.ay.flatMap(wordsOf).filter(w => !words.includes(w));
    const deadEnds = shuffle(M.map((c, k) => k).filter(k => k !== 0 && k !== N * N - 1 && !onPath.has(k) && M[k].w.filter(Boolean).length === 3));

    // Mode pengecoh tujuan: 1 sel buntu dijadikan tujuan akhir ayat pengecoh dari ayat lain
    let decoyGoalCell = -1;
    let decoyEndingWord = '';
    if (G.mazeDecoy && deadEnds.length) {
      decoyGoalCell = deadEnds.shift();
      const otherEndings = G.ay
        .map(wordsOf)
        .filter(w => w.join(' ') !== words.join(' '))
        .map(w => w[w.length - 1])
        .filter(w => w && w !== words[words.length - 1]);
      decoyEndingWord = otherEndings.length
        ? otherEndings[Math.floor(Math.random() * otherEndings.length)]
        : (pick[0] || 'خَتْمٌ');
      lab[decoyGoalCell] = decoyEndingWord;
    }

    deadEnds.slice(0, 5)
      .forEach(k => { if (pick.length) lab[k] = pick[Math.floor(Math.random() * pick.length)]; });

    G.ayat = G.ay.findIndex(t => wordsOf(t).join(' ') === words.join(' ')) + 1;
    G.mz = {
      N,
      M,
      lab,
      words,
      pts: [],
      drawing: false,
      state: 'idle',
      walls: [],
      cs: 0,
      decoyGoalCell,
      decoyEndingWord
    };
    G.phase = 'play';
    startRoundTimer();
    paintGame();
  }
  function mazeMsg() {
    const s = G.mz.state;
    if (s === 'win') {
      const info = G.playMode === 'versus'
        ? `Pemain ${G.vsTurn + 1} memenangi ronde! Skor P1: ${G.vsScores[0]} · P2: ${G.vsScores[1]}`
        : `Selamat! Ayat tersambung. Skor ${G.score}`;
      return `<div class="gm-ar" style="text-align:center">${esc(G.mz.words.join(' '))}</div><b style="color:var(--ok)">${info}</b>`;
    }
    if (s === 'decoy') return '<b style="color:var(--er)">Tujuan pengecoh! Itu akhir dari ayat lain. Mulai lagi dari ▶.</b>';
    if (s === 'fail') return '<b style="color:var(--er)">Menyentuh dinding! Mulai lagi dari ▶.</b>';
    if (s === 'timeout') return `<b style="color:var(--er)">Waktu habis! Akhir ayat yang benar: ${esc(G.mz.words[G.mz.words.length - 1])}</b>`;
    return G.mz.decoyGoalCell >= 0
      ? 'Tekan sel ▶, lalu geser ke ★ akhir ayat yang tepat. Waspadai satu ★ pengecoh!'
      : 'Tekan sel ▶, lalu geser tanpa melepas jari.';

  function mazeStatus() { const el = $('#mz-msg'); if (el && G.mz) el.innerHTML = mazeMsg(); }
  function mazeHTML() {

  function drawMaze() {
    const cv = $('#mz'), m = G.mz;
    if (!cv || !m) return;
    if (!G.fontOk && document.fonts) {
      G.fontOk = true;
      document.fonts.load("700 20px 'Scheherazade New'").then(() => { if ($('#mz')) drawMaze(); });
    }
    const W = cv.clientWidth || 340, N = m.N, pad = Math.max(12, Math.round(W * .04)), cs = (W - pad * 2) / N;
    const dpr = window.devicePixelRatio || 1, px = Math.round(W * dpr);
    if (cv.width !== px) cv.width = cv.height = px;
    const g = cv.getContext('2d'), css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
    const X = k => pad + (k % N) * cs, Y = k => pad + Math.floor(k / N) * cs;
    const rr = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, W);
    Object.assign(m, { cs, pad, walls: [] });
    const mark = (k, col) => { g.globalAlpha = .22; g.fillStyle = col; rr(X(k) + 2, Y(k) + 2, cs - 4, cs - 4, cs * .2); g.fill(); g.globalAlpha = 1; };
    const goal = N * N - 1;
    mark(0, c('--ok'));
    mark(goal, c('--gold'));
    if (m.decoyGoalCell >= 0) mark(m.decoyGoalCell, c('--gold'));
    g.strokeStyle = c('--h');
    g.globalAlpha = .82;
    g.lineWidth = 3;
    g.lineCap = 'round';
    g.beginPath();
    m.M.forEach((cell, k) => {
      const x = X(k), y = Y(k);
      [[x, y, x + cs, y], [x + cs, y, x + cs, y + cs], [x, y + cs, x + cs, y + cs], [x, y, x, y + cs]].forEach((sg, i) => {
        if (cell.w[i]) { g.moveTo(sg[0], sg[1]); g.lineTo(sg[2], sg[3]); m.walls.push(sg); }
      });
    });
    g.stroke();
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    Object.entries(m.lab).forEach(([key, w]) => {
      const k = +key, font = f => `700 ${f}px 'Scheherazade New','Amiri',serif`;
      let f = Math.round(cs * .34);
      g.font = font(f);
      while (g.measureText(w).width > cs * .74 && f > 8) g.font = font(--f);
      const tw = g.measureText(w).width + 10, th = f * 1.2, cx = X(k) + cs / 2, cy = Y(k) + cs / 2;
      g.fillStyle = c('--card-g');
      g.strokeStyle = c('--bd-s');
      g.lineWidth = 1;
      rr(cx - tw / 2, cy - th / 2, tw, th, th / 2.5);
      g.fill();
      g.stroke();
      g.fillStyle = c('--p');
      g.fillText(w, cx, cy + f * .05);
    });
    g.font = `700 ${Math.round(cs * .26)}px system-ui,sans-serif`;
    g.fillStyle = c('--ok');
    g.fillText('▶', X(0) + cs * .2, Y(0) + cs * .2);
    g.fillStyle = c('--gold');
    g.fillText('★', X(goal) + cs * .8, Y(goal) + cs * .8);
    if (m.decoyGoalCell >= 0) g.fillText('★', X(m.decoyGoalCell) + cs * .8, Y(m.decoyGoalCell) + cs * .8);
    if (m.pts.length > 1) {
      const bad = ['fail', 'decoy', 'timeout'].includes(m.state), a = m.pts[0], b = m.pts[m.pts.length - 1];
      const gr = g.createLinearGradient(a[0], a[1], b[0] + .01, b[1] + .01);
      gr.addColorStop(0, bad ? c('--er') : c('--p'));
      gr.addColorStop(1, bad ? c('--er') : c('--pink'));
      g.strokeStyle = gr;
      g.lineWidth = 5;
      g.lineJoin = 'round';
      g.shadowColor = bad ? c('--er') : c('--pink');
      g.shadowBlur = 8;
      g.beginPath();
      m.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.stroke();
      g.shadowBlur = 0;
    }
    bindMaze(cv);
  }
  function bindMaze(cv) {
    if (cv.dataset.bound) return;
    cv.dataset.bound = '1';
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const cellOf = ([x, y]) => {
      const m = G.mz, cx = Math.floor((x - m.pad) / m.cs), cy = Math.floor((y - m.pad) / m.cs);
      return cx < 0 || cy < 0 || cx >= m.N || cy >= m.N ? -1 : cy * m.N + cx;
    };
    const hit = ([x, y]) => G.mz.walls.some(([x1, y1, x2, y2]) => {
      const dx = Math.max(Math.min(x1, x2) - x, 0, x - Math.max(x1, x2)), dy = Math.max(Math.min(y1, y2) - y, 0, y - Math.max(y1, y2));
      return dx * dx + dy * dy < 36;
    });
    cv.addEventListener('pointerdown', e => {
      const m = G.mz, p = pos(e);
      if (m.state === 'win' || m.state === 'timeout' || cellOf(p) !== 0) return;
      cv.setPointerCapture(e.pointerId);
      Object.assign(m, { drawing: true, pts: [p], state: 'idle' });
      mazeStatus();
      drawMaze();
    });
    cv.addEventListener('pointermove', e => {
      const m = G.mz;
      if (!m || !m.drawing) return;
      const [px, py] = m.pts[m.pts.length - 1], [x, y] = pos(e), n = Math.max(1, Math.ceil(Math.hypot(x - px, y - py) / 3));
      for (let i = 1; i <= n; i++) {
        const p = [px + (x - px) * i / n, py + (y - py) * i / n];
        m.pts.push(p);
        if (hit(p)) {
          m.drawing = false;
          m.state = 'fail';
          vibe(120);
          cv.classList.remove('shake');
          void cv.offsetWidth;
          cv.classList.add('shake');
          break;
        }
        const cIdx = cellOf(p);
        if (m.decoyGoalCell >= 0 && cIdx === m.decoyGoalCell) {
          m.drawing = false;
          m.state = 'decoy';
          break;
        }
        if (cIdx === m.N * m.N - 1) {
          m.drawing = false;
          m.state = 'win';
          stopGameTimer();
          const gained = 10 + m.words.length * 5 + (m.decoyGoalCell >= 0 ? 15 : 0);
          if (G.playMode === 'versus') {
            G.vsScores[G.vsTurn] += gained;
            G.vsRounds[G.vsTurn]++;
          } else {
            G.score += gained;
          }
          break;
        }
      }
      mazeStatus();
      drawMaze();
      if (m.state === 'win') celebrate();
    });
    const up = () => {
      const m = G.mz;
      if (m && m.drawing) { m.drawing = false; m.pts = []; drawMaze(); }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  }

  const MF = { page: 1, cache: new Map(), names: null, busy: 0 };
  const arDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const BISMILLAH = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';

  async function mfNames() {
    if (MF.names) return MF.names;
    if (QD() && QD().nm) return (MF.names = QD().nm);
    try {
      const j = await (await fetch('https://api.quran.com/api/v4/chapters?language=id')).json();

    return MF.names;
  }

  async function mfPage(n) {
    if (MF.cache.has(n)) return MF.cache.get(n);
    const emb = QD() && QD().pg[n];
    if (emb) { // format ringkas: [0,surah] | [1] bismillah | [2,tengah,[kata...]]
      const page = { n, juz: emb.j, lines: emb.l.map(l => l[0] === 0 ? { kind: 'surah', sn: l[1] } : l[0] === 1 ? { kind: 'bsm' } : { kind: 'text', center: !!l[1], w: l[2].map(t => (t[0] === '﴿' ? { t, e: true } : { t })) }) };
      MF.cache.set(n, page);
      return page;
    }
    let j;
    try { j = await getJSON(`https://api.quran.com/api/v4/verses/by_page/${n}?words=true&word_fields=text_uthmani,line_number&per_page=50`); }
    catch (e) { j = await getJSON(`https://api.quran.com/api/v4/verses/by_page/${n}?words=true&word_fields=text_uthmani&per_page=50`); } // cadangan bila parameter ditolak
    if (j.verses && j.verses[0] && j.verses[0].words && j.verses[0].words[0] && j.verses[0].words[0].line_number == null) throw new Error('data baris tidak tersedia');
    if (!j.verses || !j.verses.length) throw new Error('kosong');
    const rows = new Map();
    j.verses.forEach(v => {
      const sn = +v.verse_key.split(':')[0], last = v.verse_number === SURAH_LIST[sn - 1][2];
      v.words.forEach(w => {
        if (!rows.has(w.line_number)) rows.set(w.line_number, { w: [], start: 0, end: false });
        const row = rows.get(w.line_number);
        if (w.char_type_name === 'end') {
          row.w.push({ t: '﴿' + arDigits(v.verse_number) + '﴾', e: true });
          if (last) row.end = true;
        } else if (w.text_uthmani) row.w.push({ t: w.text_uthmani });
        if (v.verse_number === 1 && w.position === 1) row.start = sn;
      });
    });
    const lines = [];
    [...rows.keys()].sort((a, b) => a - b).forEach(k => {
      const row = rows.get(k);
      if (row.start) {
        lines.push({ kind: 'surah', sn: row.start });
        if (row.start !== 1 && row.start !== 9) lines.push({ kind: 'bsm' });
      }
      lines.push({ kind: 'text', w: row.w, center: row.end });
    });
    const page = { n, juz: j.verses[0].juz_number, lines };
    MF.cache.set(n, page);
    return page;
  }

          const raf = time => {

        const targets = appEl.querySelectorAll('.hd h1, .hero h2, .card > b, .fc b');
        targets.forEach(el => {
          if (el.dataset.wordsSplit) return;
          el.dataset.wordsSplit = '1';
          const walkAndWrap = node => {
            if (node.nodeType === Node.TEXT_NODE) {
              const text = node.textContent;
              if (!text.trim()) return;
              const frag = document.createDocumentFragment();
              text.split(/(\s+)/).forEach(part => {
                if (!part) return;
                if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
                else {
                  const wrap = document.createElement('span');
                  wrap.className = 'word-wrap';
                  const inner = document.createElement('span');
                  inner.className = 'word-inner';
                  inner.textContent = part;
                  wrap.appendChild(inner);
                  frag.appendChild(wrap);
                }
              });
              node.parentNode.replaceChild(frag, node);
            } else if (node.nodeType === Node.ELEMENT_NODE && !node.hasAttribute('data-lucide') && node.tagName.toLowerCase() !== 'svg') {
              Array.from(node.childNodes).forEach(walkAndWrap);
            }
          };
          walkAndWrap(el);
          const words = el.querySelectorAll('.word-inner');
          if (words.length) {
            gsap.fromTo(words, { yPercent: 110, opacity: 0 }, {
              yPercent: 0,
              opacity: 1,
              duration: 0.65,
              ease: 'power3.out',
              stagger: 0.045,
              scrollTrigger: { trigger: el, scroller: appEl, start: 'top 94%', once: true }
            });
          }
        });
        requestAnimationFrame(() => { if (window.ScrollTrigger) ScrollTrigger.refresh(); });
      }
    } catch (err) {
      console.warn('Animation init skipped:', err);
    }
  }

  const SCROLLERS = '.strip,.cat-pills,.cal-pills,.bn';
  const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INDICATORS = [
    ['side', '.side .nv.on', true],

  ];
  let lastRects = {}, monthShift = 0;
  const SPRING = 'cubic-bezier(.34,1.45,.64,1)';

  function slideIndicators(appEl, pageNav) {
    const rects = {};
    INDICATORS.forEach(([k, sel, nav]) => {
      const e = appEl.querySelector(sel);
      if (!e || !e.getClientRects().length) return;
      const r = e.getBoundingClientRect();
      rects[k] = { x: r.left, y: r.top };
      const p = lastRects[k];
      if (!p || REDUCED || (pageNav && !nav) || (k === 'mon' && monthShift)) return;
      const dx = p.x - r.left, dy = p.y - r.top;
      if (Math.abs(dx) + Math.abs(dy) < 2) return;
      e.animate([{ transform: `translate(${dx}px,${dy}px) scale(.94)` }, { transform: 'translate(0,0) scale(1)' }], { duration: 560, easing: SPRING });
    });
    lastRects = rects;

    if (monthShift && !REDUCED) {
      const ps = [...appEl.querySelectorAll('.cal-pills .cal-mp')];
      if (ps.length > 1) {
        const slot = ps[1].getBoundingClientRect().left - ps[0].getBoundingClientRect().left;
        const dx = Math.max(-5, Math.min(5, monthShift)) * slot, box = ps[0].parentElement;
        box.style.overflow = 'hidden';
        let last;
        ps.forEach(b => {
          last = b.animate([{ transform: `translateX(${dx}px)` }, { transform: 'translateX(0)' }], { duration: 500, easing: 'cubic-bezier(.22,1,.36,1)' });
        });
        last.finished.then(() => { box.style.overflow = ''; }).catch(() => { box.style.overflow = ''; });
      }
    }
    monthShift = 0;
  }

  function glideTo(el, from) {
    el.scrollLeft = from;
    const a = el.querySelector('.on');
    if (!a) return;
    const er = el.getBoundingClientRect(), ar = a.getBoundingClientRect();
    const to = Math.max(0, Math.min(el.scrollWidth - el.clientWidth, from + (ar.left - er.left) - (er.width - ar.width) / 2));
    if (Math.abs(to - from) < 2) return;
    const t0 = performance.now(), D = 520;
    const step = t => {
      const k = Math.min(1, (t - t0) / D);
      el.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k, 3));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function initDragScroll() {
    document.querySelectorAll('.drag-scroll').forEach(el => {
      if (el.dataset.dragBound) return;
      el.dataset.dragBound = '1';
      let isDown = false, moved = false, startX = 0, startY = 0, scrollL = 0, scrollT = 0;
      el.addEventListener('mousedown', e => {
        if (e.button !== 0 || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        isDown = true;
        moved = false;
        startX = e.pageX - el.offsetLeft;
        startY = e.pageY - el.offsetTop;
        scrollL = el.scrollLeft;
        scrollT = el.scrollTop;
      });
      window.addEventListener('mouseup', () => {
        if (!isDown) return;
        isDown = false;
        el.classList.remove('dragging');
      });
      el.addEventListener('mousemove', e => {
        if (!isDown) return;
        const x = e.pageX - el.offsetLeft;
        const y = e.pageY - el.offsetTop;
        const dx = x - startX;
        const dy = y - startY;
        if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          moved = true;
          el.classList.add('dragging');
        }
        if (moved) {
          e.preventDefault();
          el.scrollLeft = scrollL - dx;
          el.scrollTop = scrollT - dy;
        }
      });
      el.addEventListener('click', e => {
        if (moved) {
          e.preventDefault();
          e.stopPropagation();
          moved = false;
        }
      }, true);
    });
  }

  function computeCountdown() {
    const now = new Date();
    const t = iso(now);
    const list = S.imsak || [];
    const rowToday = list.find(x => x.date === t) || list[0];
    if (!rowToday) return { label: 'Hitung Mundur Imsak & Berbuka', timer: S.prefs.city_id ? 'Memuat waktu...' : '-- : -- : --' };
    const parseTime = (dateStr, hm) => {
      const [H, M] = (hm || '00:00').split(':').map(Number);
      const d = new Date(dateStr + 'T00:00:00');
      d.setHours(H, M, 0, 0);
      return d;
    };
    const imsakTime = parseTime(t, rowToday.imsak);
    const maghribTime = parseTime(t, rowToday.maghrib);
    let targetTime, label;
    if (now < imsakTime) {
      targetTime = imsakTime;
      label = `Menuju Imsak (${rowToday.imsak})`;
    } else if (now < maghribTime) {
      targetTime = maghribTime;
      label = `Menuju Berbuka / Maghrib (${rowToday.maghrib})`;
    } else {
      const tomorrow = addD(t, 1);
      const rowNext = list.find(x => x.date === tomorrow) || rowToday;
      targetTime = parseTime(tomorrow, rowNext.imsak);
      label = `Menuju Imsak Esok (${rowNext.imsak})`;
    }
    const diffSec = Math.max(0, Math.floor((targetTime - now) / 1000));
    const hh = String(Math.floor(diffSec / 3600)).padStart(2, '0');
    const mm = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
    const ss = String(diffSec % 60).padStart(2, '0');
    return { label, timer: `${hh} : ${mm} : ${ss}` };
  }

      if (!u || !p) return msg('Isi username dan password');
      if (IS_PREVIEW) {
        S.admin = !!adm;
        if (adm) {
          S.user = { username: u, full_name: 'Admin' };
        } else {
          let found = mem.users.find(x => x.username.toLowerCase() === u.toLowerCase());
          if (found && found.active === false) return msg('Akun dinonaktifkan oleh admin');
          if (!found) {
            found = { id: nid(), username: u.toLowerCase(), full_name: u, last_seen: new Date().toISOString(), created_at: new Date().toISOString() };
            mem.users.push(found);
          }
          S.user = found;
        }
        return enter();
      }
      if (adm) {
        const { error } = await sb.auth.signInWithPassword({ email: u, password: p });
        if (error) throw error;
        S.admin = true;
        S.user = { username: u, full_name: 'Admin' };
      } else {
        const { data, error } = await sb.rpc('login_user', { p_username: u, p_password: p });
        if (error) throw error;
        TOKEN = data.token;
        S.admin = false;
        S.user = data.user;
        try { if ($('#rm').checked) localStorage.setItem('rj_t', TOKEN); } catch (e) {}
      }
      await enter();
    },
    async doReg() {
      const n = $('#rn').value.trim(), u = $('#lu').value.trim(), p = $('#lp').value;
      if (!n || !u || p.length < 6) return msg('Lengkapi data, password minimal 6 karakter');
      if (IS_PREVIEW) {
        const x = { id: nid(), username: u.toLowerCase(), full_name: n, last_seen: new Date().toISOString(), created_at: new Date().toISOString() };
        mem.users.push(x);
        S.user = x;
        S.admin = false;
        return enter();
      }
      const { data, error } = await sb.rpc('register_user', { p_username: u, p_password: p, p_name: n });
      if (error) throw error;
      TOKEN = data.token;
      S.admin = false;
      S.user = data.user;
      try { if ($('#rm').checked) localStorage.setItem('rj_t', TOKEN); } catch (e) {}
      await enter();
    },
    async logout() {
      if (!IS_PREVIEW) {
        try { if (S.admin) await sb.auth.signOut(); else await sb.rpc('logout_user'); } catch (e) {}
        try { localStorage.removeItem('rj_t'); } catch (e) {}
        TOKEN = null;
        clearInterval(beatT);
      }
      clearInterval(cdT);
      Object.assign(S, { user: null, admin: false, page: 'home', day: null, prefs: {}, items: [], checks: [], til: [], haf: [], jr: [], imsak: null, cities: [] });
      render();
    },
    async togUzur(d) {
      const cur = new Set(getUzurDays());
      if (cur.has(d)) cur.delete(d); else cur.add(d);
      const arr = [...cur];
      try { localStorage.setItem('rj_uzur_' + S.user.id, JSON.stringify(arr)); } catch (e) {}
      await A.savePref({ uzur_days: arr });
      msg(cur.has(d) ? 'Hari ditandai uzur syar\'i & masuk daftar Qadha' : 'Status uzur hari ini dihapus');
    },
    async downloadRecap() {
      const node = $('#recap-card');
      if (!node || !window.html2canvas) return msg('Gagal menyiapkan gambar');
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
      const link = document.createElement('a');
      link.download = `rJournal-Recap-${S.set.hijri_year}H.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      msg('Kartu ringkasan berhasil diunduh');
    },
    async copyRecapText() {
      const ibPct = overall('ibadah');
      const totalTilawahPages = S.til.reduce((sum, r) => sum + (+r.pages || 0), 0);
      const totalZiyadahAyat = S.haf.filter(r => r.type === 'ziyadah').reduce((sum, r) => sum + Math.max(0, r.ayat_to - r.ayat_from + 1), 0);
      const txt = `Ringkasan Ramadhan ${S.set.hijri_year} H (rJournal)\n• Capaian Ibadah: ${ibPct}%\n• Total Tilawah: ${totalTilawahPages} halaman\n• Ziyadah Hafalan: ${totalZiyadahAyat} ayat\n• Refleksi Jurnal: ${S.jr.length} hari\nTaqabbalallahu minna wa minkum.`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(txt);
      } else {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      msg('Teks ringkasan disalin ke papan klip');
    },
    async tog(id, d) {
      const c = isDone(id, d);
      if (c) {
        await T.del('checks', c.id);
        S.checks = S.checks.filter(x => !same(x.id, c.id));
      } else {
        S.checks.push(await T.ins('checks', { user_id: S.user.id, item_id: id, day: d }));
      }
      render();
    },
    async addItem(k) {
      const el = $('#ni');
      const n = el ? el.value.trim() : '';
      if (!n) return;
      S.items.push(await T.ins('items', { kind: k, name: n, user_id: S.user.id }));
      render();
      const nextEl = $('#ni');
      if (nextEl) nextEl.focus();
    },
    async delItem(e, id) {
      e.preventDefault();
      await T.del('items', id);
      S.items = S.items.filter(i => !same(i.id, id));
      S.checks = S.checks.filter(c => !same(c.item_id, id));
      render();
    },
    async savePref(p) {
      await persistPref(p);
      render();
    },
    async togTilSlot(d, slotKey, waktu, pages) {
      const r = S.til.find(x => x.day === d && x.mode === slotKey);
      if (r) await T.del('tilawah_log', r.id);
      else await T.ins('tilawah_log', { user_id: S.user.id, day: d, mode: slotKey, surah: `Target ${waktu}`, pages });
      await loadData();
      render();
    },
    async addTil() {
      const s = $('#ts').value.trim();
      if (!s) return msg('Isi surah / juz');
      await T.ins('tilawah_log', { user_id: S.user.id, day: curDay(), mode: 'manual', surah: s, pages: +$('#tp').value || 0, note: $('#tn').value.trim() });
      await loadData();
      render();
      msg('Tersimpan');
    },
    async delRow(t, id) {
      await T.del(t, id);
      await loadData();
      render();
    },
    async saveHaf() {
      await A.savePref({ hafal_juz: +$('#hj').value || 0, zi_target: +$('#hz').value || 5 });
      msg('Profil hafalan tersimpan');
    },
    onSelectSurah(val) { S.hafSurah = val; hafHints(); },
    onSelectSurah2(val) { S.hafSurah2 = val; hafHints(); },
    async addHaf() {
      const s1 = findSurah($('#hs').value), s2 = findSurah($('#hs2').value) || s1;
      if (!s1) return msg('Pilih surah dulu');
      const a = +$('#hf').value, b = +$('#hto').value, multi = s1[0] !== s2[0], step = s2[0] >= s1[0] ? 1 : -1;
      if (!multi && (!a || !b)) return msg('Isi rentang ayat dengan benar');
      const rows = [];
      for (let n = s1[0]; n !== s2[0] + step; n += step) {
        const [no, nm, cnt] = SURAH_LIST[n - 1];
        rows.push({ surah: `${no}. ${nm}`, ayat_from: n === s1[0] ? (a || 1) : 1, ayat_to: n === s2[0] ? (b || cnt) : cnt, cnt });
      }
      const bad = rows.find(r => r.ayat_from < 1 || r.ayat_to < r.ayat_from || r.ayat_to > r.cnt);
      if (bad) return msg(`Rentang ayat ${bad.surah} tidak valid (1–${bad.cnt})`);
      const noteTxt = ($('#hnote')?.value || '').trim();
      const quality = $('#hq').value + (noteTxt ? ` (${noteTxt})` : '');
      for (const r of rows) {
        await T.ins('hafalan_log', { user_id: S.user.id, day: curDay(), type: $('#ht').value, surah: r.surah, ayat_from: r.ayat_from, ayat_to: r.ayat_to, quality });
      }
      S.hafSurah = '';
      S.hafSurah2 = '';
      await loadData();
      render();
      msg(rows.length > 1 ? `${rows.length} surah tersimpan` : 'Catatan hafalan tersimpan');
    },
    async saveJr() {
      const m = document.querySelector('input[name=mood]:checked');
      await T.up('journal', { user_id: S.user.id, day: curDay(), mood: m ? m.value : null, gratitude: $('#jg').value, reflection: $('#jr').value, note: $('#jn').value }, 'user_id,day');
      await loadData();
      render();
      msg('Jurnal tersimpan');
    },
    async filterCity(q) {
      const term = q.trim().toUpperCase();
      if (!term) {
        S.cities = [];
        const listContainer = $('#city-results');
        if (listContainer) {
          listContainer.style.marginTop = '0';
          listContainer.innerHTML = '';
        }
        return;
      }
      const all = await loadAllIndonesianCities();
      S.cities = all.filter(c => c.lokasi.toUpperCase().includes(term)).slice(0, 35);
      const listContainer = $('#city-results');
      if (listContainer) {
        listContainer.style.marginTop = '6px';
        listContainer.innerHTML = S.cities.length
          ? S.cities.map(cityLink).join('')
          : '<p class="em" style="padding:8px">Kota / Kabupaten tidak ditemukan</p>';
        if (window.lucide) lucide.createIcons();
      }
    },
    findCity() { return A.filterCity($('#cq').value); },
    async pickCity(id, name) {
      S.cities = [];
      S.imsak = null;
      const listContainer = $('#city-results');
      if (listContainer) {
        listContainer.style.marginTop = '0';
        listContainer.innerHTML = '';
      }
      const titleEl = $('#imsak-city-title');
      if (titleEl) {
        titleEl.innerHTML = `${ic('map-pin', 17)} Wilayah: ${esc(name)}`;
        if (window.lucide) lucide.createIcons();
      }
      await persistPref({ city_id: id, city_name: name });
      refreshImsakTable();
      await fetchJ();
      scheduleReminders();
      if (S.page === 'imsak') refreshImsakTable();
    },
    async saveSet() {
      const v = i => $('#' + i).value;
      const s = { id: 1, hijri_year: +v('sy'), ramadan_start: v('s1'), ramadan_end: v('s2'), eid_date: v('s3'), source_note: v('s4') };
      if (!s.ramadan_start || !s.ramadan_end || s.ramadan_end < s.ramadan_start) return msg('Tanggal tidak valid');
      await T.up('app_settings', s, 'id');
      let warn = '';
      try {
        await T.up('ramadan_years', { hijri_year: s.hijri_year, ramadan_start: s.ramadan_start, ramadan_end: s.ramadan_end, eid_date: s.eid_date, source_note: s.source_note }, 'hijri_year');
        S.years = await T.sel('ramadan_years');
      } catch (e) { warn = 'Pengaturan utama tersimpan, tetapi daftar tahun gagal: ' + (e.message || e); }
      S.set = pickYear(S.years) || s;
      S.cal = null;
      S.day = null;
      render();
      msg(warn || 'Pengaturan disimpan');
    },
    async delYear(id) {
      await T.del('ramadan_years', id);
      S.years = S.years.filter(y => !same(y.id, id));
      S.set = pickYear(S.years) || S.set;
      S.cal = null;
      S.day = null;
      render();
    },
    async addAnn() {
      const text = $('#ann1').value.trim();
      if (!text) return msg('Tulis pengumuman dulu');
      S.anns.push(await T.ins('announcements', { text, created_at: new Date().toISOString() }));
      render();
      msg('Pengumuman diterbitkan');
    },
    async delAnn(id) {
      await T.del('announcements', id);
      S.anns = S.anns.filter(a => !same(a.id, id));
      render();
    },
    dismissAnn(id) {
      try { localStorage.setItem('rj_ann', String(id)); } catch (e) {}
      render();
    },
    async addDoa() {
      const v = i => $('#' + i).value.trim();
      if (!v('dct') || !v('dca')) return msg('Isi judul dan teks Arab');
      S.doas.push(await T.ins('doa_custom', { cat: v('dck') || 'Lainnya', title: v('dct'), arab: v('dca'), latin: v('dcl'), arti: v('dcr'), dalil: v('dcs') }));
      render();
      msg('Doa ditambahkan');
    },
    async delDoa(id) {
      await T.del('doa_custom', id);
      S.doas = S.doas.filter(d => !same(d.id, id));
      render();
    },
    async pinVid(id) {
      const v = S.vids.find(x => same(x.id, id));
      if (!v) return;
      const pinned = !v.pinned;
      await T.upd('kajian_videos', v.id, { pinned });
      v.pinned = pinned;
      render();
    },
    async moveVid(id, dir) {
      const L = vidSort(S.vids), i = L.findIndex(v => same(v.id, id)), j = i + dir;
      if (i < 0 || j < 0 || j >= L.length || !!L[i].pinned !== !!L[j].pinned) return;
      [L[i], L[j]] = [L[j], L[i]];
      for (let k = 0; k < L.length; k++) {
        if ((L[k].sort_order || 0) !== k) {
          await T.upd('kajian_videos', L[k].id, { sort_order: k });
          L[k].sort_order = k;
        }
      }
      render();
    },
    openResetPw(id) {
      const u = S.users.find(x => same(x.id, id));
      if (!u) return;
      S.resetUser = u;
      S.modal = 'resetpw';
      render();
    },
    async submitResetPw() {
      const pw = ($('#rpw')?.value || '');
      if (pw.length < 6) return msg('Password minimal 6 karakter');
      if (!IS_PREVIEW && S.resetUser) {
        const { error } = await sb.rpc('admin_reset_password', { p_user_id: String(S.resetUser.id), p_password: pw });
        if (error) throw error;
      }
      S.modal = null;
      S.resetUser = null;
      render();
      msg('Password berhasil diubah');
    },
    async togActive(id) {
      const u = S.users.find(x => same(x.id, id));
      if (!u) return;
      const next = u.active === false;
      if (IS_PREVIEW) { const m = mem.users.find(x => same(x.id, id)); if (m) m.active = next; }
      else {
        const { error } = await sb.rpc('admin_set_active', { p_user_id: String(id), p_active: next });
        if (error) throw error;
      }
      u.active = next;
      render();
      msg(next ? 'Akun diaktifkan' : 'Akun dinonaktifkan');
    },
    async addTpl() {
      const name = $('#tpn').value.trim();
      const items = [...new Set($('#tpi').value.split('\n').map(x => x.trim()).filter(Boolean))];
      if (!name || !items.length) return msg('Isi nama template dan minimal satu item');
      S.tpls.push(await T.ins('templates', { kind: $('#tpk').value, name, items }));
      render();
      msg('Template disimpan');
    },
    async delTpl(id) {
      await T.del('templates', id);
      S.tpls = S.tpls.filter(t => !same(t.id, id));
      render();
    },
    async applyTpl(k) {
      const t = S.tpls.find(x => same(x.id, $('#tplsel').value));
      if (!t) return;
      const have = new Set(its(k).map(i => i.name.toLowerCase()));
      const add = (t.items || []).filter(n => !have.has(n.toLowerCase()));
      for (const name of add) S.items.push(await T.ins('items', { kind: k, name, user_id: S.user.id }));
      render();
      msg(add.length ? add.length + ' item ditambahkan' : 'Semua item sudah ada');
    },
    async addVid() {
      const yid = ytId($('#vu').value.trim());
      if (!yid) return msg('Link YouTube tidak valid');
      if (allVids().some(v => v.id === yid)) return msg('Video sudah ada');
      let title = $('#vt').value.trim(), speaker = $('#vs').value.trim();
      if (!title) {
        try {
          const j = await (await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + yid))).json();
          title = j.title;
          speaker = speaker || j.author_name || '';
        } catch (e) {}
      }
      if (!title) return msg('Isi judul video');
      S.vids.push(await T.ins('kajian_videos', { yt_id: yid, title, speaker, cat: $('#vc').value.trim() || 'Lainnya' }));
      render();
      msg('Video ditambahkan');
    },
    async delVid(id) {
      await T.del('kajian_videos', id);
      S.vids = S.vids.filter(v => !same(v.id, id));
      render();
    },
    async togRemind() {
      if (remindOn()) {
        try { localStorage.setItem('rj_remind', '0'); } catch (e) {}
        scheduleReminders();
        render();
        return msg('Pengingat dimatikan');
      }
      if (!S.imsak) return msg('Pilih kota di Imsakiyyah dulu');
      if (!('Notification' in window)) return msg('Browser tidak mendukung notifikasi');
      if (await Notification.requestPermission() !== 'granted') return msg('Izin notifikasi ditolak');
      try { localStorage.setItem('rj_remind', '1'); } catch (e) {}
      scheduleReminders();
      render();
      msg('Pengingat aktif: imsak, berbuka, isya');
    },
    setGamePlayMode(m) {
      stopGameTimer();
      G.playMode = m;
      G.phase = 'idle';
      paintGame();
    },
    setGameTimeLimit(sec) {
      stopGameTimer();
      G.timeLimit = +sec || 0;
      G.phase = 'idle';
      paintGame();
    },
    setWordDecoy(v) {
      stopGameTimer();
      G.wordDecoy = v === '1';
      G.phase = 'idle';
      paintGame();
    },
    setMazeDecoy(v) {
      stopGameTimer();
      G.mazeDecoy = v === '1';
      G.phase = 'idle';
      paintGame();
    },
    openGame(k) {
      stopGameTimer();
      S.gameTab = k;
      G.phase = 'idle';
      G.fullscreen = true;
      const fs = $('#gm-fs');
      if (fs.requestFullscreen) fs.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      paintGame();
    },
    closeGame() {
      stopGameTimer();
      G.fullscreen = false;
      G.phase = 'idle';
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      paintGame();
    },
    gameBack() { G.phase = 'idle'; paintGame(); },
    setGameStart(v) { G.start = Math.max(1, +v || 1); },
    openMushaf,
    closeMushaf,
    mushafStep,
    mushafJump,
    gameSurah(v) {
      stopGameTimer();
      G.surah = +v;
      G.phase = 'idle';
      paintGame();
    },
    startGame,
    gamePick,
    gameNext,
    mazeNew() {
      if (G.playMode === 'versus') G.vsTurn = (G.vsTurn + 1) % 2;
      roundMaze();
    },
    mazeReset() {
      if (!G.mz) return;
      Object.assign(G.mz, { pts: [], drawing: false, state: 'idle' });
      mazeStatus();
      drawMaze();
    },
    dismissPwa() { S.pwa = null; render(); },
    async install() {
      if (S.pwa) {
        S.pwa.prompt();
        S.pwa = null;
        render();
      }
    }
  };

  async function soft(update) {
    const calc = document.querySelector('.main > .cal-card');
    document.querySelectorAll('.main > :not(.hd):not(.strip)' + (calc ? ':not(.cal-card), .main > .cal-card > *' : '')).forEach(e => e.classList.add('page-exit'));
    await new Promise(r => setTimeout(r, 120));
    update();
    render('soft');
  }

  for (const k in A) {
    window[k] = async (...a) => {
      try { return await A[k](...a); }
      catch (e) {
        const m = e && e.message ? e.message : String(e);
        msg(/permission denied/i.test(m) ? m + ' (jalankan SQL GRANT di Supabase)' : m);
      }
    };
  }

  async function fetchJ() {
    const c = S.prefs.city_id;
    if (!c) return;
    try {
      const set = new Set(days());
      let all = [];
      for (const m of [...new Set(days().map(d => d.slice(0, 7)))]) {
        const [y, mo] = m.split('-');
        const r = await (await fetch(`https://api.myquran.com/v2/sholat/jadwal/${c}/${y}/${mo}`)).json();
        all = all.concat((r.data && r.data.jadwal) || []);
      }
      const filtered = all.filter(r => set.has(r.date));
      if (filtered.length) {
        S.imsak = filtered;
        return;
      }
    } catch (e) {}

    if (IS_PREVIEW) {
      S.imsak = days().map(d => ({
        date: d,
        imsak: '04:30',
        subuh: '04:40',
        terbit: '05:55',
        dzuhur: '12:00',
        ashar: '15:15',
        maghrib: '18:05',
        isya: '19:15'
      }));
    } else {
      S.imsak = [];
      msg('Gagal memuat jadwal');
    }
  }

  const fsEl = document.createElement('div');
  fsEl.id = 'gm-fs';
  document.body.appendChild(fsEl);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && G.fullscreen && !document.fullscreenElement) A.closeGame();
  });

  window.addEventListener('resize', () => {
    if (S.page === 'game' && S.gameTab === 'maze' && G.phase === 'play') drawMaze();
  });

  // ===== PWA =====
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    S.pwa = e;
    render();
  });

  // ===== Inisialisasi =====
  (async () => {
    try {
      if (!IS_PREVIEW) {
        sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: {
            fetch: (u, o = {}) => {
              const h = new Headers(o.headers);
              if (TOKEN) h.set('x-client-info', 'supabase-js/2 rjtok=' + TOKEN);
              return fetch(u, { ...o, headers: h });
            }
          }
        });
        const { data } = await sb.auth.getSession();
        if (data.session) {
          S.admin = true;
          S.user = { username: data.session.user.email, full_name: 'Admin' };
        } else {
          try { TOKEN = localStorage.getItem('rj_t'); } catch (e) {}
          if (TOKEN) {
            const { data: u, error } = await sb.rpc('me');
            if (error || !u) {
              TOKEN = null;
              try { localStorage.removeItem('rj_t'); } catch (e) {}
            } else S.user = u;
          }
        }
        if (S.admin) S.page = 'admin';
      }
      await boot();
    } catch (e) {
      render();
      msg('Gagal terhubung: ' + (e.message || e));
    }
  })();
})();
</script>
