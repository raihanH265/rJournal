<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>rJournal - Ramadhan Jurnal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#4F3FC9">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quran-madina-html@2.2.2/dist/quran-madina-html.css" onerror="this.onerror=null;this.href='https://unpkg.com/quran-madina-html@2.2.2/dist/quran-madina-html.css'">
  <script>
    // Deteksi otomatis nama tag custom element yang didaftarkan oleh paket quran-madina-html
    window.__QMH_TAG__ = 'quran-madina';
    if (window.customElements && !window.__QMH_HOOKED__) {
      window.__QMH_HOOKED__ = true;
      const _origDef = customElements.define.bind(customElements);
      customElements.define = function (name, ctor, opts) {
        if (String(name).includes('quran')) window.__QMH_TAG__ = name;
        return _origDef(name, ctor, opts);
      };
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/quran-madina-html@2.2.2/dist/quran-madina-html.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/quran-madina-html@2.2.2/dist/quran-madina-html.js';document.head.appendChild(s)"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0}
    button,input,select,textarea{font-family:inherit}
    :root{
      --p:#4F3FC9;
      --pl:rgba(79,63,201,.12);
      --h:#17143A;
      --b:#4A4768;
      --m:#7D7A9A;
      --bd:rgba(255,255,255,.65);
      --bd-s:rgba(79,63,201,.14);
      --bg:#F4F2FA;
      --g:rgba(255,255,255,.58);
      --card-g:rgba(255,255,255,.68);
      --input-g:rgba(255,255,255,.78);
      --s:rgba(255,255,255,.45);
      --pink:#EC4899;
      --pink-l:rgba(236,72,153,.14);
      --gold:#E5A124;
      --ok:#1D9A64;
      --er:#E5484D;
      --sh:0 12px 36px rgba(42,32,115,.08),inset 0 1px 0 rgba(255,255,255,.8);
      --card-sh:0 6px 24px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85);
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme=light]){
        --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
        --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
        --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
        --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
        --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
      }
    }
    :root[data-theme=dark]{
      --bg:#0E0C1D;--g:rgba(26,23,50,.62);--card-g:rgba(32,28,62,.62);--input-g:rgba(22,19,44,.65);
      --h:#F3F1FF;--b:#B8B4D4;--m:#8581A6;--bd:rgba(255,255,255,.11);--bd-s:rgba(255,255,255,.08);
      --s:rgba(255,255,255,.06);--pl:rgba(123,108,246,.22);--p:#7B6CF6;--pink:#F472B6;--pink-l:rgba(244,114,182,.18);
      --sh:0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);
      --card-sh:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
    }
    html,body{height:100%;background:var(--bg)}
    #app{position:fixed;inset:0;z-index:999999;overflow:auto;background:var(--bg);color:var(--b);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
    .orb{position:fixed;border-radius:50%;filter:blur(85px);pointer-events:none;z-index:0}
    .o1{width:380px;height:380px;left:-110px;top:52%;background:linear-gradient(135deg,#F9A8D4,#EC4899);opacity:.48}
    .o2{width:420px;height:420px;right:-120px;top:4%;background:linear-gradient(135deg,#BFAFF8,#8E78F2);opacity:.58}
    .o3{width:280px;height:280px;left:38%;top:18%;background:#FBCFE8;opacity:.38}
    .shell{position:relative;z-index:1;display:flex;margin:26px auto;max-width:1240px;min-height:calc(100% - 52px);border-radius:32px;background:var(--g);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--bd);box-shadow:var(--sh)}
    .side{width:256px;flex:none;position:sticky;top:0;align-self:flex-start;padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bd-s);min-height:100%}
    .brand{display:flex;gap:12px;align-items:center;padding:0 8px 20px;color:var(--h);border-bottom:1px solid var(--bd-s);margin-bottom:8px}
    .brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
    .brand small{display:block;color:var(--m);font-size:12px}
    .lg{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,63,201,.3)}
    .nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--b);cursor:pointer;white-space:nowrap;transition:all .2s ease;border:1px solid transparent}
    .nv svg{width:19px;height:19px;stroke-width:2.1;flex:none}
    .nv.on{background:var(--pl);color:var(--p);border-color:rgba(79,63,201,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
    .nv:hover:not(.on){background:var(--s);color:var(--h)}
    .main{flex:1;min-width:0;padding:28px 34px 44px}
    .hd{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .hd h1{font-size:22px;color:var(--h);font-weight:800;letter-spacing:-.02em}
    .hd p{color:var(--m);font-size:13px;margin-top:2px}
    .hd .r{display:flex;gap:10px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card-g);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--h);box-shadow:var(--card-sh)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,var(--p),#6453E0);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 18px;font:600 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(79,63,201,.28);transition:all .2s ease}
    .btn:hover{transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(79,63,201,.36)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.45;pointer-events:none}
    .btn.s{background:var(--card-g);backdrop-filter:blur(12px);color:var(--p);border:1px solid var(--bd);box-shadow:var(--card-sh)}
    .btn.s:hover{background:var(--pl);border-color:rgba(79,63,201,.25)}
    .btn.w{width:100%;padding:14px;border-radius:16px;margin-top:16px;font-size:14.5px}
    .card{background:var(--card-g);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);border:1px solid var(--bd);border-radius:22px;padding:18px 20px;box-shadow:var(--card-sh);margin-bottom:16px}
    .card>b{color:var(--h);display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;font-weight:700;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .st small{color:var(--m);font-weight:500}
    .st b{font-size:32px;color:var(--p);font-weight:800;margin-top:4px}
    .ok{color:var(--ok)!important}
    .hero{text-align:center;padding:12px 0 8px}
    .orbh{width:116px;height:116px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(217,208,250,.85) 55%,rgba(145,126,242,.9));border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 40px rgba(79,63,201,.28),inset 0 -6px 16px rgba(79,63,201,.2);display:grid;place-items:center;color:var(--p)}
    .hero h2{font-size:36px;line-height:1.18;font-weight:800;color:var(--h);letter-spacing:-.025em}
    .hero h2 em{font-style:normal;color:var(--p)}
    .hero p{max-width:520px;margin:12px auto;color:var(--b);font-size:14.5px}
    .pill{max-width:680px;margin:20px auto 24px;background:var(--card-g);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:14px 16px 14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;color:var(--h);font-weight:500;transition:all .2s ease}
    .pill:hover{transform:translateY(-2px);border-color:rgba(79,63,201,.3)}
    .sendb{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),#7D6DF2);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(79,63,201,.3)}
    .fc{display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .2s ease;margin-bottom:0}
    .fc:hover{transform:translateY(-2px);background:var(--input-g);border-color:rgba(79,63,201,.25)}
    .fc .ico{width:46px;height:46px;flex:none;border-radius:16px;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.15);display:grid;place-items:center}
    .fc b{margin:0 0 2px;font-size:14.5px;display:block}
    .fc small{color:var(--b);font-size:12.5px;line-height:1.4;display:block}
    .fc>span{margin-left:auto;color:var(--m);display:grid;place-items:center}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
    .row>input,.row>select{flex:1;min-width:120px}
    input,select,textarea{font:inherit;color:var(--h);background:var(--input-g);backdrop-filter:blur(10px);border:1px solid var(--bd-s);border-radius:14px;padding:11px 14px;outline:0;width:100%;transition:all .2s}
    input:focus,textarea:focus,select:focus{border-color:var(--p);background:var(--bg);box-shadow:0 0 0 3px var(--pl)}
    textarea{min-height:84px;resize:vertical}
    input[type=checkbox],input[type=radio]{width:auto}

    /* Sembunyikan Scrollbar untuk tampilan bersih */
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none;width:0;height:0}
    .drag-scroll{cursor:grab;user-select:none}
    .drag-scroll.dragging{cursor:grabbing}

    /* Day Strip Pill-in-Groove */
    .strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px;background:var(--s);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:99px;margin-bottom:16px;box-shadow:inset 0 2px 7px rgba(42,32,115,.08),0 2px 10px rgba(42,32,115,.03)}
    .dc{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:99px;padding:8px 16px;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--b);cursor:pointer;transition:all .2s ease;white-space:nowrap}
    .dc small{display:inline;font:500 11px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--m);opacity:.85}
    .dc:hover:not(.on){color:var(--h);background:rgba(255,255,255,.35)}
    .dc.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 14px rgba(79,63,201,.34),inset 0 1px 0 rgba(255,255,255,.35)}
    .dc.on small{color:rgba(255,255,255,.88)}
    :root[data-theme=dark] .strip{box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06)}
    :root[data-theme=dark] .dc:hover:not(.on){background:rgba(255,255,255,.06)}

    .it{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--bd-s);cursor:pointer;color:var(--h);font-weight:500;transition:background .15s}
    .it:last-of-type{border-bottom:none}
    .it:hover{background:var(--s);border-radius:12px}
    .it input{accent-color:var(--p);width:19px;height:19px;cursor:pointer}
    .it span{flex:1;display:flex;align-items:center;gap:8px}
    .x{border:0;background:none;color:var(--m);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center;transition:.15s}
    .x:hover{color:var(--er);background:rgba(229,72,77,.1)}
    .bar{flex:1;min-width:80px;height:10px;border-radius:9px;background:var(--pl);overflow:hidden;border:1px solid var(--bd-s)}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:9px;transition:.4s ease}
    .ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--p) 0%,var(--pink) calc(var(--v)*1%),var(--pl) 0);display:grid;place-items:center;flex:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
    .ring b{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;margin:0;font-size:20px;color:var(--h)}
    .wl{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 1.6s forwards}
    @keyframes dr{to{stroke-dashoffset:0}}

    /* Kalender UI */
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .cal-pills{display:inline-flex;align-items:center;gap:4px;padding:5px;border-radius:99px;background:var(--s);border:1px solid var(--bd);box-shadow:inset 0 2px 6px rgba(42,32,115,.07),0 2px 8px rgba(42,32,115,.03);overflow-x:auto;max-width:100%}
    .cal-mp{border:0;background:transparent;color:var(--b);font:700 12.5px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .18s ease;white-space:nowrap}
    .cal-mp:hover:not(.on){color:var(--h);background:rgba(255,255,255,.38)}
    .cal-mp.on{background:linear-gradient(135deg,#7B6CF6,var(--p));color:#fff;box-shadow:0 4px 12px rgba(79,63,201,.32),inset 0 1px 0 rgba(255,255,255,.35)}
    .cal-ef{display:inline-flex;align-items:center;padding:6px 13px;border-radius:99px;background:var(--pink-l);color:var(--pink);font-size:11.5px;font-weight:700;border:1px solid rgba(236,72,153,.2);box-shadow:0 2px 8px rgba(236,72,153,.08)}
    .cal-title{font-size:19px;font-weight:800;color:var(--h);letter-spacing:-.02em;margin-bottom:12px}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:left}
    .cal>i{font-style:normal;font-weight:700;color:var(--m);font-size:12px;padding-bottom:4px;text-align:center}
    .cd{position:relative;border-radius:14px;padding:10px 10px 9px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--bd);background:var(--input-g);box-shadow:0 4px 12px rgba(42,32,115,.04),inset 0 1px 0 rgba(255,255,255,.9);transition:.18s}
    .cd.out{background:var(--s);box-shadow:inset 0 2px 6px rgba(42,32,115,.06),0 1px 0 rgba(255,255,255,.65);opacity:.82}
    .cd b{display:block;color:var(--h);font-size:14px;font-weight:800;line-height:1.1}
    .cd small{color:var(--m);font-size:10.5px;font-weight:500;display:block;line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cd .cdot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--p)}
    .cd.rm{background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(123,108,246,.12));border-color:rgba(123,108,246,.24);box-shadow:0 5px 14px rgba(79,63,201,.07),inset 0 1px 0 rgba(255,255,255,.95)}
    .cd.rm small{color:var(--p);font-weight:600}
    .cd.td{border:1.5px solid var(--p);box-shadow:0 4px 14px rgba(79,63,201,.16),inset 0 0 0 1px rgba(123,108,246,.2)}
    .cd.eid{background:linear-gradient(135deg,#F9C862,#E5A124);border-color:rgba(255,255,255,.5);box-shadow:0 6px 16px rgba(229,161,36,.28),inset 0 1px 0 rgba(255,255,255,.6)}
    .cd.eid *{color:#332200!important}
    :root[data-theme=dark] .cd{box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.07)}
    :root[data-theme=dark] .cd.out{box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
    :root[data-theme=dark] .cd.rm{background:linear-gradient(145deg,rgba(45,40,86,.75),rgba(123,108,246,.22))}
    .cal-leg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--b);font-weight:500}
    .cal-leg span{display:inline-flex;align-items:center;gap:6px}
    .cal-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .cal-info-card{padding:14px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(42,32,115,.05),inset 0 1px 0 rgba(255,255,255,.85)}
    .cal-info-card>b{font-size:13px!important;margin-bottom:8px!important}
    .cal-info-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--h);flex-wrap:wrap}
    .cal-tag{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;background:var(--pl);color:var(--p);border:1px solid rgba(79,63,201,.18)}
    .cal-tag.syw{background:rgba(229,161,36,.16);color:#B47808;border-color:rgba(229,161,36,.3)}
    :root[data-theme=dark] .cal-tag.syw{color:#F6C358}
    .cal-info-date{color:var(--m);font-size:11.5px;min-width:155px}
    .cal-info-note{color:var(--m);font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd-s)}

    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:separate;border-spacing:0;text-align:center;white-space:nowrap}
    th,td{padding:10px 8px;border-bottom:1px solid var(--bd-s)}
    th{color:var(--m);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
    td.hl-accent{color:var(--p);font-weight:700}
    tr.hl td,.kt-table tr.active-target td{background:linear-gradient(135deg,var(--input-g),var(--pl));color:var(--p);font-weight:700;border-top:1.5px solid var(--p);border-bottom:1.5px solid var(--p);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
    tr.hl td:first-child,.kt-table tr.active-target td:first-child{border-left:1.5px solid var(--p);border-radius:14px 0 0 14px}
    tr.hl td:last-child,.kt-table tr.active-target td:last-child{border-right:1.5px solid var(--p);border-radius:0 14px 14px 0}

    /* Wave Graphic Glassmorphism */
    .wave-glass{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 12px;background:linear-gradient(145deg,var(--input-g),var(--pl));border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px rgba(42,32,115,.08);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
    .wave-glass::before,.wave-glass::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(52px);opacity:.42;pointer-events:none}
    .wave-glass::before{background:var(--p);left:-40px;bottom:-55px}
    .wave-glass::after{background:var(--pink);right:-35px;top:-45px}
    .wave-glass-hd{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--h);opacity:.85}
    .wave-glass svg{position:relative;z-index:1;display:block}

    .moods{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}

  // Lapisan akses data (Preview Memory vs Supabase)
  const T = {
    async sel(tbl, filter = {}, cols = '*') {
      if (IS_PREVIEW) {
        const rows = mem[tbl] || [];
        return rows.filter(r => Object.entries(filter).every(([k, v]) => same(r[k], v))).map(r => ({ ...r }));
      }
      let q = sb.from(tbl).select(cols);
      Object.entries(filter).forEach(([k, v]) => { q = q.eq(k, v); });
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    },
    async ins(tbl, row) {
      if (IS_PREVIEW) {
        const rec = { id: nid(), ...row };
        if (!mem[tbl]) mem[tbl] = [];
        mem[tbl].push(rec);
        return { ...rec };
      }
      const { data, error } = await sb.from(tbl).insert(row).select().single();
      if (error) throw error;
      return data;
    },
    async upd(tbl, id, patch) {
      if (IS_PREVIEW) {
        const rows = mem[tbl] || [];
        const idx = rows.findIndex(r => same(r.id, id));
        if (idx >= 0) rows[idx] = { ...rows[idx], ...patch };
        return;
      }
      const { error } = await sb.from(tbl).update(patch).eq('id', id);
      if (error) throw error;
    },
    async up(tbl, row, conflict = 'id') {
      if (IS_PREVIEW) {
        if (!mem[tbl]) mem[tbl] = [];
        const keys = conflict.split(',').map(s => s.trim());
        const idx = mem[tbl].findIndex(r => keys.every(k => same(r[k], row[k])));
        if (idx >= 0) mem[tbl][idx] = { ...mem[tbl][idx], ...row };
        else mem[tbl].push({ id: row.id || nid(), ...row });
        return;
      }
      const { error } = await sb.from(tbl).upsert(row, { onConflict: conflict });
      if (error) throw error;
    },
    async del(tbl, id) {
      if (IS_PREVIEW) {
        mem[tbl] = (mem[tbl] || []).filter(r => !same(r.id, id));
        return;
      }
      const { error } = await sb.from(tbl).delete().eq('id', id);
      if (error) throw error;
    }
  };

  // Helper tanggal & progres ibadah
  const days = () => {
    const s = S.set.ramadan_start || DEF.ramadan_start;
    const e = S.set.ramadan_end || DEF.ramadan_end;
    const n = Math.min(35, Math.max(1, diff(s, e) + 1));
    return Array.from({ length: n }, (_, i) => addD(s, i));
  };

  const curDay = () => {
    const D = days();
    if (S.day && D.includes(S.day)) return S.day;
    const t = today();
    S.day = D.includes(t) ? t : D[0];
    return S.day;
  };

  const its = k => S.items.filter(i => i.kind === k && (!i.user_id || (S.user && same(i.user_id, S.user.id))));
  const isDone = (itemId, d) => S.checks.find(c => same(c.item_id, itemId) && c.day === d);
  const getUzurDays = () => Array.isArray(S.prefs.uzur_days) ? S.prefs.uzur_days : [];
  const isUzur = d => getUzurDays().includes(d);

  const pct = (k, d) => {
    if (k === 'ibadah' && isUzur(d)) return 100;
    const a = its(k);
    if (!a.length) return 0;
    const doneCount = a.filter(i => isDone(i.id, d)).length;
    return Math.round((doneCount / a.length) * 100);
  };

  const hdInfo = d => {
    const s = S.set;
    const df = diff(s.ramadan_start, d);
    if (df >= 0 && d <= s.ramadan_end) {
      return { day: df + 1, month: 'Ramadhan' };
    }
    if (df < 0 && df >= -29) {
      return { day: 30 + df, month: 'Sya\'ban' };
    }
    const dfEid = diff(s.eid_date, d);
    if (dfEid >= 0 && dfEid < 29) {
      return { day: dfEid + 1, month: 'Syawal' };
    }
    return { day: '', month: '' };
  };

  const pickYear = years => {
    if (!years || !years.length) return null;
    const sorted = [...years].sort((a, b) => a.ramadan_start.localeCompare(b.ramadan_start));
    const t = today();
    return sorted.find(y => t >= y.ramadan_start && t <= y.eid_date)
      || sorted.find(y => y.ramadan_start >= t)
      || sorted[sorted.length - 1];
  };

  const annSort = a => [...(a || [])].sort((x, y) => String(y.created_at || y.id).localeCompare(String(x.created_at || x.id)));

  // Daftar 114 Surah Al-Qur'an: [nomor, nama, jumlah_ayat]
  const SURAH_LIST = [
    [1,'Al-Fatihah',7],[2,'Al-Baqarah',286],[3,'Ali \'Imran',200],[4,'An-Nisa\'',176],[5,'Al-Ma\'idah',120],[6,'Al-An\'am',165],[7,'Al-A\'raf',206],[8,'Al-Anfal',75],
    [9,'At-Taubah',129],[10,'Yunus',109],[11,'Hud',123],[12,'Yusuf',111],[13,'Ar-Ra\'d',43],[14,'Ibrahim',52],[15,'Al-Hijr',99],[16,'An-Nahl',128],

    [49,'Al-Hujurat',18],[50,'Qaf',45],[51,'Az-Zariyat',60],[52,'At-Tur',49],[53,'An-Najm',62],[54,'Al-Qamar',55],[55,'Ar-Rahman',78],[56,'Al-Waqi\'ah',96],
    [57,'Al-Hadid',29],[58,'Al-Mujadalah',22],[59,'Al-Hasyr',24],[60,'Al-Mumtahanah',13],[61,'As-Saff',14],[62,'Al-Jumu\'ah',11],[63,'Al-Munafiqun',11],[64,'At-Tagabun',18],

    [81,'At-Takwir',29],[82,'Al-Infitar',19],[83,'Al-Mutaffifin',36],[84,'Al-Insyiqaq',25],[85,'Al-Buruj',22],[86,'At-Tariq',17],[87,'Al-A\'la',19],[88,'Al-Ghasyiyah',26],
    [89,'Al-Fajr',30],[90,'Al-Balad',20],[91,'Asy-Syams',15],[92,'Al-Lail',21],[93,'Ad-Duha',11],[94,'Asy-Syarh',8],[95,'At-Tin',8],[96,'Al-\'Alaq',19],
    [97,'Al-Qadr',5],[98,'Al-Bayyinah',8],[99,'Az-Zalzalah',8],[100,'Al-\'Adiyat',11],[101,'Al-Qari\'ah',11],[102,'At-Takasur',8],[103,'Al-\'Asr',3],[104,'Al-Humazah',9],
    [105,'Al-Fil',5],[106,'Quraisy',4],[107,'Al-Ma\'un',7],[108,'Al-Kausar',3],[109,'Al-Kafirun',6],[110,'An-Nasr',3],[111,'Al-Lahab',5],[112,'Al-Ikhlas',4],
    [113,'Al-Falaq',5],[114,'An-Nas',6]
  ];

  // Halaman awal setiap Surah (1–114) pada Mushaf Madinah cetakan 1441 H (604 halaman)
  const SURAH_START_PAGES = [
    1,2,50,77,106,128,151,177,187,208,
    221,235,249,255,262,267,282,293,305,312,
    322,332,342,350,359,367,377,385,396,404,
    411,415,418,428,434,440,446,453,458,467,
    477,483,489,496,499,502,507,511,515,518,
    520,523,526,528,531,534,537,542,545,549,
    551,553,554,556,558,560,562,564,566,568,
    570,572,574,575,577,578,580,582,583,585,

  ];

  // Halaman awal Juz 1–30 pada Mushaf Madinah 1441 H
  const JUZ_START_PAGES = [
    1,22,42,62,82,102,121,142,162,182,
    201,222,242,262,282,302,322,342,362,382,
    402,422,442,462,482,502,522,542,562,582
  ];

  function streakInfo() {
    const D = days();
    let cur = 0, best = 0, run = 0;
    D.forEach(d => {
      if (pct('ibadah', d) >= 70) {
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    });
    const idx = Math.max(0, D.indexOf(curDay()));
    for (let i = idx; i >= 0; i--) {
      if (pct('ibadah', D[i]) >= 70) cur++;
      else break;
    }
    const wStart = Math.max(0, idx - 6);
    const wSlice = D.slice(wStart, idx + 1);
    const week = wSlice.length ? Math.round(wSlice.reduce((s, d) => s + pct('ibadah', d), 0) / wSlice.length) : null;
    const pSlice = wStart > 0 ? D.slice(Math.max(0, wStart - 7), wStart) : [];
    const prev = pSlice.length ? Math.round(pSlice.reduce((s, d) => s + pct('ibadah', d), 0) / pSlice.length) : null;
    return { cur, best, week, prev };
  }

  function insightCard() {
    const { cur, best, week, prev } = streakInfo();
    const B = [
      ['flame', 'Istiqamah 3 Hari', best >= 3],
      ['award', 'Sepekan Penuh (7 Hari)', best >= 7],
      ['crown', 'Pejuang 20 Hari', best >= 20],
      ['sparkles', 'Khatam Ramadhan', best >= days().length]
    ];
    const delta = week != null && prev != null ? ` (${week - prev >= 0 ? '+' : ''}${week - prev}% dari minggu lalu)` : '';
    return `
      <div class="card">
        <b>${ic('flame', 17)} Streak & Lencana</b>
        <p style="margin-bottom:10px"><b style="color:var(--p);font-size:20px">${cur}</b> hari beruntun (ibadah ≥70%) · terbaik ${best} hari${week != null ? `<br>Minggu ini rata-rata <b>${week}%</b>${delta}` : ''}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${B.map(([i, n, ok]) => `<span class="chip" style="font-size:12px;${ok ? '' : 'opacity:.4'}">${ic(i, 14)} ${n}</span>`).join('')}
        </div>
      </div>`;
  }

  // ===== Pengingat imsak / berbuka / isya =====
  let remindT = [], remindDay = null;
  const remindOn = () => { try { return localStorage.getItem('rj_remind') === '1' && 'Notification' in window && Notification.permission === 'granted'; } catch (e) { return false; } };
  function notify(title, body) {
    const opt = { body, icon: 'icon-192.png', tag: title };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt));

    } catch (e) {}

  function scheduleReminders() {
    remindT.forEach(clearTimeout);
    remindT = [];
    remindDay = today();
    if (!remindOn() || !S.imsak) return;
    const now = Date.now();
    const at = (date, hm) => { const [h, m] = (hm || '').split(':').map(Number); return new Date(date + 'T00:00:00').setHours(h, m, 0, 0); };
    [remindDay, addD(remindDay, 1)].forEach(date => {
      const r = S.imsak.find(x => x.date === date);
      if (!r) return;
      [[at(date, r.imsak) - 10 * 6e4, 'Sebentar lagi imsak', `Imsak pukul ${r.imsak}. Segera akhiri sahur.`],
       [at(date, r.maghrib), 'Waktunya berbuka', `Adzan Maghrib ${r.maghrib}. Selamat berbuka puasa.`],
       [at(date, r.isya), 'Waktu Isya', 'Siap tarawih? Jangan lupa ceklis ibadah hari ini.']
      ].forEach(([t, ti, b]) => { if (t > now) remindT.push(setTimeout(() => notify(ti, b), t - now)); });
    });
  }

  const overall = k => {
    const D = days();
    return Math.round(D.reduce((s, d) => s + pct(k, d), 0) / D.length);
  };
  const strip = () => `<div class="strip drag-scroll" data-lenis-prevent>${days().map((d, i) => `<button class="dc ${d === S.day ? 'on' : ''}" onclick="setDay('${d}')">Hari ${i + 1} <small>${d.slice(8)}/${d.slice(5, 7)}</small></button>`).join('')}</div>`;
  const msg = t => {
    const e = $('#toast');
    if (!e) return;
    e.textContent = t;
    e.style.display = 'block';
    clearTimeout(msg.t);
    msg.t = setTimeout(() => { e.style.display = 'none'; }, 2800);
  };

  const cityLink = c => `<a class="lk blk" data-id="${esc(c.id)}" data-name="${esc(c.lokasi)}" onclick="pickCity(this.dataset.id,this.dataset.name)">${ic('navigation', 14)} ${esc(c.lokasi)}</a>`;

  function wave(k) {
    const D = days(), W = 600, H = 132, P = D.map((d, i) => [i * W / Math.max(D.length - 1, 1), H - pct(k, d) * (H - 16) / 100 + 10]);
    let p = 'M' + P[0];
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], b = P[i], mx = (a[0] + b[0]) / 2;
      p += `C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`;
    }
    const baseY = H + 12;
    const grid = [25, 50, 75, 100].map(v => {
      const y = H - v * (H - 16) / 100 + 10;
      return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd-s)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;

    return `
      <div class="wave-glass">

          <span style="color:var(--p)">${overall(k)}%</span>

              <stop offset="0%" stop-color="#7B6CF6" stop-opacity=".32"/>
              <stop offset="65%" stop-color="#EC4899" stop-opacity=".10"/>
              <stop offset="100%" stop-color="#4F3FC9" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4F3FC9"/>
              <stop offset="55%" stop-color="#7B6CF6"/>
              <stop offset="100%" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
          ${grid}
          <line x1="0" x2="${W}" y1="${baseY}" y2="${baseY}" stroke="var(--bd-s)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
          <path d="${p}L${W},${baseY}L0,${baseY}Z" fill="url(#wg)"/>
          <path d="${p}" fill="none" stroke="url(#ws)" stroke-width="9" stroke-linecap="round" opacity=".32" style="filter:blur(6px)"/>
          <path class="wl" d="${p}" fill="none" stroke="url(#ws)" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </div>`;
  }

  function CL(k) {
    const d = curDay(), a = its(k), p = pct(k, d), uz = k === 'ibadah' && isUzur(d), tl = S.tpls.filter(t => t.kind === k);
    return `
      ${strip()}
      ${k === 'ibadah' ? `
        <div class="uzur-bar">
          <div style="display:flex;align-items:center;gap:9px">
            ${ic('heart-handshake', 18)}
            <div>
              <b style="font-size:13.5px;display:block">Mode Uzur Syar'i (Haid / Nifas)</b>
              <small style="color:var(--b)">${uz ? 'Hari ini ditandai uzur & otomatis tercatat di daftar Qadha puasa.' : 'Aktifkan jika sedang berhalangan agar grafik ibadah tetap terjaga.'}</small>

  V.tilawah = () => {

    const WAKTU = ['Shubuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'];
    const slotLogs = S.til.filter(r => r.mode && r.mode.startsWith('slot_'));
    const totalTargetPagesRead = slotLogs.reduce((sum, r) => sum + (+r.pages || 0), 0);
    const totalGoalPages = 604 * t;
    const kp = Math.min(100, Math.round(totalTargetPagesRead / totalGoalPages * 100));
    const man = S.til.filter(r => r.mode === 'manual').sort((a, b) => b.day.localeCompare(a.day));

      }
      let curJuzIdx = 0;
      for (let j = 0; j < JUZ_START_PAGES.length; j++) {

                ${SURAH_LIST.map(([no, nm, ay], idx) => `<option value="${no}" ${idx === curSurahIdx ? 'selected' : ''}>${no}. ${esc(nm)} (${ay} ayat)</option>`).join('')}
              </select>
              <select style="max-width:118px" onchange="setMushafPage(+this.value)" title="Pilih Juz (1–30)">
                ${JUZ_START_PAGES.map((jp, idx) => `<option value="${jp}" ${idx === curJuzIdx ? 'selected' : ''}>Juz ${idx + 1}</option>`).join('')}

            </div>
            <div class="mushaf-nav-group">
              <button class="btn s" style="padding:8px 11px" ${pg >= 604 ? 'disabled' : ''} onclick="setMushafPage(${pg + 1})" title="Halaman berikutnya (arah baca Mushaf)">${ic('chevron-left', 16)} Hal ${Math.min(604, pg + 1)}</button>

                <span style="font-size:12px;color:var(--m);font-weight:600">/ 604</span>
              </div>
              <button class="btn s" style="padding:8px 11px" ${pg <= 1 ? 'disabled' : ''} onclick="setMushafPage(${pg - 1})" title="Halaman sebelumnya">Hal ${Math.max(1, pg - 1)} ${ic('chevron-right', 16)}</button>
            </div>
          </div>

          <div class="mushaf-stage">
            <div id="mushaf-mount" class="mushaf-frame"></div>
          </div>

          <div class="mushaf-footer-nav">
            <button class="btn s" ${pg >= 604 ? 'disabled' : ''} onclick="setMushafPage(${pg + 1})">${ic('arrow-left', 16)} Halaman Berikutnya (${Math.min(604, pg + 1)})</button>

            • <b>Tata letak:</b> Batas baris Mushaf Madinah cetakan 1441 H (King Fahd Complex), melalui paket <code>quran-madina-html</code> (Waqf GPL).<br>

    return `
      ${strip()}

  V.hafalan = () => {

    const zp = Math.min(100, Math.round(zi / zt * 100));
    const murojaahTargetHal = hj ? Math.ceil(hj * 20 / D.length) : 0;
    const selSurahObj = SURAH_LIST.find(([no, nm]) => `${no}. ${nm}` === S.hafSurah);

    return `

  const wordsOf = t => t.split(/\s+/).filter(Boolean);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Susun pasangan soal berbobot sama (jumlah kata setara) untuk Pemain 1 dan Pemain 2 di mode Versus
  function buildVersusWordPairs(ayList, startOneBased, maxRounds) {
    const total = ayList.length - 1;
    if (total <= 0) return [];
    const start0 = Math.min(Math.max(0, startOneBased - 1), total - 1);
    const ordered = [];
    for (let i = start0; i < total; i++) ordered.push(i);
    for (let i = 0; i < start0; i++) ordered.push(i);

    const byLen = new Map();
    ordered.forEach(idx => {
      const len = wordsOf(ayList[idx + 1]).length;
      if (!byLen.has(len)) byLen.set(len, []);
      byLen.get(len).push(idx);
    });

    const exactPairs = [];
    const leftovers = [];
    byLen.forEach(list => {
      for (let i = 0; i + 1 < list.length; i += 2) {
        exactPairs.push([list[i], list[i + 1]]);
      }
      if (list.length % 2 === 1) leftovers.push(list[list.length - 1]);
    });

    leftovers.sort((a, b) => wordsOf(ayList[a + 1]).length - wordsOf(ayList[b + 1]).length);
    const nearPairs = [];
    for (let i = 0; i + 1 < leftovers.length; i += 2) {
      nearPairs.push(nearPairs.length % 2 === 0 ? [leftovers[i], leftovers[i + 1]] : [leftovers[i + 1], leftovers[i]]);
    }

    const allPairs = [...exactPairs, ...nearPairs];
    if (!allPairs.length) return [[0, 0]];
    const result = [];
    for (let r = 0; r < maxRounds; r++) {
      result.push(allPairs[r % allPairs.length]);
    }
    return result;
  }

  function buildVersusMazePairs(pool, maxRounds) {
    if (!pool.length) return [];
    const byLen = new Map();
    shuffle([...pool]).forEach(words => {
      const len = words.length;
      if (!byLen.has(len)) byLen.set(len, []);
      byLen.get(len).push(words);
    });

    const exactPairs = [];
    const leftovers = [];
    byLen.forEach(list => {
      for (let i = 0; i + 1 < list.length; i += 2) {
        exactPairs.push([list[i], list[i + 1]]);
      }
      if (list.length % 2 === 1) leftovers.push(list[list.length - 1]);
    });

    leftovers.sort((a, b) => a.length - b.length);
    const nearPairs = [];
    for (let i = 0; i + 1 < leftovers.length; i += 2) {
      nearPairs.push(nearPairs.length % 2 === 0 ? [leftovers[i], leftovers[i + 1]] : [leftovers[i + 1], leftovers[i]]);
    }

    const allPairs = shuffle([...exactPairs, ...nearPairs]);
    if (!allPairs.length) return [[pool[0], pool[0]]];
    const result = [];
    for (let r = 0; r < maxRounds; r++) {
      result.push(allPairs[r % allPairs.length]);
    }
    return result;
  }

  function isVersusMatchComplete() {
    return G.playMode === 'versus' && G.vsRounds[0] >= G.maxRounds && G.vsRounds[1] >= G.maxRounds;
  }

  function finishVersusMatch() {
    stopGameTimer();
    G.phase = 'idle';
    const vs = gVsScores();
    const w = vs[0] === vs[1]
      ? 'Hasil Seri!'
      : (vs[0] > vs[1] ? 'Pemain 1 Menang!' : 'Pemain 2 Menang!');
    msg(`Pertandingan ${G.maxRounds} Ronde selesai! ${w} (P1: ${vs[0]} poin · P2: ${vs[1]} poin)`);
    paintGame();
  }

  function stopGameTimer() {
    if (G.timerId) {
      clearInterval(G.timerId);
      G.timerId = null;
    }
  }

  function startRoundTimer() {
    stopGameTimer();
    if (!G.timeLimit || G.timeLimit <= 0) {
      G.timeLeft = 0;
      return;
    }
    G.timeLeft = G.timeLimit;
    G.timerId = setInterval(() => {
      if (S.page !== 'game' || G.phase !== 'play') {
        stopGameTimer();
        return;
      }
      if ((S.gameTab === 'words' && G.done) || (S.gameTab === 'maze' && G.mz && (G.mz.state === 'win' || G.mz.turnLost))) {
        stopGameTimer();
        return;
      }
      G.timeLeft--;
      const el = $('#gm-timer-val');
      const pill = $('#gm-timer-pill');
      if (el) el.textContent = formatGameTime(G.timeLeft);
      if (pill && G.timeLeft <= 10) pill.classList.add('low');
      if (G.timeLeft <= 0) {
        stopGameTimer();
        handleRoundTimeout();
      }
    }, 1000);
  }

  function formatGameTime(sec) {
    if (!G.timeLimit || G.timeLimit <= 0) return '∞';
    const m = Math.floor(Math.max(0, sec) / 60);
    const s = Math.max(0, sec) % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function handleRoundTimeout() {
    if (S.gameTab === 'words') {
      if (G.playMode === 'versus') {
        const failedPlayer = G.vsTurn + 1;
        G.vsRounds[G.vsTurn]++;
        const nextTurn = (G.vsTurn + 1) % 2;
        if (!G.vsPassed && G.vsRounds[nextTurn] < G.maxRounds) {
          G.vsPassed = true;
          G.vsTurn = nextTurn;
          G.got = [];
          G.miss = 0;
          G.shake = -1;
          G.tiles.forEach(t => { t.used = false; });
          shuffle(G.tiles);
          G.vsNotice = `Waktu Pemain ${failedPlayer} habis! Kesempatan hangus, ayat yang sama dilempar ke Pemain ${nextTurn + 1}.`;
          startRoundTimer();
          return paintGame();
        }
        G.done = true;
        G.vsBothFailed = true;
        G.vsNotice = `Waktu habis! Ronde selesai tanpa poin (0 poin).`;
        return paintGame();
      }
      G.done = true;
      setGStreak(0);
      G.lastGainText = '+0 poin (waktu habis)';
      msg('Waktu habis!');
      paintGame();
    } else if (S.gameTab === 'maze' && G.mz) {
      G.mz.drawing = false;
      G.mz.state = 'timeout';
      if (G.playMode === 'versus') {
        const failedPlayer = G.vsTurn + 1;
        G.vsRounds[G.vsTurn]++;
        G.mz.turnLost = true;
        G.vsNotice = `Waktu Pemain ${failedPlayer} habis (0 poin)! Giliran dilanjut ke Pemain ${((G.vsTurn + 1) % 2) + 1}.`;
      } else {
        msg('Waktu habis untuk ronde labirin ini!');
      }
      paintGame();
    }
  }

  async function surahText(n) {
    if (G.cache[n]) return G.cache[n];
    const j = await (await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`)).json();
    const ay = j.data.ayahs.map(a => a.text.trim());
    if (n !== 1 && plain(ay[0]).startsWith('بسم الله الرحمن الرحيم')) ay[0] = wordsOf(ay[0]).slice(4).join(' ');
    return (G.cache[n] = ay);
  }

              <small style="color:var(--m)">Poin: <b style="color:var(--p)">${vs[0]}</b> · Ronde ${Math.min(G.maxRounds, G.vsRounds[0] + (G.vsTurn === 0 && !G.done && !(G.mz && (G.mz.state === 'win' || G.mz.turnLost)) ? 1 : 0))}/${G.maxRounds}</small>
            </div>
            ${G.vsTurn === 0 ? '<span class="vs-tag">Giliran</span>' : ''}
          </div>
          <div class="vs-card p2 ${G.vsTurn === 1 ? 'turn' : ''}">
            <div>
              <b style="color:var(--h);font-size:13.5px;display:block">Pemain 2</b>
              <small style="color:var(--m)">Poin: <b style="color:var(--pink)">${vs[1]}</b> · Ronde ${Math.min(G.maxRounds, G.vsRounds[1] + (G.vsTurn === 1 && !G.done && !(G.mz && (G.mz.state === 'win' || G.mz.turnLost)) ? 1 : 0))}/${G.maxRounds}</small>
            </div>
            ${G.vsTurn === 1 ? '<span class="vs-tag">Giliran</span>' : ''}
          </div>
        </div>` : ''}`;
  }

  function gameHTML() {
    if (G.phase === 'loading') return '<p class="em">Memuat teks ayat…</p>';
    if (G.phase === 'error') {
      return `
        <div class="gm-arena-inner">
          <p class="em">${esc(G.err)}</p>
          <div class="row" style="justify-content:center">
            <button class="btn" onclick="startGame()">${ic('rotate-ccw', 15)} Coba Lagi</button>
            ${G.fullscreen ? `<button class="btn s" onclick="toggleGameFullscreen()">${ic('minimize-2', 15)} Keluar Fullscreen</button>` : ''}
          </div>
        </div>`;
    }
    if (G.phase !== 'play') {
      const vs = gVsScores();
      const vsSummary = (G.playMode === 'versus' && (G.vsRounds[0] > 0 || G.vsRounds[1] > 0))
        ? `<div class="gm-notice info" style="margin-bottom:10px">${ic('trophy', 17)} Skor Akhir Versus (${S.gameTab === 'words' ? 'Susun Kata' : 'Labirin Ayat'}): <b>Pemain 1 (${vs[0]} poin)</b> vs <b>Pemain 2 (${vs[1]} poin)</b></div>`
        : '';
      return `
        <div class="gm-arena-inner">
          ${vsSummary}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <p class="em" style="text-align:left;padding:6px 0;flex:1">${S.gameTab === 'words'
              ? 'Pilih surat dan pengaturan di atas lalu tekan <b>Mulai</b>. Susun kata-kata ayat berikutnya sesuai urutan.'
              : 'Pilih surat dan pengaturan di atas lalu tekan <b>Mulai</b>. Tarik garis dari awal (▶) ke akhir ayat (★) melewati kata ayat secara berurutan.'}</p>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              ${G.fullscreen ? `<button class="btn" onclick="startGame()">${ic('play', 15)} Mulai</button>` : ''}
              <button class="btn s" style="padding:7px 12px;font-size:12px" onclick="toggleGameFullscreen()">
                ${ic(G.fullscreen ? 'minimize-2' : 'maximize-2', 14)} ${G.fullscreen ? 'Keluar Fullscreen' : 'Fullscreen'}
              </button>
            </div>
          </div>
        </div>`;
    }
    return `
      <div class="gm-arena-inner">
        ${gameTopBarHTML()}
        ${S.gameTab === 'words' ? wordsHTML() : mazeHTML()}
      </div>`;
  }

  function paintGame() {
    syncFullscreenBodyClass();
    const arena = $('#game-area');
    if (!arena) return;
    arena.className = `gm-arena ${G.fullscreen ? 'fs' : ''}`;
    arena.innerHTML = gameHTML();
    if (window.lucide) lucide.createIcons();
    mountGame();
  }
  function mountGame() { if (S.gameTab === 'maze' && G.phase === 'play') drawMaze(); }

  async function startGame() {
    const st = $('#gst');
    G.start = Math.max(1, st ? +st.value || 1 : 1);
    G.phase = 'loading';
    stopGameTimer();
    paintGame();
    try {
      G.ay = await surahText(G.surah);
    } catch (e) {
      G.phase = 'error';
      G.err = 'Gagal memuat teks ayat. Periksa koneksi internet lalu coba lagi.';
      return paintGame();
    }
    setGScore(0);
    setGStreak(0);
    G.vsScoresByGame[S.gameTab] = [0, 0];
    G.vsTurn = 0;
    G.vsRounds = [0, 0];
    G.vsPassed = false;
    G.vsBothFailed = false;
    G.vsNotice = '';
    G.lastGainText = '';
    if (S.gameTab === 'words') {
      if (G.ay.length < 2) {
        G.phase = 'error';
        G.err = 'Surat ini hanya memiliki 1 ayat. Pilih surat lain.';
        return paintGame();
      }
      if (G.playMode === 'versus') {
        G.vsPairs = buildVersusWordPairs(G.ay, G.start, G.maxRounds);
        G.idx = G.vsPairs[0][0];
      } else {
        G.idx = Math.min(G.start, G.ay.length - 1) - 1;
      }
      roundWords();
    } else {
      if (G.playMode === 'versus') {
        const pool = G.ay.map(wordsOf).filter(w => w.length >= 3 && w.length <= 9);
        if (!pool.length) {
          G.phase = 'error';
          G.err = 'Surat ini tidak punya ayat pendek (3–9 kata). Pilih surat lain.';
          return paintGame();
        }
        G.vsMazePairs = buildVersusMazePairs(pool, G.maxRounds);
      }
      roundMaze();
    }
  }

  // --- Susun Kata ---
  function roundWords() {
    G.target = wordsOf(G.ay[G.idx + 1]);
    G.got = [];
    G.miss = 0;
    G.done = false;
    G.shake = -1;
    G.vsPassed = false;
    G.vsBothFailed = false;
    G.vsNotice = '';
    G.lastGainText = '';

    const baseTiles = G.target.map(w => ({ w, used: false }));
    if (G.wordDecoy) {
      const targetSet = new Set(G.target);
      const otherWords = shuffle(
        G.ay.filter((_, ai) => ai !== G.idx + 1)
          .flatMap(wordsOf)
          .filter(w => !targetSet.has(w))
      );
      const extraCount = Math.min(otherWords.length, Math.max(2, Math.min(4, Math.ceil(G.target.length * 0.4))));
      for (let k = 0; k < extraCount; k++) {
        baseTiles.push({ w: otherWords[k], used: false });
      }
    }

    G.tiles = shuffle(baseTiles);
    G.phase = 'play';
    startRoundTimer();
    paintGame();
  }
  function wordsHTML() {
    const lastAyah = G.playMode === 'solo' && (G.idx + 2 >= G.ay.length);
    const matchEnd = isVersusMatchComplete();
    const timedOut = G.timeLimit > 0 && G.timeLeft <= 0 && G.got.length < G.target.length;
    const nextPlayerNum = ((G.vsTurn + 1) % 2) + 1;
    const vs = gVsScores('words');
    return `
      ${G.vsNotice ? `<div class="gm-notice ${G.vsPassed && !G.done ? 'info' : ''}">${ic(G.vsPassed && !G.done ? 'repeat' : 'alert-circle', 17)} <span>${esc(G.vsNotice)}</span></div>` : ''}
      <div class="gm-prev">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <small>Ayat ${G.idx + 1}${G.vsPassed ? ` · <b>Ayat Lemparan (Kesempatan Pemain ${G.vsTurn + 1})</b>` : ''}</small>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="chip" style="font-size:11px;padding:3px 9px;color:${G.wordDecoy ? 'var(--pink)' : 'var(--p)'}">${ic('sparkles', 12)} Mode ${G.wordDecoy ? 'Normal' : 'Mudah'}</span>
            <span class="chip" style="font-size:11px;padding:3px 9px;color:var(--p)">${ic('layers', 12)} ${G.target.length} Kata</span>
          </div>
        </div>
        <div class="gm-ar">${esc(G.ay[G.idx])}</div>
      </div>
      <small>Sambungkan ayat ${G.idx + 2}: tekan kata sesuai urutan</small>
      <div class="gm-slots">${G.got.length ? G.got.map(w => `<span class="gm-w ok">${esc(w)}</span>`).join('') : '<span class="note">…</span>'}</div>
      ${G.done ? `
        <div class="ann" style="margin:10px auto">
          ${ic(timedOut || G.vsBothFailed ? 'alert-triangle' : 'trophy', 18)}
          <span>${timedOut || G.vsBothFailed
            ? `Jawaban benar: <b style="font-family:'Scheherazade New',serif;font-size:20px">${esc(G.target.join(' '))}</b>`
            : (G.playMode === 'versus'
              ? `Pemain ${G.vsTurn + 1} Benar! ${esc(G.lastGainText)} · Total P1: ${vs[0]} · P2: ${vs[1]}`
              : `Benar! ${esc(G.lastGainText)} · Total Skor ${gScore('words')} (beruntun ${gStreak('words')})`)}</span>
        </div>
        <button class="btn" onclick="gameNext()">${matchEnd ? 'Lihat Hasil Akhir' : (lastAyah ? 'Selesai' : (G.playMode === 'versus' ? `Lanjut Giliran Pemain ${nextPlayerNum}` : 'Ayat berikutnya'))} ${ic('arrow-right', 16)}</button>` : `
        <div class="gm-tiles">${G.tiles.map((t, i) => `<button class="gm-tile ${t.used ? 'used' : ''} ${G.shake === i ? 'shake' : ''}" onclick="gamePick(${i})">${esc(t.w)}</button>`).join('')}</div>
        <div class="row" style="margin-top:12px">
          <small style="color:var(--m)">${G.playMode === 'versus' ? `Giliran Pemain ${G.vsTurn + 1} (1x kesempatan)` : `Skor ${gScore('words')} · salah ${G.miss} (-${G.miss * 5} poin)`}</small>
          <button class="btn s" style="margin-left:auto" onclick="gameNext()">Lewati</button>
        </div>`}`;
  }
  function gamePick(i) {
    const t = G.tiles[i];
    if (!t || t.used || G.done) return;
    if (t.w === G.target[G.got.length]) {
      t.used = true;
      G.got.push(t.w);
      G.shake = -1;
      if (G.got.length === G.target.length) {
        G.done = true;
        stopGameTimer();
        const wordPts = G.target.length * 10;
        const normalBonus = G.wordDecoy ? 15 : 0;
        const cleanBonus = (G.playMode === 'solo' && G.miss === 0) ? 10 : 0;
        const missPenalty = (G.playMode === 'solo') ? G.miss * 5 : 0;
        const gained = Math.max(10, wordPts + normalBonus + cleanBonus - missPenalty);
        const parts = [`${G.target.length} kata × 10`];
        if (normalBonus) parts.push(`+${normalBonus} Normal`);
        if (cleanBonus) parts.push(`+${cleanBonus} Tanpa Salah`);
        if (missPenalty) parts.push(`-${missPenalty} Salah`);
        G.lastGainText = `+${gained} poin (${parts.join(', ')})`;

        if (G.playMode === 'versus') {
          const vs = gVsScores('words');
          vs[G.vsTurn] += gained;
          if (!G.vsPassed) G.vsRounds[G.vsTurn]++;
          G.vsNotice = '';
        } else {
          if (!G.miss) setGStreak(gStreak('words') + 1, 'words');
          setGScore(gScore('words') + gained, 'words');
        }
      }
      return paintGame();
    }

    // Kata yang dipilih SALAH
    if (G.playMode === 'versus') {
      stopGameTimer();
      const failedPlayer = G.vsTurn + 1;
      if (!G.vsPassed) G.vsRounds[G.vsTurn]++;
      const nextTurn = (G.vsTurn + 1) % 2;
      if (!G.vsPassed) {
        // Lempar ayat yang sama ke pemain lain sebagai kesempatan tambahan
        G.vsPassed = true;
        G.vsTurn = nextTurn;
        G.got = [];
        G.miss = 0;
        G.shake = -1;
        G.tiles.forEach(tile => { tile.used = false; });
        shuffle(G.tiles);
        G.vsNotice = `Pemain ${failedPlayer} salah memilih kata! Kesempatan hilang, ayat dilempar ke Pemain ${nextTurn + 1}.`;
        startRoundTimer();
      } else {
        // Kedua pemain sudah mencoba ayat ini dan sama-sama gagal
        G.done = true;
        G.vsBothFailed = true;
        G.vsNotice = `Pemain ${failedPlayer} juga salah memilih kata! Kedua pemain gagal pada ayat ini (0 poin).`;
      }
      return paintGame();
    }

    G.miss++;
    setGStreak(0, 'words');
    G.shake = i;
    paintGame();
  }
  function gameNext() {
    stopGameTimer();
    if (!G.done) {
      setGStreak(0, 'words');
      if (G.playMode === 'versus' && !G.vsPassed) G.vsRounds[G.vsTurn]++;
    }
    if (isVersusMatchComplete()) {
      return finishVersusMatch();
    }
    if (G.playMode === 'solo' && G.idx + 2 >= G.ay.length) {
      G.phase = 'idle';
      msg(`Surat selesai! Skor ${gScore('words')}`);
      return paintGame();
    }
    if (G.playMode === 'versus') {
      const nextTurn = G.vsPassed ? G.vsTurn : ((G.vsTurn + 1) % 2);
      const targetPlayer = G.vsRounds[nextTurn] < G.maxRounds ? nextTurn : (G.vsRounds[0] < G.maxRounds ? 0 : 1);
      G.vsTurn = targetPlayer;
      const rIdx = Math.min(G.maxRounds - 1, G.vsRounds[targetPlayer]);
      G.idx = G.vsPairs[rIdx][targetPlayer];
    } else {
      G.idx++;
    }
    roundWords();
  }

  // --- Labirin ---
  function makeMaze(N, braidRatio = 0) {
    const M = Array.from({ length: N * N }, () => ({ w: [true, true, true, true] }));
    const D = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
    const seen = new Set([0]), st = [0];
    while (st.length) {
      const c = st[st.length - 1], x = c % N, y = Math.floor(c / N);
      const nb = D.filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < N && ny < N && !seen.has(ny * N + nx); });
      if (!nb.length) { st.pop(); continue; }
      const [dx, dy, a, b] = nb[Math.floor(Math.random() * nb.length)], n = (y + dy) * N + x + dx;
      M[c].w[a] = false;
      M[n].w[b] = false;
      seen.add(n);
      st.push(n);
    }
    // Tambahkan percabangan & lorong memutar pengecoh pada tingkat Normal
    if (braidRatio > 0) {
      const candidates = shuffle(Array.from({ length: N * N }, (_, i) => i));
      candidates.forEach(c => {
        if (Math.random() > braidRatio) return;
        const x = c % N, y = Math.floor(c / N);
        const closed = shuffle(D.filter(([dx, dy, a]) => {
          const nx = x + dx, ny = y + dy;
          return nx >= 0 && ny >= 0 && nx < N && ny < N && M[c].w[a];
        }));
        if (closed.length) {
          const [dx, dy, a, b] = closed[0];
          const n = (y + dy) * N + x + dx;
          M[c].w[a] = false;
          M[n].w[b] = false;
        }
      });
    }
    return M;
  }
  function solveMaze(M, N) {
    const prev = new Map([[0, -1]]), q = [0], D = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    while (q.length) {
      const c = q.shift();
      if (c === N * N - 1) break;
      D.forEach(([dx, dy], k) => {
        const x = (c % N) + dx, y = Math.floor(c / N) + dy, n = y * N + x;
        if (x >= 0 && y >= 0 && x < N && y < N && !M[c].w[k] && !prev.has(n)) { prev.set(n, c); q.push(n); }
      });
    }
    const p = [];
    for (let c = N * N - 1; c !== -1; c = prev.get(c)) p.unshift(c);
    return p;
  }
  function solveMazeTo(M, N, startCell, targetCell) {
    const prev = new Map([[startCell, -1]]), q = [startCell], D = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    while (q.length) {
      const c = q.shift();
      if (c === targetCell) break;
      D.forEach(([dx, dy], k) => {
        const x = (c % N) + dx, y = Math.floor(c / N) + dy, n = y * N + x;
        if (x >= 0 && y >= 0 && x < N && y < N && !M[c].w[k] && !prev.has(n)) { prev.set(n, c); q.push(n); }
      });
    }
    if (!prev.has(targetCell)) return [];
    const p = [];
    for (let c = targetCell; c !== -1; c = prev.get(c)) p.unshift(c);
    return p;
  }
  function roundMaze() {
    const pool = G.ay.map(wordsOf).filter(w => w.length >= 3 && w.length <= 9);
    if (!pool.length) {
      G.phase = 'error';
      G.err = 'Surat ini tidak punya ayat pendek (3–9 kata). Pilih surat lain.';
      return paintGame();
    }
    let words;
    if (G.playMode === 'versus' && G.vsMazePairs.length) {
      const rIdx = Math.min(G.maxRounds - 1, G.vsRounds[G.vsTurn]);
      words = G.vsMazePairs[rIdx][G.vsTurn];
    } else {
      words = pool[Math.floor(Math.random() * pool.length)];
    }
    const isNormal = !!G.mazeDecoy;
    const N = isNormal ? 7 : (words.length <= 6 ? 6 : 7);
    let M, path;
    for (let t = 0; t < 120; t++) {
      M = makeMaze(N, isNormal ? 0.22 : 0);
      path = solveMaze(M, N);
      if (path.length >= words.length + 2) break;
    }
    // Pastikan panjang jalur cukup menampung seluruh kata pada sel interior (bukan di ▶ atau ★)
    if (path.length < words.length + 2) {
      words = words.slice(0, Math.max(3, path.length - 2));
    }
    const interiorPath = path.slice(1, path.length - 1);
    const lab = {};
    const orderedWordCells = [];
    words.forEach((w, k) => {
      const posIdx = words.length > 1
        ? Math.round(k * (interiorPath.length - 1) / (words.length - 1))
        : Math.floor(interiorPath.length / 2);
      const cellIdx = interiorPath[posIdx];
      lab[cellIdx] = w;
      orderedWordCells.push(cellIdx);
    });
    const onPath = new Set(path);
    const offPathCells = shuffle(M.map((c, k) => k).filter(k => k !== 0 && k !== N * N - 1 && !onPath.has(k)));
    const deadEnds = offPathCells.filter(k => M[k].w.filter(Boolean).length >= 2);

    let decoyGoalCell = -1;

    if (isNormal && (deadEnds.length || offPathCells.length)) {
      // Pilih 1 tujuan ★ alternatif pada ujung cabang lain beserta kata-kata tambahan di luar jalur utama
      const candidates = (deadEnds.length ? deadEnds : offPathCells)
        .map(k => ({ k, altPath: solveMazeTo(M, N, 0, k) }))
        .filter(item => item.altPath.length >= 4)
        .sort((a, b) => b.altPath.length - a.altPath.length);

      const chosen = candidates[0] || { k: (deadEnds[0] ?? offPathCells[0]), altPath: [] };
      decoyGoalCell = chosen.k;

      const usedWords = new Set(words);
      const otherWords = shuffle(
        G.ay.filter(t => wordsOf(t).join(' ') !== words.join(' '))
          .flatMap(wordsOf)
          .filter(w => !usedWords.has(w))
      );

      const branchCells = chosen.altPath.filter(c => c !== 0 && c !== decoyGoalCell && !onPath.has(c) && !lab[c]);
      const branchSlots = branchCells.length
        ? branchCells.filter((_, idx) => idx % 2 === 0 || branchCells.length <= 3).slice(0, 3)
        : offPathCells.filter(c => c !== decoyGoalCell && !lab[c]).slice(0, 2);

      branchSlots.forEach((cellIdx, i) => {
        if (otherWords[i]) lab[cellIdx] = otherWords[i];
      });
    }

    G.ayat = G.ay.findIndex(t => wordsOf(t).join(' ') === words.join(' ')) + 1;
    G.vsNotice = '';
    G.lastGainText = '';
    G.mz = {
      N,
      M,
      lab,
      words,
      pts: [],
      visitedCells: [],
      orderedWordCells,
      wordProgress: 0,
      drawing: false,
      state: 'idle',
      turnLost: false,
      mistakes: 0,
      walls: [],
      cs: 0,
      decoyGoalCell
    };
    G.phase = 'play';
    startRoundTimer();
    paintGame();
  }
  function mazeMsg() {
    const s = G.mz.state;
    if (s === 'win') {
      const vs = gVsScores('maze');
      const info = G.playMode === 'versus'
        ? `Pemain ${G.vsTurn + 1} Menang Ronde! ${esc(G.lastGainText)} · P1: ${vs[0]} · P2: ${vs[1]}`
        : `Selamat! Ayat tersambung. ${esc(G.lastGainText)} · Total Skor ${gScore('maze')}`;
      return `<div class="gm-ar" style="text-align:center">${esc(G.mz.words.join(' '))}</div><b style="color:var(--ok)">${info}</b>`;
    }
    if (s === 'incomplete') return '<b style="color:var(--er)">Jalur belum melewati seluruh kata ayat! Ikuti lorong kata secara lengkap menuju ★.</b>';
    if (s === 'wrongword') return '<b style="color:var(--er)">Salah jalur/kata ayat! Kata tersebut bukan bagian urutan ayat yang benar.</b>';
    if (s === 'decoy') return '<b style="color:var(--er)">Tujuan ★ salah! Itu akhir dari jalur cabang ayat lain.</b>';
    if (s === 'fail') return '<b style="color:var(--er)">Menyentuh dinding labirin!</b>';
    if (s === 'broken') return '<b style="color:var(--er)">Garis terputus sebelum mencapai tujuan ★!</b>';
    if (s === 'timeout') return `<b style="color:var(--er)">Waktu habis! Akhir ayat yang benar: ${esc(G.mz.words[G.mz.words.length - 1])}</b>`;
    return G.mz.decoyGoalCell >= 0
      ? 'Tarik garis tanpa putus dari ▶ ke ★ melewati seluruh kata ayat secara berurutan.'
      : 'Tekan sel ▶ lalu tarik garis menuju ★ melewati seluruh kata ayat tanpa menyentuh dinding.';
  }
  function mazeStatus() { const el = $('#mz-msg'); if (el && G.mz) el.innerHTML = mazeMsg(); }
  function mazeHTML() {
    const hasDecoy = G.mz && G.mz.decoyGoalCell >= 0;
    const ended = G.mz && (G.mz.state === 'win' || G.mz.turnLost);
    const matchEnd = isVersusMatchComplete();
    const nextPlayerNum = ((G.vsTurn + 1) % 2) + 1;
    return `
      ${G.vsNotice ? `<div class="gm-notice">${ic('alert-circle', 17)} <span>${esc(G.vsNotice)}</span></div>` : ''}
      <div class="gm-prev" style="margin-top:0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <small><b>Ayat ke-${G.ayat}</b> (${G.mz.words.length} kata)${G.playMode === 'versus' ? ` · Giliran Pemain ${G.vsTurn + 1}` : ''}</small>

  function drawMaze() {
    const cv = $('#mz'), m = G.mz;
    if (!cv || !m) return;
    if (!G.fontOk && document.fonts) {
      G.fontOk = true;
      document.fonts.load("700 20px 'Scheherazade New'").then(() => { if ($('#mz')) drawMaze(); });
    }
    const W = cv.clientWidth || 360, N = m.N, cs = W / N, dpr = window.devicePixelRatio || 1, px = Math.round(W * dpr);
    if (cv.width !== px) cv.width = cv.height = px;
    const g = cv.getContext('2d'), css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
    const isDark = document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, W);
    m.cs = cs;
    m.walls = [];

    // 1. Latar papan labirin bergaya lembut & ubin sel berpola halus
    const bgGrad = g.createLinearGradient(0, 0, W, W);
    bgGrad.addColorStop(0, isDark ? 'rgba(30,26,64,0.92)' : 'rgba(255,255,255,0.94)');
    bgGrad.addColorStop(1, isDark ? 'rgba(20,17,46,0.96)' : 'rgba(242,239,252,0.96)');
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, W, W);

    const visitedSet = new Set(m.visitedCells || []);
    for (let r = 0; r < N; r++) {
      for (let col = 0; col < N; col++) {
        const idx = r * N + col;
        const x = col * cs + 2, y = r * N === idx ? r * cs + 2 : r * cs + 2, sz = cs - 4;
        g.beginPath();
        g.roundRect(x, y, sz, sz, Math.max(6, cs * 0.16));
        if (idx === 0) {
          g.fillStyle = 'rgba(29, 154, 100, 0.22)';
        } else if (idx === N * N - 1 || idx === m.decoyGoalCell) {
          g.fillStyle = 'rgba(229, 161, 36, 0.22)';
        } else if (visitedSet.has(idx)) {
          g.fillStyle = isDark ? 'rgba(123, 108, 246, 0.22)' : 'rgba(79, 63, 201, 0.11)';
        } else {
          g.fillStyle = isDark ? 'rgba(255, 255, 255, 0.03)' : 'rgba(79, 63, 201, 0.03)';
        }
        g.fill();
      }
    }

    // 2. Dinding labirin tebal dengan bayangan lembut
    g.save();
    g.shadowColor = isDark ? 'rgba(0,0,0,0.45)' : 'rgba(42,32,115,0.18)';
    g.shadowBlur = 4;
    g.shadowOffsetY = 1.5;
    g.strokeStyle = isDark ? '#CFCBFF' : '#26205A';
    g.lineWidth = Math.max(3, cs * 0.075);
    g.lineCap = 'round';
    g.beginPath();
    m.M.forEach((cell, k) => {
      const x = (k % N) * cs, y = Math.floor(k / N) * cs;
      [[x, y, x + cs, y], [x + cs, y, x + cs, y + cs], [x, y + cs, x + cs, y + cs], [x, y, x, y + cs]].forEach((s, i) => {
        if (cell.w[i]) { g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); m.walls.push(s); }
      });
    });
    g.stroke();
    g.restore();

    // 3. Lencana Kata Arab pada setiap sel kata (berubah warna saat dilewati)
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    Object.entries(m.lab).forEach(([k, w]) => {
      const cellIdx = +k;
      const cx = (cellIdx % N + 0.5) * cs;
      const cy = (Math.floor(cellIdx / N) + 0.48) * cs;
      const isPassed = visitedSet.has(cellIdx);

      let f = Math.round(cs * 0.34);
      const font = s => `700 ${s}px 'Scheherazade New','Amiri',serif`;
      g.font = font(f);
      while (g.measureText(w).width > cs * 0.78 && f > 9) g.font = font(--f);
      const tw = Math.min(cs * 0.84, g.measureText(w).width + 12);
      const th = Math.min(cs * 0.54, f * 1.35);

      g.beginPath();
      g.roundRect(cx - tw / 2, cy - th / 2, tw, th, 8);
      g.fillStyle = isPassed
        ? (isDark ? 'rgba(29,154,100,0.34)' : 'rgba(29,154,100,0.18)')
        : (isDark ? 'rgba(38,33,78,0.92)' : 'rgba(255,255,255,0.92)');
      g.fill();
      g.lineWidth = 1.2;
      g.strokeStyle = isPassed ? c('--ok') : (isDark ? 'rgba(255,255,255,0.16)' : 'rgba(79,63,201,0.22)');
      g.stroke();

      g.fillStyle = isPassed ? c('--ok') : c('--p');
      g.fillText(w, cx, cy + 1);
    });

    // 4. Penanda Mulai (▶) dan Tujuan (★)
    g.font = `800 ${Math.round(cs * 0.22)}px 'Plus Jakarta Sans',system-ui,sans-serif`;
    g.fillStyle = c('--ok');
    g.fillText('▶', cs * 0.22, cs * 0.82);

    g.fillStyle = c('--gold');
    g.fillText('★', N * cs - cs * 0.22, N * cs - cs * 0.2);
    if (m.decoyGoalCell >= 0) {
      const dx = (m.decoyGoalCell % N) * cs;
      const dy = Math.floor(m.decoyGoalCell / N) * cs;
      g.fillText('★', dx + cs * 0.78, dy + cs * 0.8);
    }

    // 5. Jejak Garis Pemain dengan Efek Gradasi & Cahaya
    if (m.pts.length > 1) {
      const isBad = m.state === 'fail' || m.state === 'decoy' || m.state === 'wrongword' || m.state === 'incomplete' || m.state === 'broken' || m.state === 'timeout';
      g.save();
      g.lineWidth = Math.max(5, cs * 0.11);
      g.lineJoin = 'round';
      g.lineCap = 'round';
      if (isBad) {
        g.strokeStyle = c('--er');
        g.shadowColor = 'rgba(229,72,77,0.45)';
      } else {
        const lineGrad = g.createLinearGradient(0, 0, W, W);
        lineGrad.addColorStop(0, '#1D9A64');
        lineGrad.addColorStop(0.5, '#7B6CF6');
        lineGrad.addColorStop(1, '#EC4899');
        g.strokeStyle = lineGrad;
        g.shadowColor = 'rgba(123,108,246,0.45)';
      }
      g.shadowBlur = 8;
      g.beginPath();
      m.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.stroke();

      // Titik ujung garis
      const lastPt = m.pts[m.pts.length - 1];
      g.beginPath();
      g.arc(lastPt[0], lastPt[1], Math.max(4.5, cs * 0.09), 0, Math.PI * 2);
      g.fillStyle = isBad ? c('--er') : '#EC4899';
      g.fill();
      g.restore();
    }
    bindMaze(cv);
  }
  function handleMazeFailure(reasonState, versusReasonText) {
    const m = G.mz;
    if (!m) return;
    m.drawing = false;
    m.state = reasonState;
    if (G.playMode === 'versus') {
      stopGameTimer();
      const failedPlayer = G.vsTurn + 1;
      const nextPlayer = ((G.vsTurn + 1) % 2) + 1;
      G.vsRounds[G.vsTurn]++;
      m.turnLost = true;
      G.vsNotice = `${versusReasonText} Kesempatan Pemain ${failedPlayer} hilang (0 poin), dilanjut ke Pemain ${nextPlayer}.`;
      paintGame();
      return;
    }
    m.mistakes = (m.mistakes || 0) + 1;
    mazeStatus();
    drawMaze();
  }
  function bindMaze(cv) {
    if (cv.dataset.bound) return;
    cv.dataset.bound = '1';
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const cellOf = ([x, y]) => {
      const col = Math.min(G.mz.N - 1, Math.max(0, Math.floor(x / G.mz.cs)));
      const row = Math.min(G.mz.N - 1, Math.max(0, Math.floor(y / G.mz.cs)));
      return row * G.mz.N + col;
    };
    const hit = ([x, y]) => G.mz.walls.some(([x1, y1, x2, y2]) => {
      const dx = Math.max(Math.min(x1, x2) - x, 0, x - Math.max(x1, x2)), dy = Math.max(Math.min(y1, y2) - y, 0, y - Math.max(y1, y2));
      return dx * dx + dy * dy < 32;
    });
    cv.addEventListener('pointerdown', e => {
      const m = G.mz, p = pos(e);
      if (m.state === 'win' || m.state === 'timeout' || m.turnLost || cellOf(p) !== 0) return;
      cv.setPointerCapture(e.pointerId);
      Object.assign(m, { drawing: true, pts: [p], visitedCells: [0], wordProgress: 0, state: 'idle' });
      mazeStatus();
      drawMaze();
    });
    cv.addEventListener('pointermove', e => {
      const m = G.mz;
      if (!m || !m.drawing) return;
      const [px, py] = m.pts[m.pts.length - 1], [x, y] = pos(e), n = Math.max(1, Math.ceil(Math.hypot(x - px, y - py) / 3));
      for (let i = 1; i <= n; i++) {
        const p = [px + (x - px) * i / n, py + (y - py) * i / n];
        m.pts.push(p);
        if (hit(p)) {
          return handleMazeFailure('fail', 'Menyentuh dinding labirin!');
        }
        const cIdx = cellOf(p);
        if (!m.visitedCells.includes(cIdx)) {
          m.visitedCells.push(cIdx);
        }
        // Cek apakah menyentuh tujuan cabang yang salah ★
        if (m.decoyGoalCell >= 0 && cIdx === m.decoyGoalCell) {
          return handleMazeFailure('decoy', 'Memilih tujuan ★ cabang yang salah!');
        }

        // Cek apakah melewati kata yang bukan urutan ayat yang benar (termasuk kata dari ayat lain)
        if (m.lab && m.lab[cIdx]) {
          const orderIdx = m.orderedWordCells ? m.orderedWordCells.indexOf(cIdx) : -1;
          if (orderIdx < 0) {
            return handleMazeFailure('wrongword', 'Melewati kata dari ayat lain!');
          } else if (orderIdx === m.wordProgress) {
            m.wordProgress++;
          } else if (orderIdx > m.wordProgress) {
            return handleMazeFailure('wrongword', 'Urutan kata ayat salah / melompati kata!');
          }
        }

        // Mencapai tujuan akhir yang benar ★
        if (cIdx === m.N * m.N - 1) {
          if (m.orderedWordCells && m.wordProgress < m.orderedWordCells.length) {
            return handleMazeFailure('incomplete', 'Melewati jalan pintas tanpa menyambung semua kata ayat!');
          }
          m.drawing = false;
          m.state = 'win';
          stopGameTimer();
          const basePts = 20;
          const wordPts = m.words.length * 5;
          const normalBonus = m.decoyGoalCell >= 0 ? 20 : 0;
          const retryPenalty = G.playMode === 'solo' ? (m.mistakes || 0) * 5 : 0;
          const gained = Math.max(10, basePts + wordPts + normalBonus - retryPenalty);
          const parts = [`${basePts} dasar`, `${m.words.length} kata × 5`];
          if (normalBonus) parts.push(`+${normalBonus} Normal`);
          if (retryPenalty) parts.push(`-${retryPenalty} ulang`);
          G.lastGainText = `+${gained} poin (${parts.join(', ')})`;

          if (G.playMode === 'versus') {
            const vs = gVsScores('maze');
            vs[G.vsTurn] += gained;
            G.vsRounds[G.vsTurn]++;
          } else {
            setGScore(gScore('maze') + gained, 'maze');
          }
          return paintGame();
        }
      }
      mazeStatus();
      drawMaze();
    });
    const up = () => {
      const m = G.mz;
      if (!m || !m.drawing) return;
      m.drawing = false;
      if (m.state !== 'win') {
        handleMazeFailure('broken', 'Garis terputus sebelum mencapai tujuan ★!');
      }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  }

  function initSmoothScrollAndAnimations() {

        if (lenisInstance) {
          if (lenisRafId) cancelAnimationFrame(lenisRafId);

        }
        const shellEl = appEl.querySelector('.shell');

            duration: 1.15,
            easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true
          });
          if (window.ScrollTrigger) lenisInstance.on('scroll', ScrollTrigger.update);
          const raf = time => {
            if (lenisInstance) {
              lenisInstance.raf(time);
              lenisRafId = requestAnimationFrame(raf);
            }
          };
          lenisRafId = requestAnimationFrame(raf);
        }
      }

      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        ScrollTrigger.getAll().forEach(st => st.kill());
        const targets = appEl.querySelectorAll('.hd h1, .hero h2, .card > b, .fc b');
        targets.forEach(el => {
          if (el.dataset.wordsSplit) return;
          el.dataset.wordsSplit = '1';
          const walkAndWrap = node => {
            if (node.nodeType === Node.TEXT_NODE) {
              const text = node.textContent;
              if (!text.trim()) return;
              const frag = document.createDocumentFragment();
              text.split(/(\s+)/).forEach(part => {
                if (!part) return;
                if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
                else {
                  const wrap = document.createElement('span');
                  wrap.className = 'word-wrap';
                  const inner = document.createElement('span');
                  inner.className = 'word-inner';
                  inner.textContent = part;
                  wrap.appendChild(inner);
                  frag.appendChild(wrap);
                }
              });
              node.parentNode.replaceChild(frag, node);
            } else if (node.nodeType === Node.ELEMENT_NODE && !node.hasAttribute('data-lucide') && node.tagName.toLowerCase() !== 'svg') {
              Array.from(node.childNodes).forEach(walkAndWrap);
            }
          };
          walkAndWrap(el);
          const words = el.querySelectorAll('.word-inner');
          if (words.length) {
            gsap.fromTo(words, { yPercent: 110, opacity: 0 }, {
              yPercent: 0,
              opacity: 1,
              duration: 0.65,
              ease: 'power3.out',
              stagger: 0.045,
              scrollTrigger: { trigger: el, scroller: appEl, start: 'top 94%', once: true }
            });
          }
        });
        requestAnimationFrame(() => { if (window.ScrollTrigger) ScrollTrigger.refresh(); });
      }
    } catch (err) {
      console.warn('Animation init skipped:', err);
    }
  }

  const SCROLLERS = '.strip,.cat-pills,.cal-pills,.bn';

  const INDICATORS = [

  ];
  let lastRects = {}, monthShift = 0;
  const SPRING = 'cubic-bezier(.34,1.45,.64,1)';

  function slideIndicators(appEl, pageNav) {
    const rects = {};
    INDICATORS.forEach(([k, sel, nav]) => {
      const e = appEl.querySelector(sel);
      if (!e || !e.getClientRects().length) return;
      const r = e.getBoundingClientRect();
      rects[k] = { x: r.left, y: r.top };
      const p = lastRects[k];
      if (!p || REDUCED || (pageNav && !nav) || (k === 'mon' && monthShift)) return;
      const dx = p.x - r.left, dy = p.y - r.top;
      if (Math.abs(dx) + Math.abs(dy) < 2) return;
      e.animate([{ transform: `translate(${dx}px,${dy}px) scale(.94)` }, { transform: 'translate(0,0) scale(1)' }], { duration: 560, easing: SPRING });
    });
    lastRects = rects;

    if (monthShift && !REDUCED) {
      const ps = [...appEl.querySelectorAll('.cal-pills .cal-mp')];
      if (ps.length > 1) {
        const slot = ps[1].getBoundingClientRect().left - ps[0].getBoundingClientRect().left;
        const dx = Math.max(-5, Math.min(5, monthShift)) * slot, box = ps[0].parentElement;
        box.style.overflow = 'hidden';
        let last;
        ps.forEach(b => {
          last = b.animate([{ transform: `translateX(${dx}px)` }, { transform: 'translateX(0)' }], { duration: 500, easing: 'cubic-bezier(.22,1,.36,1)' });
        });
        last.finished.then(() => { box.style.overflow = ''; }).catch(() => { box.style.overflow = ''; });
      }
    }
    monthShift = 0;
  }

  function glideTo(el, from) {
    el.scrollLeft = from;
    const a = el.querySelector('.on');
    if (!a) return;
    const er = el.getBoundingClientRect(), ar = a.getBoundingClientRect();
    const to = Math.max(0, Math.min(el.scrollWidth - el.clientWidth, from + (ar.left - er.left) - (er.width - ar.width) / 2));
    if (Math.abs(to - from) < 2) return;
    const t0 = performance.now(), D = 520;
    const step = t => {
      const k = Math.min(1, (t - t0) / D);
      el.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k, 3));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function initDragScroll() {
    document.querySelectorAll('.drag-scroll').forEach(el => {
      if (el.dataset.dragBound) return;
      el.dataset.dragBound = '1';
      let isDown = false, moved = false, startX = 0, startY = 0, scrollL = 0, scrollT = 0;
      el.addEventListener('mousedown', e => {
        if (e.button !== 0 || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        isDown = true;
        moved = false;
        startX = e.pageX - el.offsetLeft;
        startY = e.pageY - el.offsetTop;
        scrollL = el.scrollLeft;
        scrollT = el.scrollTop;
      });
      window.addEventListener('mouseup', () => {
        if (!isDown) return;
        isDown = false;
        el.classList.remove('dragging');
      });
      el.addEventListener('mousemove', e => {
        if (!isDown) return;
        const x = e.pageX - el.offsetLeft;
        const y = e.pageY - el.offsetTop;
        const dx = x - startX;
        const dy = y - startY;
        if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          moved = true;
          el.classList.add('dragging');
        }
        if (moved) {
          e.preventDefault();
          el.scrollLeft = scrollL - dx;
          el.scrollTop = scrollT - dy;
        }
      });
      el.addEventListener('click', e => {
        if (moved) {
          e.preventDefault();
          e.stopPropagation();
          moved = false;
        }
      }, true);
    });
  }

  function computeCountdown() {
    const now = new Date();
    const t = iso(now);
    const list = S.imsak || [];
    const rowToday = list.find(x => x.date === t) || list[0];
    if (!rowToday) return { label: 'Hitung Mundur Imsak & Berbuka', timer: S.prefs.city_id ? 'Memuat waktu...' : '-- : -- : --' };
    const parseTime = (dateStr, hm) => {
      const [H, M] = (hm || '00:00').split(':').map(Number);
      const d = new Date(dateStr + 'T00:00:00');
      d.setHours(H, M, 0, 0);
      return d;
    };
    const imsakTime = parseTime(t, rowToday.imsak);
    const maghribTime = parseTime(t, rowToday.maghrib);
    let targetTime, label;
    if (now < imsakTime) {
      targetTime = imsakTime;
      label = `Menuju Imsak (${rowToday.imsak})`;
    } else if (now < maghribTime) {
      targetTime = maghribTime;
      label = `Menuju Berbuka / Maghrib (${rowToday.maghrib})`;
    } else {
      const tomorrow = addD(t, 1);
      const rowNext = list.find(x => x.date === tomorrow) || rowToday;
      targetTime = parseTime(tomorrow, rowNext.imsak);
      label = `Menuju Imsak Esok (${rowNext.imsak})`;
    }
    const diffSec = Math.max(0, Math.floor((targetTime - now) / 1000));
    const hh = String(Math.floor(diffSec / 3600)).padStart(2, '0');
    const mm = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
    const ss = String(diffSec % 60).padStart(2, '0');
    return { label, timer: `${hh} : ${mm} : ${ss}` };
  }

    }, 1000);
  }
