name: Build dan Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Siapkan situs
        run: |
          mkdir _site
          if node bundle-quran.mjs index.html; then
            cp index.offline.html _site/index.html
          else
            echo "::warning::Data Al-Qur'an gagal ditanam, memakai versi online"
            cp index.html _site/index.html
          fi
          cp manifest.json sw.js icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
